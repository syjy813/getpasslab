name: All chapter instant practice browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/InstantQuestionPractice.astro'
      - 'src/config/instantPracticeExplanations.js'
      - 'src/pages/[cert]/[exam]/[subject]/[slug].astro'
      - 'scripts/qa-instant-practice-pilot.cjs'
      - 'scripts/check-instant-practice-coverage.mjs'
      - 'src/layouts/ChapterLayout.astro'
      - '.github/workflows/instant-practice-pilot-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-instant-practice-pilot.mjs
      - run: node scripts/check-instant-practice-coverage.mjs
      - name: Prepare temporary Chromium browser
        run: |
          mkdir -p /tmp/getpasslab-browser-tools
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: QA 320, 390, 1440 pixels and original question popup
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: http://127.0.0.1:4321
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-instant-practice-pilot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-chapter-instant-practice-qa
          path: qa-results/instant-practice-coverage/
          retention-days: 14
