name: Verify batch2 production evidence

on:
  push:
    branches:
      - agent/verify-batch2-production

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: e10d7c59f90084bf63c1f6b9a385cc957a2e9cfd
    steps:
      - name: Verify GitHub Pages deployment run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['DEPLOY_SHA']
          url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=20'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'getpasslab-production-verifier',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          runs = [
              run for run in payload.get('workflow_runs', [])
              if run.get('name') == 'Deploy to GitHub Pages'
          ]
          if not runs:
              raise SystemExit(f'No Pages deployment run found for {sha}')

          run = runs[0]
          print(f"pages_run_id={run['id']}")
          print(f"pages_status={run['status']}")
          print(f"pages_conclusion={run['conclusion']}")
          print(f"pages_created_at={run['created_at']}")
          print(f"pages_updated_at={run['updated_at']}")
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('Pages deployment is not completed/success')
          PY

      - name: Verify production pages and exam trends
        run: |
          python - <<'PY'
          import html
          import time
          import urllib.error
          import urllib.request

          targets = {
              'home': (
                  'https://getpasslab.co.kr/',
                  '산업안전기사',
              ),
              'dust-explosion-factors': (
                  'https://getpasslab.co.kr/industrial-safety/written/chemical/dust-explosion-factors/',
                  '수록 기출 13문항이 전체 14개 회차 중 11개 회차에서 확인되며',
              ),
              'vf-danger-energy': (
                  'https://getpasslab.co.kr/industrial-safety/written/electrical/vf-danger-energy/',
                  '수록 기출 8문항이 전체 14개 회차 중 8개 회차에서 확인되며',
              ),
              'severity-rate': (
                  'https://getpasslab.co.kr/industrial-safety/written/safety-management/severity-rate/',
                  '수록 기출 6문항이 전체 14개 회차 중 6개 회차에서 확인되며',
              ),
              'information-entropy': (
                  'https://getpasslab.co.kr/industrial-safety/written/ergonomics/information-entropy/',
                  '수록 기출 3문항이 전체 14개 회차 중 3개 회차에서 확인되며',
              ),
          }

          for name, (url, expected) in targets.items():
              last_error = None
              for attempt in range(1, 11):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': 'Mozilla/5.0 GetPassLab production verifier',
                              'Cache-Control': 'no-cache',
                          },
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          status = response.status
                          body = response.read().decode('utf-8', errors='replace')
                      decoded = html.unescape(body)
                      if status == 200 and expected in decoded:
                          print(f'{name}: HTTP {status} / expected text PASS')
                          break
                      last_error = f'HTTP {status}, expected text missing={expected not in decoded}'
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last_error = repr(exc)
                  if attempt == 10:
                      raise SystemExit(f'{name}: FAIL after {attempt} attempts: {last_error}')
                  time.sleep(15)
          PY
