name: Facility publication QA
on:
  pull_request:
    branches: [main]
    paths: ['facility-card-spacing/**', 'facility-pictogram-review/**', 'scripts/*facility-card-spacing*', 'scripts/*facility-pictogram-review*', 'scripts/generate-facility-compact-infographic.mjs', 'docs/audits/2026-11-06-facility-card-spacing/**', 'docs/audits/2026-11-06-facility-pictogram-review/**', 'facility-image-refresh/**', 'scripts/*facility-bulk*', 'scripts/facility-pictograms-extended.mjs', 'docs/audits/2026-11-06-facility-image-bulk/**', 'src/**', 'facility-assets/**', 'facility-asset-edits/**', 'docs/audits/2026-11-03-facility-image-border/image-edits.json', 'docs/audits/2026-11-04-facility-gnb-image/image-edits.json', 'astro.config.mjs', 'scripts/generate-facility-infographic.mjs', 'scripts/facility-pictograms.mjs', 'scripts/check-facility-pictogram-geometry.mjs', 'docs/audits/2026-11-06-pictogram-geometry-fix/**', 'scripts/check-facility-card-centering.mjs', 'docs/audits/2026-11-05-facility-card-icons-center/**', 'scripts/test-facility-infographic.mjs', 'docs/standards/facility-infographic-templates/**', 'docs/audits/2026-11-05-facility-card-template-refine/**', 'scripts/check-public-sector-visuals.mjs', 'scripts/read-public-sector-visuals.mjs', 'docs/audits/2026-11-05-public-sector-visuals/**', 'scripts/qa-facility-launch.cjs', 'scripts/qa-facility-drafts.cjs', 'scripts/check-facility-drafts.mjs', 'scripts/check-facility-publication.mjs', 'docs/audits/2026-11-05-facility-publication/**', 'docs/audits/2026-11-05-facility-heading-rollout/**', 'docs/audits/2026-11-04-facility-drafts/**', 'scripts/check-facility-related-links.mjs', 'scripts/check-facility-launch.mjs', 'docs/audits/2026-10-31-facility-launch/review.json.gz', '.github/workflows/facility-launch-qa.yml']
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: publication
            preview: '0'
          - mode: private-preview
            preview: '1'
    env:
      FACILITY_DRAFT_PREVIEW: ${{ matrix.preview }}
      QA_FACILITY_PREVIEW: ${{ matrix.preview }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Korean fonts for SVG-to-WebP rendering
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK KR' | grep -q 'Noto Sans CJK'
      - run: npm run build
      - run: node --test scripts/test-facility-infographic.mjs
      - run: node scripts/check-facility-card-centering.mjs
      - run: node scripts/check-facility-pictogram-geometry.mjs
      - run: node scripts/check-public-sector-visuals.mjs
      - run: node scripts/check-facility-bulk-visuals.mjs
      - run: node scripts/check-facility-card-spacing.mjs
      - run: node scripts/check-facility-pictogram-review.mjs
      - run: node scripts/check-facility-drafts.mjs
      - run: node scripts/check-facility-related-links.mjs
      - run: node scripts/check-hotel-two-parter-publication.mjs
      - run: npm run check:seo
      - run: npm run check:public-content
      - if: matrix.preview == '0'
        run: node scripts/check-facility-launch.mjs
      - run: |
          npm install --prefix /tmp/facility-tools --no-package-lock playwright@1.62.1
          /tmp/facility-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Responsive publication checks
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/facility-tools/node_modules/playwright
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist >/tmp/facility-server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          node scripts/qa-facility-launch.cjs
          node scripts/qa-facility-drafts.cjs
          node scripts/qa-hotel-two-parter.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facility-qa-${{ matrix.mode }}
          path: qa-results/
          retention-days: 14
