name: Computer literacy Production browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-computer-literacy-production.cjs'
      - '.github/workflows/computer-literacy-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install isolated QA dependency
        run: npm install --prefix /tmp/getpasslab-browser-qa --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: /tmp/getpasslab-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify published chapters at mobile and desktop widths
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-qa/node_modules/playwright
        run: node scripts/qa-computer-literacy-production.cjs
      - name: Save measurements and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: computer-literacy-production-browser-qa
          path: qa-results/computer-literacy/
          retention-days: 14
