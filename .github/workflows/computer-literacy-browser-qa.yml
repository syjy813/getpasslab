name: Computer literacy Browser QA runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-computer-literacy-production.cjs'
      - '.github/workflows/computer-literacy-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install isolated QA dependency
        run: npm install --prefix /tmp/getpasslab-browser-qa --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: /tmp/getpasslab-browser-qa/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Package Unicode fallback fonts for local QA
        run: |
          find /usr/share/fonts -type f \( -iname '*unifont*' -o -iname '*wqy*' \) -print0 | tar --null -T - -czf /tmp/browser-fonts.tgz
          sha256sum /tmp/browser-fonts.tgz > /tmp/browser-fonts.sha256
      - name: Save fallback fonts
        uses: actions/upload-artifact@v4
        with:
          name: browser-fallback-fonts
          path: |
            /tmp/browser-fonts.tgz
            /tmp/browser-fonts.sha256
          retention-days: 1
