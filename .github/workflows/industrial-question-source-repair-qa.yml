name: Industrial question source repair QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/questions/industrial-safety.json'
      - 'src/content/chapters/construction/**'
      - 'docs/audits/2026-10-06-industrial-question-source-repair/**'
      - 'scripts/*industrial-question-source-repair*'
      - '.github/workflows/industrial-question-source-repair-qa.yml'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  browser-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-industrial-question-source-repair.mjs
      - name: Prepare browser
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check four chapters and source-restored questions
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            export QA_BASE_URL=https://getpasslab.co.kr
          else
            npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-source-repair-preview.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
              sleep 1
            done
            export QA_BASE_URL=http://127.0.0.1:4321
          fi
          node scripts/qa-industrial-question-source-repair.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-question-source-repair-qa
          path: qa-results/industrial-question-source-repair/
          retention-days: 14
