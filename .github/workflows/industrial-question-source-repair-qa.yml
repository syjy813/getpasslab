name: Industrial question source repair QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/questions/industrial-safety.json'
      - 'src/content/chapters/construction/**'
      - 'docs/audits/2026-10-06-industrial-question-source-repair/**'
      - 'scripts/*industrial-question-source-repair*'
      - 'scripts/*industrial-20190804-review*'
      - 'scripts/read-before-20190804-review.mjs'
      - 'scripts/read-before-clam-shell.mjs'
      - 'scripts/*industrial-unassigned-links*'
      - 'scripts/*formwork-lateral-pressure*'
      - 'scripts/*port-cargo-passages*'
      - 'docs/audits/2026-10-07-port-cargo-passages/**'
      - 'docs/audits/2026-10-07-formwork-lateral-pressure/**'
      - 'docs/audits/2026-10-07-industrial-unassigned-links/**'
      - 'scripts/*clam-shell-chapter*'
      - 'docs/audits/2026-10-07-clam-shell-chapter/**'
      - 'scripts/current-20190804-review.cjs'
      - 'docs/audits/2026-10-06-industrial-20190804-full-review/**'
      - '.github/workflows/industrial-question-source-repair-qa.yml'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  browser-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-industrial-question-source-repair.mjs
      - run: node scripts/check-industrial-20190804-review.mjs
      - run: node scripts/check-clam-shell-chapter.mjs
      - run: node scripts/check-industrial-unassigned-links.mjs
      - run: node scripts/check-formwork-lateral-pressure.mjs
      - run: node scripts/check-port-cargo-passages.mjs
      - name: Prepare browser
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check four chapters and source-restored questions
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            export QA_BASE_URL=https://getpasslab.co.kr
          else
            npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-source-repair-preview.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
              sleep 1
            done
            export QA_BASE_URL=http://127.0.0.1:4321
          fi
          node scripts/qa-industrial-question-source-repair.cjs
          node scripts/qa-industrial-20190804-review.cjs
          node scripts/qa-clam-shell-chapter.cjs
          node scripts/qa-industrial-unassigned-links.cjs
          node scripts/qa-formwork-lateral-pressure.cjs
          node scripts/qa-port-cargo-passages.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-question-source-repair-qa
          path: |
            qa-results/industrial-question-source-repair/
            qa-results/industrial-20190804-review/
            qa-results/clam-shell-chapter/
            qa-results/industrial-unassigned-links/
            qa-results/formwork-lateral-pressure/
            qa-results/port-cargo-passages/
          retention-days: 14
