name: Hobyeongbaekma publication QA
on:
  pull_request:
    branches: [main]
    paths: ['docs/drafts/facility/hobyeongbaekma/**', 'scripts/*hobyeongbaekma*', 'src/content/facility/hobyeongbaekma.md', 'public/images/facility-series/hobyeongbaekma-00/**', 'docs/audits/2026-11-07-hobyeongbaekma-publication/**', '.github/workflows/hobyeongbaekma-review-qa.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate released page and existing public build
        run: |
          npm run build
          npm run check:seo
          npm run check:public-content
          node scripts/check-facility-bulk-visuals.mjs
          node scripts/check-facility-related-links.mjs
          node scripts/check-hobyeongbaekma-publication.mjs
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/hobyeongbaekma-tools --no-package-lock playwright@1.62.1
          /tmp/hobyeongbaekma-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check 320, 390, 768 and 1440px
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/hobyeongbaekma-tools/node_modules/playwright
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist >/tmp/hobyeongbaekma-server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          node scripts/qa-hobyeongbaekma-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hobyeongbaekma-editorial-preview
          path: tmp/hobyeongbaekma-review/
          retention-days: 14
