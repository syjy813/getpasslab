name: Apply PR6 handover

on:
  push:
    branches:
      - 'agent/record-pr6-production-gate'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/record-pr6-production-gate
          fetch-depth: 0

      - name: Update handover
        run: python3 scripts/update-pr6-handover.py

      - name: Validate diff
        run: |
          git diff --check
          grep -Fq '공개 챕터 내부 식별자·운영 문구 정리·production 검증 게이트 완료' AI_HANDOVER.md
          grep -Fq 'docs/audits/2026-08-01-pr6-production-verification.md' AI_HANDOVER.md

      - name: Commit final documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr6-handover.yml
          git rm scripts/update-pr6-handover.py
          git rm docs/audits/pr6-handover-gate.tmp.md
          git add AI_HANDOVER.md docs/audits/2026-08-01-pr6-production-verification.md
          git commit -m "docs: record PR6 production gate"
          git push origin HEAD:agent/record-pr6-production-gate
