name: Verify batch1 production and update handover

on:
  push:
    branches:
      - 'agent/record-batch1-production-gate'

permissions:
  contents: write
  actions: read

env:
  MERGE_SHA: 7898e84ed78d318fec1886daaad00bb0ef67815f
  SITE_ORIGIN: https://getpasslab.co.kr

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/record-batch1-production-gate
          fetch-depth: 0

      - name: Wait for matching GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['MERGE_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/deploy.yml/runs?branch=main&per_page=30'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'getpasslab-production-verifier',
          }

          selected = None
          for attempt in range(40):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              selected = next(
                  (run for run in payload.get('workflow_runs', []) if run.get('head_sha') == sha),
                  None,
              )
              if selected and selected.get('status') == 'completed':
                  break
              print(f'[pages-wait] attempt={attempt + 1} run={selected and selected.get("id")} status={selected and selected.get("status")}')
              time.sleep(15)

          if not selected:
              raise SystemExit(f'No Pages workflow run found for {sha}')
          if selected.get('status') != 'completed' or selected.get('conclusion') != 'success':
              raise SystemExit(
                  f'Pages run failed or incomplete: id={selected.get("id")} '
                  f'status={selected.get("status")} conclusion={selected.get("conclusion")}'
              )

          result = {
              'id': selected['id'],
              'html_url': selected['html_url'],
              'status': selected['status'],
              'conclusion': selected['conclusion'],
              'head_sha': selected['head_sha'],
              'created_at': selected['created_at'],
              'run_started_at': selected.get('run_started_at'),
              'updated_at': selected['updated_at'],
          }
          with open('/tmp/pages-run.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Verify production runtime
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser

          origin = os.environ['SITE_ORIGIN'].rstrip('/')
          urls = {
              'home': f'{origin}/',
              'reactor': f'{origin}/industrial-safety/written/chemical/reactor-distillation-equipment/',
              'valve': f'{origin}/industrial-safety/written/chemical/safety-valve-shutoff-exception/',
              'spontaneous': f'{origin}/industrial-safety/written/chemical/spontaneous-combustion/',
              'signs': f'{origin}/industrial-safety/written/safety-management/safety-signs/',
              'organization': f'{origin}/industrial-safety/written/safety-management/safety-management-organization/',
          }

          class VisibleTextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hidden_depth = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() in {'script', 'style', 'noscript', 'template'}:
                      self.hidden_depth += 1
              def handle_endtag(self, tag):
                  if tag.lower() in {'script', 'style', 'noscript', 'template'} and self.hidden_depth:
                      self.hidden_depth -= 1
              def handle_data(self, data):
                  if not self.hidden_depth:
                      self.parts.append(data)
              def text(self):
                  return re.sub(r'\s+', ' ', html.unescape(' '.join(self.parts))).strip()

          pages = {}
          for name, url in urls.items():
              request = urllib.request.Request(url, headers={'User-Agent': 'GetPassLab production verifier'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read().decode('utf-8', errors='replace')
                  status = response.status
              if status != 200:
                  raise SystemExit(f'{name}: expected HTTP 200, got {status}')
              parser = VisibleTextParser()
              parser.feed(raw)
              pages[name] = {'url': url, 'status': status, 'raw': raw, 'text': parser.text()}

          checks = [
              ('home-title', 'GetPassLab' in pages['home']['text']),
              (
                  'reactor-frequency',
                  '연결 기출 9문항이 전체 14개 회차 중 6개 회차에서 확인' in pages['reactor']['text'],
              ),
              (
                  'valve-comment',
                  '안전밸브 전후 차단밸브 설치 금지 원칙과 허용 예외' in pages['valve']['text'],
              ),
              (
                  'valve-current-source-caution',
                  '현행 실무 적용 전에는 최신' in pages['valve']['text']
                  and '산업안전보건기준에 관한 규칙' in pages['valve']['text'],
              ),
              (
                  'spontaneous-three-points',
                  all(
                      phrase in pages['spontaneous']['text']
                      for phrase in (
                          '산화열·분해열·흡착열·중합열',
                          '발열 속도가 방열 속도를 넘고',
                          '증발열처럼 자연발화 원인으로 보기 어려운 항목',
                      )
                  ),
              ),
              ('spontaneous-old-list-removed', '2022년 3월 시험 96번' not in pages['spontaneous']['text']),
              ('wrong-relation-removed', '20210814_004' not in pages['signs']['raw']),
              ('required-relation-present', '20210814_004' in pages['organization']['raw']),
          ]
          failures = [name for name, passed in checks if not passed]
          if failures:
              raise SystemExit(f'Runtime verification failed: {failures}')

          result = {
              'pages': {name: {'url': page['url'], 'status': page['status']} for name, page in pages.items()},
              'checks': [{'name': name, 'passed': passed} for name, passed in checks],
          }
          with open('/tmp/runtime.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Write verification report and update handover
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          merge_sha = '7898e84ed78d318fec1886daaad00bb0ef67815f'
          pages_run = json.loads(Path('/tmp/pages-run.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('/tmp/runtime.json').read_text(encoding='utf-8'))
          report_path = Path('docs/audits/2026-08-02-exam-content-batch1-production-verification.md')
          report_path.parent.mkdir(parents=True, exist_ok=True)

          page_rows = '\n'.join(
              f"| `{name}` | {info['status']} | PASS |"
              for name, info in runtime['pages'].items()
          )
          check_rows = '\n'.join(
              f"| `{item['name']}` | {'PASS' if item['passed'] else 'FAIL'} |"
              for item in runtime['checks']
          )
          report = f'''# 시험 포인트 첫 개선 배치 production 검증

          - 검증일: 2026-08-02
          - 대상 PR: #8 `content: improve first exam-insight batch`
          - `main` 병합 커밋: `{merge_sha}`
          - 병합 방식: Squash and merge
          - 최종 결과: **PASS**

          ## 1. GitHub Pages 배포

          - workflow run: `{pages_run['id']}`
          - 기준 SHA: `{pages_run['head_sha']}`
          - 상태: `{pages_run['status']} / {pages_run['conclusion']}`
          - 생성 시각: `{pages_run['created_at']}`
          - 시작 시각: `{pages_run['run_started_at']}`
          - 완료 시각: `{pages_run['updated_at']}`

          ## 2. production runtime smoke test

          | 페이지 | HTTP | 결과 |
          |---|---:|---|
          {page_rows}

          ## 3. 세부 확인

          | 검사 | 결과 |
          |---|---|
          {check_rows}

          확인 범위:

          - 빈도 표현이 실제 집계값으로 반영됨.
          - 법령 의존 페이지의 사용자용 출제 경향과 기준일 주의가 반영됨.
          - 자연발화 시험 포인트가 3개 판단 기준으로 압축됨.
          - `20210814_004`가 안전표지 페이지에서 제거되고 안전관리 조직 페이지에 포함됨.

          ## 4. 남은 위험

          - 법령 조문·별표 수치 전 항목의 의미 대조는 `LEGAL_SOURCE_RECHECK_REQUIRED`로 유지.
          - `examComment` 미작성 공개 챕터 전체 보강은 후속 배치로 유지.
          - npm 취약점과 Actions deprecation 경고는 별도 의존성·CI 작업으로 분리.
          '''.replace('          ', '')
          report_path.write_text(report, encoding='utf-8', newline='\n')

          handover = Path('AI_HANDOVER.md')
          text = handover.read_text(encoding='utf-8')
          header_pattern = re.compile(
              r'^> \*\*최초 작성일\*\*: 2026-07-14 / \*\*최종 갱신일\*\*: 2026-08-01 / '
              r'\*\*작성자\*\*: Claude·ChatGPT·Codex / \*\*버전\*\*: v1\.5$',
              re.MULTILINE,
          )
          text, count = header_pattern.subn(
              '> **최초 작성일**: 2026-07-14 / **최종 갱신일**: 2026-08-02 / **작성자**: Claude·ChatGPT·Codex / **버전**: v1.6',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'AI_HANDOVER header replacement count={count}')

          current_old = (
              '- **현재**: 공개 챕터 198개와 정적 페이지 209개를 `getpasslab.co.kr` production에 배포했다. '
              'HTTPS·정책·SEO·AdSense·GA4 코드 통합과 공개 콘텐츠 내부 식별자·운영 문구 정리, '
              '재발 방지 CI 가드의 production 검증까지 완료됐다. AdSense 승인·실제 광고 송출과 '
              'Search Console 색인 상태는 별도 확인이 남았다.'
          )
          current_new = (
              '- **현재**: 공개 챕터 198개와 정적 페이지 209개를 `getpasslab.co.kr` production에 배포했다. '
              'HTTPS·정책·SEO·AdSense·GA4 코드 통합, 공개 콘텐츠 내부 식별자 정리, 첫 시험 인사이트 배치의 '
              '관계·빈도·법령 편집 개선과 production 검증까지 완료됐다. AdSense 승인·실제 광고 송출과 '
              'Search Console 색인 상태는 별도 확인이 남았다.'
          )
          if text.count(current_old) != 1:
              raise SystemExit('AI_HANDOVER current summary target mismatch')
          text = text.replace(current_old, current_new, 1)

          pointer_old = (
              '- **최신 동적 상태**: 문서 맨 아래의 '
              '`공개 챕터 내부 식별자·운영 문구 정리·production 검증 게이트 완료` 절을 우선한다.'
          )
          pointer_new = (
              '- **최신 동적 상태**: 문서 맨 아래의 '
              '`시험 포인트 첫 개선 배치·production 검증 게이트 완료` 절을 우선한다.'
          )
          if text.count(pointer_old) != 1:
              raise SystemExit('AI_HANDOVER latest pointer target mismatch')
          text = text.replace(pointer_old, pointer_new, 1)

          heading = '## 시험 포인트 첫 개선 배치·production 검증 게이트 완료 (2026-08-02)'
          if heading in text:
              raise SystemExit('AI_HANDOVER batch1 gate already exists')
          section = f'''

          {heading}

          이 절은 공개 챕터의 첫 시험 인사이트 개선 배치와 production 상태에 관해 위의 이전 기록보다 최신이다. 실제 저장소·CI·GitHub Pages·runtime 증거로 검증된 사실만 기록한다.

          ### 1. 현재 단계

          - PR #8 `content: improve first exam-insight batch` 완료.
          - Owner 승인 후 Squash and merge로 `main` 반영 완료.
          - `main` 병합 커밋: `{merge_sha}`.
          - GitHub Pages 배포와 대표 runtime 검증: **PASS**.
          - 이번 배치의 Production 상태: **VERIFIED**.
          - 완료된 첫 개선 배치를 다시 수행하지 않는다.

          ### 2. 완료 범위

          - 확정 관계 불일치 8건 제거.
          - 명확한 기존 완료 챕터 5곳으로 관계 이동.
          - 대상이 불명확한 3문항은 임의 관계 없이 미매핑 유지.
          - 5개 챕터의 연결 문항 수·고유 시행 회차 재집계 및 근사·과장 표현 제거.
          - 법령·고시 의존 4개 챕터의 출제 경향과 기준일 주의 보정.
          - `spontaneous-combustion` 회차별 정답 나열을 3개 판단 포인트로 압축.
          - 변경 파일: 챕터 21개, 감사 문서 4개.

          ### 3. 데이터 무결성·빌드 검증

          - 전체 챕터: 250개.
          - 전체 관계: 887건.
          - 존재하지 않는 문항 참조: 0건.
          - 챕터 내부 중복 관계: 0건.
          - `subject_id` 불일치: 0건.
          - `slug`, `subject_id`, `question_id` 무변경.
          - `questions.json` 본문·선택지·정답 무변경.
          - 최종 PR CI:
            - Astro build 성공, 209페이지.
            - SEO 검사 경고 0개·오류 0개.
            - 공개 콘텐츠·원문 무결성 검사 오류 0개.

          ### 4. production 배포·runtime 검증

          - GitHub Pages workflow run: `{pages_run['id']}`.
          - 기준 SHA: `{pages_run['head_sha']}`.
          - 결과: `{pages_run['status']} / {pages_run['conclusion']}`.
          - 빈도 문구, 법령 기준일 주의, 자연발화 시험 포인트, 대표 관계 이동을 production에서 확인.
          - 상세 검증 문서: `docs/audits/2026-08-02-exam-content-batch1-production-verification.md`.

          ### 5. 남은 위험과 다음 작업

          - 법령 조문·별표 수치 전 항목의 의미 대조는 `LEGAL_SOURCE_RECHECK_REQUIRED`로 유지.
          - `examComment` 미작성 공개 챕터 전체 보강은 후속 배치로 유지.
          - Search Console 노출 데이터가 확보된 페이지를 다음 콘텐츠 개선 우선순위에 반영.
          - npm 취약점과 Actions deprecation 경고는 콘텐츠 작업과 분리된 감사에서 처리.

          다음 권장 작업은 남은 `examComment` 미작성 챕터를 빈도·검색 가치·정확성 위험으로 분류하고, 두 번째 개선 배치를 선정하는 것이다.
          '''.replace('          ', '')
          text = text.rstrip() + section + '\n'
          handover.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Validate documentation and remove one-time files
        run: |
          git diff --check
          grep -Fq '시험 포인트 첫 개선 배치·production 검증 게이트 완료' AI_HANDOVER.md
          grep -Fq '2026-08-02-exam-content-batch1-production-verification.md' AI_HANDOVER.md
          rm -f .github/workflows/verify-batch1-production.yml
          rm -f docs/audits/batch1-production-trigger.tmp

      - name: Commit verified gate documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record first exam insight production gate"
          git push origin HEAD:agent/record-batch1-production-gate
