name: SEO validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/public-id-guard' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-id-guard
          fetch-depth: 0

      - name: Apply deterministic content cleanup
        run: |
          python scripts/apply-public-content-cleanup.py
          python scripts/finalize-public-content-cleanup.py

      - name: Remove obsolete patch transport files
        run: rm -f scripts/content-cleanup.part-* scripts/content-cleanup-v2.part-*

      - name: Verify frozen chapter fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('src/content/chapters')
          current = {p.as_posix() for p in root.rglob('*.md')}
          base = set(subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', 'origin/main', 'src/content/chapters'],
              text=True,
          ).splitlines())
          if current != base:
              missing = sorted(base - current)
              added = sorted(current - base)
              raise SystemExit(f'chapter file set changed: missing={missing}, added={added}')

          def frontmatter(text: str) -> str:
              match = re.match(r'\A---\r?\n([\s\S]*?)\r?\n---\r?\n', text)
              if not match:
                  raise ValueError('frontmatter missing')
              return match.group(1)

          def field(block: str, name: str) -> str | None:
              match = re.search(rf'^{re.escape(name)}:\s*(.*?)\s*$', block, re.M)
              return match.group(1) if match else None

          for path_text in sorted(current):
              current_text = Path(path_text).read_text(encoding='utf-8')
              base_text = subprocess.check_output(
                  ['git', 'show', f'origin/main:{path_text}'],
                  text=True,
              )
              current_fm = frontmatter(current_text)
              base_fm = frontmatter(base_text)
              for key in ('slug', 'subject_id', 'questions'):
                  if field(current_fm, key) != field(base_fm, key):
                      raise SystemExit(f'frozen field changed: {path_text} / {key}')
          print('[Frozen fields] slug, subject_id, questions unchanged')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Review diff integrity
        run: |
          git diff --check
          git status --short

      - name: Commit verified content cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/chapters scripts
          git commit -m "content: clean public exam notes"
          git push origin HEAD:agent/public-id-guard
