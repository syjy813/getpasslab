name: SEO validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Package audit snapshot
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf audit-snapshot.tar.gz .

      - name: Upload audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6-audit-snapshot
          path: audit-snapshot.tar.gz
          retention-days: 1
