name: SEO validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Rebuild reviewed content patch
        if: always()
        run: |
          cat scripts/content-cleanup-v2.part-* \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > content-cleanup.patch.bz2
          bzip2 -tv content-cleanup.patch.bz2
          bunzip2 -c content-cleanup.patch.bz2 > content-cleanup.patch

      - name: Upload reviewed content patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-content-patch
          path: |
            content-cleanup.patch
            content-cleanup.patch.bz2
          retention-days: 1
