name: SEO validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/public-id-guard' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-id-guard
          fetch-depth: 0

      - name: Rebuild and verify reviewed patch
        run: |
          cat scripts/content-cleanup.part-* | base64 -d | bunzip2 > /tmp/content-cleanup.patch
          git apply --check /tmp/content-cleanup.patch

      - name: Apply content cleanup and remove temporary files
        run: |
          git apply /tmp/content-cleanup.patch
          git rm scripts/content-cleanup.part-*
          git rm -f .github/workflows/apply-content-cleanup.yml
          cat > .github/workflows/seo-check.yml <<'YAML'
          name: SEO validation

          on:
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Build site
                  run: npm run build

                - name: Validate SEO output
                  run: npm run check:seo

                - name: Validate public content
                  run: npm run check:public-content
          YAML

      - name: Commit reviewed content cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/chapters scripts/check-public-content.mjs .github/workflows/seo-check.yml
          git commit -m "content: clean public exam notes"
          git push origin HEAD:agent/public-id-guard

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content
