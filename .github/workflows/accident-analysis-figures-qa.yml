name: Accident analysis figures QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/chapters/safety-management/accident-analysis-tools.md'
      - 'src/styles/learningFigures.css'
      - 'public/images/industrial-safety/analysis-*.svg'
      - 'docs/audits/2026-10-04-accident-analysis-figures/**'
      - 'scripts/*accident-analysis-figures*'
      - 'scripts/reviewed-chapter-hash.mjs'
      - '.github/workflows/accident-analysis-figures-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check content and regressions
        run: |
          node scripts/check-accident-analysis-figures.mjs
          node scripts/check-industrial-safety-machine-tools-split.mjs
          npm run check:contrast
          npm run check:seo
          npm run check:public-content
          npm run check:deferred-question-content
          npm run check:computer-literacy
          npm run check:computer-literacy-c1
          npm run check:computer-literacy-001-081
          npm run check:computer-literacy-082-159
      - name: Prepare browser and Korean SVG fonts
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check 320px, 390px and 1440px
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: http://127.0.0.1:4321
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-accident-analysis-figures.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accident-analysis-figures-qa
          path: qa-results/accident-analysis-figures/
          retention-days: 14
