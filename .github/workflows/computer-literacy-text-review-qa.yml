name: Computer literacy text review browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/chapters/computer-literacy/**'
      - 'src/components/QuestionHistory.astro'
      - 'src/config/questionCautions.ts'
      - 'src/pages/**'
      - 'scripts/qa-computer-literacy-text-review.cjs'
      - '.github/workflows/computer-literacy-text-review-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare browser in temporary tooling directory
        run: |
          mkdir -p /tmp/getpasslab-browser-tools
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Review the built site at mobile and PC sizes
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: http://127.0.0.1:4321
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-computer-literacy-text-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-literacy-text-review-screenshots
          path: qa-results/computer-literacy-text-review
          retention-days: 14
