name: Finalize public content cleanup

on:
  push:
    branches:
      - agent/public-id-guard

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-id-guard
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed public content cleanup
        run: python3 scripts/finalize-public-content-cleanup.py

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Remove temporary migration tools
        run: |
          rm -f scripts/finalize-public-content-cleanup.py
          rm -f scripts/apply-reviewed-content-cleanup.py
          rm -f scripts/content-cleanup.part-* scripts/content-cleanup-v2.part-*
          rm -f .github/workflows/apply-content-cleanup.yml
          rm -f .github/workflows/finalize-public-content-cleanup.yml

      - name: Restore permanent validation workflow
        run: |
          cat > .github/workflows/seo-check.yml <<'YAML'
          name: SEO validation

          on:
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Build site
                  run: npm run build

                - name: Validate SEO output
                  run: npm run check:seo

                - name: Validate public content
                  run: npm run check:public-content
          YAML

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "content: finalize public exam notes cleanup"
          git push origin HEAD:agent/public-id-guard
