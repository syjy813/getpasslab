name: Apply batch1 legal and editorial wording

on:
  push:
    branches:
      - 'agent/exam-content-batch-1'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/exam-content-batch-1
          fetch-depth: 0

      - name: Confirm prior phases completed
        run: |
          test -f docs/audits/2026-08-01-exam-content-batch1-relations.md
          test -f docs/audits/2026-08-01-exam-content-batch1-frequency.md
          git log -1 --pretty=%s | grep -Fq 'content: correct first exam insight frequencies'

      - name: Check current official source endpoints
        run: |
          mkdir -p /tmp/legal-sources
          curl -fL --retry 3 --connect-timeout 20 --max-time 90 \
            'https://www.law.go.kr/법령/산업안전보건기준에관한규칙' \
            -o /tmp/legal-sources/safety-rules.html
          curl -fL --retry 3 --connect-timeout 20 --max-time 90 \
            'https://www.law.go.kr/행정규칙/건설업산업안전보건관리비계상및사용기준' \
            -o /tmp/legal-sources/construction-safety-cost.html
          test $(wc -c < /tmp/legal-sources/safety-rules.html) -gt 5000
          test $(wc -c < /tmp/legal-sources/construction-safety-cost.html) -gt 5000
          grep -Fq '산업안전보건기준' /tmp/legal-sources/safety-rules.html
          grep -Fq '산업안전보건관리비' /tmp/legal-sources/construction-safety-cost.html
          sha256sum /tmp/legal-sources/*.html | tee /tmp/legal-sources/sha256.txt

      - name: Improve legal scope and editorial focus
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          ROOT = Path('src/content/chapters')
          REPORT = Path('docs/audits/2026-08-01-exam-content-batch1-legal-editorial.md')

          TARGETS = {
              'safety-valve-shutoff-exception': {
                  'comment': '안전밸브 전후 차단밸브 설치 금지 원칙과 허용 예외를 설비 조건에 맞춰 구분하는 법령형이 확인된다.',
                  'source': '「산업안전보건기준에 관한 규칙」',
              },
              'excavation-slope-standard': {
                  'comment': '지반 종류와 굴착면 높이에 따라 기울기 기준을 연결하는 수치 판별형이 중심이다.',
                  'source': '「산업안전보건기준에 관한 규칙」',
              },
              'safety-management-cost': {
                  'comment': '공사 종류·대상액·계상률을 연결하는 계산형과 사용 가능 항목을 구분하는 유형이 확인된다.',
                  'source': '「건설업 산업안전보건관리비 계상 및 사용기준」',
              },
              'welder-shock-protector': {
                  'comment': '자동전격방지기의 설치 대상과 작동·전압 조건을 구분하는 수치 판별형이 반복된다.',
                  'source': '「산업안전보건기준에 관한 규칙」',
              },
          }

          FRONT_RE = re.compile(r'\A---\n(?P<meta>[\s\S]*?)\n---\n(?P<body>[\s\S]*)\Z')
          SLUG_RE = re.compile(r'^slug:\s*(.+?)\s*$', re.MULTILINE)
          SUBJECT_RE = re.compile(r'^subject_id:\s*(\d+)\s*$', re.MULTILINE)
          STATUS_RE = re.compile(r'^status:\s*(.+?)\s*$', re.MULTILINE)
          QUESTIONS_RE = re.compile(r'^questions:\s*\[(.*?)\]\s*$', re.MULTILINE)
          EXAM_RE = re.compile(r'^examComment:\s*(.*?)\s*$', re.MULTILINE)

          def load_chapters():
              result = {}
              for path in ROOT.rglob('*.md'):
                  text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
                  match = FRONT_RE.match(text)
                  if not match:
                      raise RuntimeError(f'frontmatter parse failure: {path}')
                  meta, body = match.group('meta'), match.group('body')
                  slug = SLUG_RE.search(meta).group(1).strip().strip("'\"")
                  result[slug] = {'path': path, 'text': text, 'meta': meta, 'body': body}
              return result

          chapters = load_chapters()
          before = {}
          changed = []

          for slug, rule in TARGETS.items():
              if slug not in chapters:
                  raise RuntimeError(f'target missing: {slug}')
              item = chapters[slug]
              meta, body = item['meta'], item['body']
              before[slug] = (
                  SLUG_RE.search(meta).group(1).strip(),
                  SUBJECT_RE.search(meta).group(1),
                  STATUS_RE.search(meta).group(1).strip(),
                  QUESTIONS_RE.search(meta).group(1).strip(),
              )
              if EXAM_RE.search(meta):
                  meta = EXAM_RE.sub(f"examComment: {rule['comment']}", meta, count=1)
              else:
                  meta = meta.rstrip() + f"\nexamComment: {rule['comment']}"

              caution = (
                  f"> **기준일 주의**  이 페이지는 연결 기출의 출제 기준을 학습용으로 정리한다. "
                  f"현행 실무 적용 전에는 최신 {rule['source']}을 확인한다."
              )
              if '> **기준일 주의**' not in body:
                  marker = '\n## 자주 틀리는 포인트\n'
                  if marker not in body:
                      raise RuntimeError(f'caution insertion marker missing: {slug}')
                  body = body.replace(marker, f'\n{caution}\n{marker}', 1)

              new_text = f'---\n{meta}\n---\n{body}'
              item['path'].write_text(new_text, encoding='utf-8', newline='\n')
              changed.append(slug)

          spontaneous = chapters.get('spontaneous-combustion')
          if not spontaneous:
              raise RuntimeError('spontaneous-combustion missing')
          meta, body = spontaneous['meta'], spontaneous['body']
          before['spontaneous-combustion'] = (
              SLUG_RE.search(meta).group(1).strip(),
              SUBJECT_RE.search(meta).group(1),
              STATUS_RE.search(meta).group(1).strip(),
              QUESTIONS_RE.search(meta).group(1).strip(),
          )
          replacement = '''## 시험 포인트

- 산화열·분해열·흡착열·중합열 가운데 물질과 저장 조건에 맞는 축열 원인을 구분한다.
- 발열 속도가 방열 속도를 넘고 열이 축적되는 조건이 자연발화 판단의 핵심이다.
- “거리가 먼 것” 문제에서는 증발열처럼 자연발화 원인으로 보기 어려운 항목을 찾는다.

## 자주 틀리는 포인트'''
          body, count = re.subn(
              r'## 시험 포인트\n[\s\S]*?\n## 자주 틀리는 포인트',
              replacement,
              body,
              count=1,
          )
          if count != 1:
              raise RuntimeError('spontaneous-combustion exam point section not replaced')
          spontaneous['path'].write_text(f'---\n{meta}\n---\n{body}', encoding='utf-8', newline='\n')
          changed.append('spontaneous-combustion')

          for slug in changed:
              path = chapters[slug]['path']
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              match = FRONT_RE.match(text)
              meta = match.group('meta')
              frozen = (
                  SLUG_RE.search(meta).group(1).strip(),
                  SUBJECT_RE.search(meta).group(1),
                  STATUS_RE.search(meta).group(1).strip(),
                  QUESTIONS_RE.search(meta).group(1).strip(),
              )
              if frozen != before[slug]:
                  raise RuntimeError(f'frozen metadata or relations changed: {slug}')

          source_hashes = []
          for filename in ('safety-rules.html', 'construction-safety-cost.html'):
              path = Path('/tmp/legal-sources') / filename
              source_hashes.append((filename, hashlib.sha256(path.read_bytes()).hexdigest(), path.stat().st_size))

          REPORT.parent.mkdir(parents=True, exist_ok=True)
          lines = [
              '# 시험 포인트 첫 개선 배치 — 법령 범위·편집 고위험 정리',
              '',
              '- 작업일: 2026-08-01',
              '- 공식 출처 접근 확인: 국가법령정보센터',
              '- 판정: 사용자용 출제 경향과 기준일 주의를 보정하되, 조문·별표의 수치 자체는 이번 단계에서 임의 변경하지 않음',
              '',
              '## 공식 출처',
              '',
              '- 「산업안전보건기준에 관한 규칙」: https://www.law.go.kr/법령/산업안전보건기준에관한규칙',
              '- 「건설업 산업안전보건관리비 계상 및 사용기준」: https://www.law.go.kr/행정규칙/건설업산업안전보건관리비계상및사용기준',
              '',
              '| 저장 파일 | 응답 크기 | SHA-256 |',
              '|---|---:|---|',
          ]
          for filename, digest, size in source_hashes:
              lines.append(f'| `{filename}` | {size} bytes | `{digest}` |')
          lines.extend([
              '',
              '## 변경 결과',
              '',
              '- `safety-valve-shutoff-exception`: 차단밸브 금지 원칙과 허용 예외 구분 중심으로 출제 경향 보정.',
              '- `excavation-slope-standard`: 지반·높이별 기울기 수치 판별 중심으로 출제 경향 보정.',
              '- `safety-management-cost`: 공사 종류·대상액·계상률·사용 항목 판별 중심으로 출제 경향 보정.',
              '- `welder-shock-protector`: 설치 대상·작동·전압 조건 판별 중심으로 출제 경향 보정.',
              '- 위 4개 법령·고시 의존 페이지에 현행 실무 적용 전 최신 공식 출처 확인 문구 추가.',
              '- `spontaneous-combustion`: 회차별 정답 나열을 축열 원인·열수지·부정형 함정 3개 포인트로 압축.',
              '',
              '## 남은 위험',
              '',
              '- 공식 출처의 현재 페이지 접근성과 적용 문서 범위는 확인했으나, 각 조문·별표 수치의 전 항목 의미 대조는 별도 `LEGAL_SOURCE_RECHECK_REQUIRED`로 유지한다.',
              '- 이번 변경은 `slug`, `subject_id`, `questions` 관계, 기출 DB, 법령 수치를 변경하지 않는다.',
          ])
          REPORT.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print('[batch1-legal-editorial] updated=5 official_sources=2')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Validate diff formatting
        run: git diff --check

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-batch1-legal-editorial.yml
          git add src/content/chapters docs/audits/2026-08-01-exam-content-batch1-legal-editorial.md
          git commit -m "content: refine first legal exam insights"
          git push origin HEAD:agent/exam-content-batch-1
