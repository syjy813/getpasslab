name: Apply batch1 frequency wording

on:
  push:
    branches:
      - 'agent/exam-content-batch-1'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/exam-content-batch-1
          fetch-depth: 0

      - name: Confirm relation phase completed
        run: |
          test -f docs/audits/2026-08-01-exam-content-batch1-relations.md
          git log -1 --pretty=%s | grep -Fq 'fix: reconcile first exam insight relations'

      - name: Recalculate and correct frequency wording
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path('src/content/chapters')
          QUESTIONS_PATH = Path('src/data/questions.json')
          REPORT_PATH = Path('docs/audits/2026-08-01-exam-content-batch1-frequency.md')

          TARGETS = {
              'reactor-distillation-equipment': {
                  'expected_questions': 9,
                  'expected_sessions': 6,
                  'detail': '반응기·증류설비의 구조 분류와 설계·운전 조건을 구분하는 유형이 중심이다.',
              },
              'steel-pipe-scaffold': {
                  'expected_questions': 9,
                  'expected_sessions': 8,
                  'detail': '기둥·띠장 간격과 벽이음 등 수치를 바꾼 판별형이 반복된다.',
              },
              'temporary-passage-stairs': {
                  'expected_questions': 9,
                  'expected_sessions': 7,
                  'detail': '가설통로·사다리식 통로의 경사·폭·발판·추락방지 조건을 구분하는 유형이 반복된다.',
              },
              'static-occurrence-factors': {
                  'expected_questions': 8,
                  'expected_sessions': 8,
                  'detail': '마찰·박리·유동·분출 등 정전기 발생 유형을 사례와 연결하는 문제가 반복된다.',
              },
              'accident-ratio-law': {
                  'expected_questions': 5,
                  'expected_sessions': 5,
                  'detail': '하인리히·버드 재해비율의 숫자 대응과 적용 대상을 구분하는 유형이 중심이다.',
              },
          }

          FRONT_RE = re.compile(r'\A---\n(?P<meta>[\s\S]*?)\n---\n(?P<body>[\s\S]*)\Z')
          QUESTIONS_RE = re.compile(r'^questions:\s*\[(.*?)\]\s*$', re.MULTILINE)
          SLUG_RE = re.compile(r'^slug:\s*(.+?)\s*$', re.MULTILINE)
          SUBJECT_RE = re.compile(r'^subject_id:\s*(\d+)\s*$', re.MULTILINE)
          STATUS_RE = re.compile(r'^status:\s*(.+?)\s*$', re.MULTILINE)
          EXAM_RE = re.compile(r'^examComment:\s*(.*?)\s*$', re.MULTILINE)

          raw = json.loads(QUESTIONS_PATH.read_text(encoding='utf-8'))
          rows = raw if isinstance(raw, list) else raw['questions']
          question_by_id = {row['id']: row for row in rows}
          all_sessions = sorted({row['date'] for row in rows})
          if len(all_sessions) != 14:
              raise RuntimeError(f'unexpected total exam sessions: {len(all_sessions)}')

          path_by_slug = {}
          before_frozen = {}
          for path in ROOT.rglob('*.md'):
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              match = FRONT_RE.match(text)
              if not match:
                  raise RuntimeError(f'frontmatter parse failure: {path}')
              meta = match.group('meta')
              slug = SLUG_RE.search(meta).group(1).strip().strip("'\"")
              subject = SUBJECT_RE.search(meta).group(1)
              status = STATUS_RE.search(meta).group(1).strip()
              path_by_slug[slug] = path
              before_frozen[slug] = (slug, subject, status)

          report_rows = []
          for slug, rule in TARGETS.items():
              path = path_by_slug.get(slug)
              if not path:
                  raise RuntimeError(f'target chapter missing: {slug}')
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              match = FRONT_RE.match(text)
              meta, body = match.group('meta'), match.group('body')
              qmatch = QUESTIONS_RE.search(meta)
              if not qmatch:
                  raise RuntimeError(f'questions missing: {slug}')
              ids = [item.strip().strip("'\"") for item in qmatch.group(1).split(',') if item.strip()]
              if any(question_id not in question_by_id for question_id in ids):
                  raise RuntimeError(f'missing question relation: {slug}')
              sessions = sorted({question_by_id[question_id]['date'] for question_id in ids})
              if len(ids) != rule['expected_questions'] or len(sessions) != rule['expected_sessions']:
                  raise RuntimeError(
                      f'audit count changed: {slug} questions={len(ids)} sessions={len(sessions)} '
                      f"expected={rule['expected_questions']}/{rule['expected_sessions']}"
                  )

              old_comment = EXAM_RE.search(meta).group(1).strip() if EXAM_RE.search(meta) else ''
              new_comment = (
                  f"연결 기출 {len(ids)}문항이 전체 {len(all_sessions)}개 회차 중 {len(sessions)}개 회차에서 확인되며, "
                  f"{rule['detail']}"
              )
              if EXAM_RE.search(meta):
                  new_meta = EXAM_RE.sub(f'examComment: {new_comment}', meta, count=1)
              else:
                  new_meta = meta.rstrip() + f'\nexamComment: {new_comment}'
              new_text = f'---\n{new_meta}\n---\n{body}'
              path.write_text(new_text, encoding='utf-8', newline='\n')
              report_rows.append((slug, len(ids), len(sessions), old_comment, new_comment))

          for slug in TARGETS:
              path = path_by_slug[slug]
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              meta = FRONT_RE.match(text).group('meta')
              frozen = (
                  SLUG_RE.search(meta).group(1).strip().strip("'\""),
                  SUBJECT_RE.search(meta).group(1),
                  STATUS_RE.search(meta).group(1).strip(),
              )
              if frozen != before_frozen[slug]:
                  raise RuntimeError(f'frozen metadata changed: {slug}')
              comment = EXAM_RE.search(meta).group(1)
              if any(term in comment for term in ('매 회차', '거의 매 회차', '최빈출', '최다 빈출', '최근')):
                  raise RuntimeError(f'imprecise frequency wording remains: {slug} / {comment}')

          REPORT_PATH.parent.mkdir(parents=True, exist_ok=True)
          lines = [
              '# 시험 포인트 첫 개선 배치 — 빈도 표현 정밀화',
              '',
              '- 작업일: 2026-08-01',
              '- 전체 데이터 회차: 14개',
              '- 대상: T0 감사에서 근사·과장 표현이 확인된 5개 챕터',
              '',
              '| 챕터 | 연결 문항 | 확인 회차 | 교정 결과 |',
              '|---|---:|---:|---|',
          ]
          for slug, qcount, scount, old_comment, new_comment in report_rows:
              lines.append(f'| `{slug}` | {qcount} | {scount}/14 | {new_comment} |')
          lines.extend([
              '',
              '## 검증',
              '',
              '- frontmatter의 `slug`, `subject_id`, `status`, `questions` 관계 무변경.',
              '- 연결 문항 수와 고유 시행일 수를 `questions.json`에서 재집계.',
              '- `매 회차`, `거의 매 회차`, `최빈출`, `최다 빈출`, 상대시점 `최근` 표현 제거.',
          ])
          REPORT_PATH.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print('[batch1-frequency] updated=5 total_sessions=14')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Validate diff formatting
        run: git diff --check

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-batch1-frequency.yml
          git add src/content/chapters docs/audits/2026-08-01-exam-content-batch1-frequency.md
          git commit -m "content: correct first exam insight frequencies"
          git push origin HEAD:agent/exam-content-batch-1
