name: Temporary near-add relation retry

on:
  push:
    branches:
      - work/industrial-safety-near-add-20260816

permissions:
  contents: write

jobs:
  retry-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/industrial-safety-near-add-20260816
          fetch-depth: 0

      - name: Reuse reviewed patch with emphasis fix
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/tmp-near-add-relations.yml').read_text(encoding='utf-8')
          start_marker = '        run: |\n'
          section = source.index('      - name: Apply reviewed content and relations\n')
          start = source.index(start_marker, section) + len(start_marker)
          end = source.index('\n      - name: Install dependencies', start)
          block = source[start:end]
          code = textwrap.dedent(block)
          old = '**자아실현 욕구(5단계)**임'
          new = '<strong>자아실현 욕구(5단계)</strong>임'
          if code.count(old) != 1:
              raise SystemExit(f'STOP: expected emphasis marker count=1, actual={code.count(old)}')
          code = code.replace(old, new, 1)
          exec(compile(code, '<reviewed-near-add-patch>', 'exec'), {})

      - name: Install dependencies
        run: npm ci

      - name: Build and standard validation
        run: |
          npm run build
          npm run check:seo
          npm run check:public-content

      - name: Relation QA
        shell: python
        run: |
          import json, re
          from collections import Counter
          from pathlib import Path

          expected = {
              'motivation-theories': ['20180428_011','20190427_006','20200822_008','20210814_014','20220424_001'],
              'compatibility': ['20190804_028','20200822_038','20220305_039','20220424_036'],
              'anthropometry-design': ['20190303_032','20200926_031'],
              'machine-tools-safety': ['20190427_053','20220305_044'],
              'spontaneous-combustion': ['20190303_094'],
          }
          holds = {'20180304_048','20180304_061','20190804_072','20200606_079','20180304_073','20210307_101'}
          questions = json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          qmap = {q['id']: q for q in questions}
          assert len(questions) == 1680 and len(qmap) == 1680

          refs = []
          by_slug = {}
          for f in Path('dist/industrial-safety/written').rglob('index.html'):
              rel = f.relative_to('dist/industrial-safety/written')
              if len(rel.parts) != 3:
                  continue
              ids = re.findall(r'data-open="(\d{8}_\d{3})"', f.read_text(encoding='utf-8', errors='ignore'))
              by_slug[rel.parts[1]] = ids
              refs.extend(ids)

          for slug, ids in expected.items():
              for qid in ids:
                  if by_slug.get(slug, []).count(qid) != 1:
                      raise SystemExit(f'STOP: {qid} missing/duplicate in {slug}')
                  if qmap[qid]['subject_id'] != {'motivation-theories':1,'compatibility':2,'anthropometry-design':2,'machine-tools-safety':3,'spontaneous-combustion':5}[slug]:
                      raise SystemExit(f'STOP: subject mismatch {qid}')

          mapped = set(refs)
          if holds & mapped:
              raise SystemExit(f'STOP: hold unexpectedly mapped: {sorted(holds & mapped)}')
          counts = Counter(refs)
          actual = (len(refs), len(mapped), 1680-len(mapped), sum(c > 1 for c in counts.values()))
          expected_counts = (978, 968, 712, 10)
          if actual != expected_counts:
              raise SystemExit(f'STOP: relation counts {actual} != {expected_counts}')
          print(f'RELATION QA PASS refs={actual[0]} unique={actual[1]} unmapped={actual[2]} multi={actual[3]}')

      - name: Validator regex regression
        run: |
          node --input-type=module - <<'NODE'
          const p = /Git(?:Hub)?\s*저장소|코드\s*저장소|프로젝트\s*저장소|저장소\s*(?:정본|기준|경로|브랜치|커밋)/gi;
          for (const text of ['Git 저장소', 'GitHub 저장소', '프로젝트 저장소', '저장소 기준']) {
            p.lastIndex = 0;
            if (!p.test(text)) throw new Error(`internal phrase not caught: ${text}`);
          }
          p.lastIndex = 0;
          if (p.test('저장소 등의 주위 온도를 낮게 한다.')) throw new Error('legitimate exam wording still blocked');
          console.log('VALIDATOR REGRESSION PASS');
          NODE

      - name: Verify scope
        run: |
          git diff --check
          printf '%s\n' \
            docs/audits/2026-08-16-industrial-safety-near-add-review.md \
            scripts/check-public-content.mjs \
            src/content/chapters/chemical/spontaneous-combustion.md \
            src/content/chapters/ergonomics/anthropometry-design.md \
            src/content/chapters/ergonomics/compatibility.md \
            src/content/chapters/mechanical/machine-tools-safety.md \
            src/content/chapters/safety-management/motivation-theories.md \
            | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit reviewed batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audits/2026-08-16-industrial-safety-near-add-review.md \
            scripts/check-public-content.mjs \
            src/content/chapters/chemical/spontaneous-combustion.md \
            src/content/chapters/ergonomics/anthropometry-design.md \
            src/content/chapters/ergonomics/compatibility.md \
            src/content/chapters/mechanical/machine-tools-safety.md \
            src/content/chapters/safety-management/motivation-theories.md
          git commit -m 'feat: expand verified industrial safety relations'
          git push origin HEAD:work/industrial-safety-near-add-20260816
