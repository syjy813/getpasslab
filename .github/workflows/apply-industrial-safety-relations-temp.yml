name: Temporary industrial safety relation apply

on:
  push:
    branches: [work/industrial-safety-relations-20260815]

permissions:
  contents: write

concurrency:
  group: industrial-safety-relation-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Dry-run relation patch
        run: python scripts/apply-industrial-safety-relations-20260815.py

      - name: Apply verified relations
        run: python scripts/apply-industrial-safety-relations-20260815.py --apply

      - name: Validate changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat > /tmp/expected.txt <<'EOF'
          src/content/chapters/chemical/complete-combustion-cst.md
          src/content/chapters/chemical/purge-inerting.md
          src/content/chapters/chemical/reactive-dangerous-gases.md
          src/content/chapters/chemical/spontaneous-combustion.md
          src/content/chapters/construction/safety-handrail-structure.md
          src/content/chapters/construction/soil-test-types.md
          src/content/chapters/construction/temporary-structure-defects.md
          src/content/chapters/electrical/leakage-breaker-types.md
          src/content/chapters/electrical/max-leakage-current.md
          src/content/chapters/ergonomics/anthropometry-design.md
          src/content/chapters/ergonomics/availability.md
          src/content/chapters/ergonomics/compatibility.md
          src/content/chapters/ergonomics/fta-symbols.md
          src/content/chapters/mechanical/boiler-safety-devices.md
          src/content/chapters/safety-management/leadership-headship.md
          src/content/chapters/safety-management/learning-theories.md
          src/content/chapters/safety-management/safety-management-organization.md
          src/content/chapters/safety-management/severity-rate.md
          src/content/chapters/safety-management/twi-supervisor-training.md
          EOF
          git diff --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Validate relation integrity
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          qdata = json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          qmap = {q['id']: int(q['subject_id']) for q in qdata}
          assert len(qdata) == 1680
          assert len(qmap) == 1680

          target = {
            'anthropometry-design': ['20200606_021'],
            'availability': ['20210814_040'],
            'boiler-safety-devices': ['20210307_051'],
            'compatibility': ['20180304_032','20180428_028'],
            'complete-combustion-cst': ['20200822_097'],
            'fta-symbols': ['20210515_039'],
            'leadership-headship': ['20210515_002'],
            'leakage-breaker-types': ['20190303_073'],
            'learning-theories': ['20210307_015','20210515_016'],
            'max-leakage-current': ['20180819_074'],
            'purge-inerting': ['20190427_085','20200926_086','20210814_082'],
            'reactive-dangerous-gases': ['20200822_087'],
            'safety-handrail-structure': ['20190427_112'],
            'safety-management-organization': ['20180304_010','20190427_004'],
            'severity-rate': ['20180428_015'],
            'soil-test-types': ['20200926_104'],
            'spontaneous-combustion': ['20190303_094'],
            'temporary-structure-defects': ['20220305_114'],
            'twi-supervisor-training': ['20190303_001'],
          }

          seen_target = set()
          for p in Path('src/content/chapters').rglob('*.md'):
            text = p.read_text(encoding='utf-8')
            fm = text.split('---', 2)[1] if text.startswith('---') else ''
            sm = re.search(r'^slug:\s*(.+?)\s*$', fm, re.M)
            im = re.search(r'^subject_id:\s*(\d+)\s*$', fm, re.M)
            qm = re.search(r'^questions:\s*\[(.*?)\]\s*$', fm, re.M)
            if not sm or not im or not qm:
              continue
            slug = sm.group(1).strip().strip('"\'')
            sid = int(im.group(1))
            qids = [x.strip() for x in qm.group(1).split(',') if x.strip()]
            assert len(qids) == len(set(qids)), f'duplicate relation in {slug}'
            for qid in qids:
              if qid in qmap:
                assert qmap[qid] == sid, f'subject mismatch {qid} -> {slug}'
            for qid in target.get(slug, []):
              assert qid in qmap, f'target question missing from industrial safety data: {qid}'
              assert qmap[qid] == sid, f'target subject mismatch {qid} -> {slug}'
              assert qids.count(qid) == 1, f'target relation missing {qid} -> {slug}'
              seen_target.add((slug, qid))

          assert len(seen_target) == 24, len(seen_target)
          print('relation integrity PASS; 24 target relations present')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build candidate site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Capture candidate public-content result
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run check:public-content 2>&1 | tee /tmp/candidate-public.log
          candidate_status=${PIPESTATUS[0]}
          set -e
          grep '^\[Public content error\]' /tmp/candidate-public.log | sort > /tmp/candidate-errors.txt || true
          echo "candidate public-content exit: ${candidate_status}"
          echo "candidate errors:"
          cat /tmp/candidate-errors.txt

      - name: Validate candidate built relation counts
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          refs=[]
          pages=0
          root=Path('dist/industrial-safety/written')
          for p in root.rglob('index.html'):
            rel=p.relative_to(root)
            if len(rel.parts) != 3:
              continue
            pages += 1
            refs += re.findall(r'data-open="(\d{8}_\d{3})"', p.read_text(encoding='utf-8', errors='ignore'))
          unique=set(refs)
          counts=Counter(refs)
          multi=sum(1 for c in counts.values() if c > 1)
          unmapped=1680-len(unique)
          print({'chapter_pages':pages,'relation_refs':len(refs),'unique_mapped':len(unique),'unmapped':unmapped,'multi_mapped':multi})
          assert len(refs) == 965, len(refs)
          assert len(unique) == 955, len(unique)
          assert unmapped == 725, unmapped
          assert multi == 10, multi
          PY

      - name: Compare public-content errors with exact main baseline
        shell: bash
        run: |
          set -euo pipefail
          branch_name="work/industrial-safety-relations-20260815"
          git stash push -m candidate-relations -- src/content/chapters
          git checkout --detach origin/main
          npm run build
          set +e
          npm run check:public-content 2>&1 | tee /tmp/baseline-public.log
          baseline_status=${PIPESTATUS[0]}
          set -e
          grep '^\[Public content error\]' /tmp/baseline-public.log | sort > /tmp/baseline-errors.txt || true
          echo "baseline public-content exit: ${baseline_status}"
          echo "baseline errors:"
          cat /tmp/baseline-errors.txt
          echo "candidate errors:"
          cat /tmp/candidate-errors.txt
          diff -u /tmp/baseline-errors.txt /tmp/candidate-errors.txt
          git checkout "${branch_name}"
          git stash pop
          git diff --check
          git diff --name-only | sort > /tmp/restored.txt
          diff -u /tmp/expected.txt /tmp/restored.txt
          echo "PUBLIC-CONTENT NON-REGRESSION PASS: candidate errors equal main baseline"

      - name: Commit verified relation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/chapters
          test "$(git diff --cached --name-only | wc -l)" -eq 19
          git commit -m "fix: add verified industrial safety question relations"
          git push origin HEAD:work/industrial-safety-relations-20260815
