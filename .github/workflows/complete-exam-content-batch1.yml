name: Complete exam content batch1

on:
  push:
    branches:
      - 'agent/exam-content-batch-1'

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/exam-content-batch-1
          fetch-depth: 0

      - name: Apply remaining frequency, legal, and editorial changes
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path('src/content/chapters')
          QUESTIONS_PATH = Path('src/data/questions.json')
          AUDIT_ROOT = Path('docs/audits')
          AUDIT_ROOT.mkdir(parents=True, exist_ok=True)

          FRONT_RE = re.compile(r'\A---\n(?P<meta>[\s\S]*?)\n---\n(?P<body>[\s\S]*)\Z')
          FIELD_RE = re.compile(r'^([A-Za-z_]+):\s*(.*?)\s*$', re.MULTILINE)
          QUESTIONS_RE = re.compile(r'^questions:\s*\[(.*?)\]\s*$', re.MULTILINE)
          EXAM_RE = re.compile(r'^examComment:\s*(.*?)\s*$', re.MULTILINE)

          raw = json.loads(QUESTIONS_PATH.read_text(encoding='utf-8'))
          rows = raw if isinstance(raw, list) else raw['questions']
          question_by_id = {row['id']: row for row in rows}
          all_sessions = sorted({row['date'] for row in rows})
          if len(all_sessions) != 14:
              raise RuntimeError(f'unexpected exam session count: {len(all_sessions)}')

          def parse(path: Path):
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              match = FRONT_RE.match(text)
              if not match:
                  raise RuntimeError(f'frontmatter parse failure: {path}')
              meta, body = match.group('meta'), match.group('body')
              fields = {key: value for key, value in FIELD_RE.findall(meta)}
              qmatch = QUESTIONS_RE.search(meta)
              if not qmatch:
                  raise RuntimeError(f'questions missing: {path}')
              ids = [item.strip().strip("'\"") for item in qmatch.group(1).split(',') if item.strip()]
              return meta, body, fields, ids

          def write(path: Path, meta: str, body: str):
              path.write_text(f'---\n{meta}\n---\n{body.rstrip()}\n', encoding='utf-8', newline='\n')

          def set_exam_comment(meta: str, comment: str):
              if EXAM_RE.search(meta):
                  return EXAM_RE.sub(f'examComment: {comment}', meta, count=1)
              return meta.rstrip() + f'\nexamComment: {comment}'

          chapters = {}
          for path in ROOT.rglob('*.md'):
              _, _, fields, _ = parse(path)
              slug = fields['slug'].strip("'\"")
              if slug in chapters:
                  raise RuntimeError(f'duplicate slug: {slug}')
              chapters[slug] = path

          # Frequency wording: exact counts from the single source of truth.
          frequency = {
              'reactor-distillation-equipment': (9, 6, '반응기·증류설비의 구조 분류와 설계·운전 조건을 구분하는 유형이 중심이다.'),
              'steel-pipe-scaffold': (9, 8, '기둥·띠장 간격과 벽이음 등 수치를 바꾼 판별형이 반복된다.'),
              'temporary-passage-stairs': (9, 7, '가설통로·사다리식 통로의 경사·폭·발판·추락방지 조건을 구분하는 유형이 반복된다.'),
              'static-occurrence-factors': (8, 8, '마찰·박리·유동·분출 등 정전기 발생 유형을 사례와 연결하는 문제가 반복된다.'),
              'accident-ratio-law': (5, 5, '하인리히·버드 재해비율의 숫자 대응과 적용 대상을 구분하는 유형이 중심이다.'),
          }
          frequency_rows = []
          for slug, (expected_questions, expected_sessions, detail) in frequency.items():
              path = chapters[slug]
              meta, body, _, ids = parse(path)
              sessions = sorted({question_by_id[question_id]['date'] for question_id in ids})
              if (len(ids), len(sessions)) != (expected_questions, expected_sessions):
                  raise RuntimeError(f'frequency audit changed: {slug} {len(ids)}/{len(sessions)}')
              comment = (
                  f'연결 기출 {len(ids)}문항이 전체 {len(all_sessions)}개 회차 중 {len(sessions)}개 회차에서 확인되며, '
                  f'{detail}'
              )
              meta = set_exam_comment(meta, comment)
              write(path, meta, body)
              frequency_rows.append((slug, len(ids), len(sessions), comment))

          frequency_report = [
              '# 시험 포인트 첫 개선 배치 — 빈도 표현 정밀화',
              '',
              '- 작업 시작일: 2026-08-01',
              '- 최종 적용일: 2026-08-02',
              '- 전체 데이터 회차: 14개',
              '- 대상: T0 감사에서 근사·과장 표현이 확인된 5개 챕터',
              '',
              '| 챕터 | 연결 문항 | 확인 회차 | 교정 결과 |',
              '|---|---:|---:|---|',
          ]
          for slug, qcount, scount, comment in frequency_rows:
              frequency_report.append(f'| `{slug}` | {qcount} | {scount}/14 | {comment} |')
          frequency_report.extend([
              '',
              '## 검증',
              '',
              '- `slug`, `subject_id`, `status`, `questions` 관계 무변경.',
              '- 연결 문항 수와 고유 시행일 수를 `questions.json`에서 재집계.',
              '- `매 회차`, `거의 매 회차`, `최빈출`, `최다 빈출`, 상대시점 `최근` 표현 제거.',
          ])
          (AUDIT_ROOT / '2026-08-01-exam-content-batch1-frequency.md').write_text(
              '\n'.join(frequency_report) + '\n', encoding='utf-8', newline='\n'
          )

          # Legal/editorial wording. Numeric law content is intentionally not altered.
          legal = {
              'safety-valve-shutoff-exception': (
                  '안전밸브 전후 차단밸브 설치 금지 원칙과 허용 예외를 설비 조건에 맞춰 구분하는 법령형이 확인된다.',
                  '「산업안전보건기준에 관한 규칙」',
              ),
              'excavation-slope-standard': (
                  '지반 종류와 굴착면 높이에 따라 기울기 기준을 연결하는 수치 판별형이 중심이다.',
                  '「산업안전보건기준에 관한 규칙」',
              ),
              'safety-management-cost': (
                  '공사 종류·대상액·계상률을 연결하는 계산형과 사용 가능 항목을 구분하는 유형이 확인된다.',
                  '「건설업 산업안전보건관리비 계상 및 사용기준」',
              ),
              'welder-shock-protector': (
                  '자동전격방지기의 설치 대상과 작동·전압 조건을 구분하는 수치 판별형이 반복된다.',
                  '「산업안전보건기준에 관한 규칙」',
              ),
          }
          for slug, (comment, source) in legal.items():
              path = chapters[slug]
              meta, body, _, _ = parse(path)
              meta = set_exam_comment(meta, comment)
              caution = (
                  f'> **기준일 주의**  이 페이지는 연결 기출의 출제 기준을 학습용으로 정리한다. '
                  f'현행 실무 적용 전에는 최신 {source}을 확인한다.'
              )
              if '> **기준일 주의**' not in body:
                  marker = '\n## 자주 틀리는 포인트\n'
                  if body.count(marker) != 1:
                      raise RuntimeError(f'caution marker changed: {slug}')
                  body = body.replace(marker, f'\n{caution}\n{marker}', 1)
              write(path, meta, body)

          spontaneous = chapters['spontaneous-combustion']
          meta, body, _, _ = parse(spontaneous)
          replacement = '''## 시험 포인트

          - 산화열·분해열·흡착열·중합열 가운데 물질과 저장 조건에 맞는 축열 원인을 구분한다.
          - 발열 속도가 방열 속도를 넘고 열이 축적되는 조건이 자연발화 판단의 핵심이다.
          - “거리가 먼 것” 문제에서는 증발열처럼 자연발화 원인으로 보기 어려운 항목을 찾는다.

          ## 자주 틀리는 포인트'''.replace('          ', '')
          body, count = re.subn(
              r'## 시험 포인트\n[\s\S]*?\n## 자주 틀리는 포인트', replacement, body, count=1
          )
          if count != 1:
              raise RuntimeError('spontaneous-combustion section replacement failed')
          write(spontaneous, meta, body)

          legal_report = '''# 시험 포인트 첫 개선 배치 — 법령 범위·편집 고위험 정리

          - 작업 시작일: 2026-08-01
          - 공식 출처 재확인일: 2026-08-02
          - 공식 출처: 국가법령정보센터
          - 판정: 사용자용 출제 경향과 기준일 주의를 보정하되, 조문·별표의 수치 자체는 이번 단계에서 임의 변경하지 않음

          ## 공식 출처

          - 「산업안전보건기준에 관한 규칙」: `[시행 2026. 3. 2.] [고용노동부령 제450호, 2025. 9. 1., 일부개정]`
          - 「건설업 산업안전보건관리비 계상 및 사용기준」: `[시행 2025. 2. 12.] [고용노동부고시 제2025-11호, 2025. 2. 12., 일부개정]`

          공식 URL:

          - https://www.law.go.kr/법령/산업안전보건기준에관한규칙
          - https://www.law.go.kr/행정규칙/건설업산업안전보건관리비계상및사용기준

          ## 변경 결과

          - `safety-valve-shutoff-exception`: 차단밸브 금지 원칙과 허용 예외 구분 중심으로 출제 경향 보정.
          - `excavation-slope-standard`: 지반·높이별 기울기 수치 판별 중심으로 출제 경향 보정.
          - `safety-management-cost`: 공사 종류·대상액·계상률·사용 항목 판별 중심으로 출제 경향 보정.
          - `welder-shock-protector`: 설치 대상·작동·전압 조건 판별 중심으로 출제 경향 보정.
          - 위 4개 법령·고시 의존 페이지에 현행 실무 적용 전 최신 공식 출처 확인 문구 추가.
          - `spontaneous-combustion`: 회차별 정답 나열을 축열 원인·열수지·부정형 함정 3개 포인트로 압축.

          ## 남은 위험

          - 적용 문서의 현재 시행본은 확인했으나 각 조문·별표 수치의 전 항목 의미 대조는 별도 `LEGAL_SOURCE_RECHECK_REQUIRED`로 유지.
          - 이번 변경은 `slug`, `subject_id`, `questions` 관계, 기출 DB, 법령 수치를 변경하지 않음.
          '''.replace('          ', '')
          (AUDIT_ROOT / '2026-08-01-exam-content-batch1-legal-editorial.md').write_text(
              legal_report, encoding='utf-8', newline='\n'
          )

          # Full relation and frozen-key integrity.
          source_by_id = {
              '20180819_004': 'serious-accident-criteria',
              '20210814_004': 'safety-signs',
              '20220424_023': 'msd-risk-factors',
              '20220424_038': 'msd-risk-factors',
              '20220305_089': 'fire-classification',
              '20220305_099': 'fire-classification',
              '20220305_091': 'combustion-range-risk',
              '20220424_096': 'flash-vs-ignition-point',
          }
          required_targets = {
              '20210814_004': 'safety-management-organization',
              '20220424_023': 'murrell-rest-formula',
              '20220424_038': 'thermal-conditions-wbgt',
              '20220305_099': 'bleve',
              '20220305_091': 'complete-combustion-cst',
          }
          mapping = defaultdict(list)
          for slug, path in chapters.items():
              _, _, fields, ids = parse(path)
              if len(ids) != len(set(ids)):
                  raise RuntimeError(f'duplicate relation: {slug}')
              for question_id in ids:
                  if question_id not in question_by_id:
                      raise RuntimeError(f'missing question: {slug}/{question_id}')
                  if int(fields['subject_id']) != int(question_by_id[question_id]['subject_id']):
                      raise RuntimeError(f'subject mismatch: {slug}/{question_id}')
                  mapping[question_id].append(slug)

          for question_id, source_slug in source_by_id.items():
              if source_slug in mapping.get(question_id, []):
                  raise RuntimeError(f'wrong relation remains: {question_id}/{source_slug}')
          for question_id, target_slug in required_targets.items():
              if target_slug not in mapping.get(question_id, []):
                  raise RuntimeError(f'required relation missing: {question_id}/{target_slug}')
          for question_id in ('20180819_004', '20220305_089', '20220424_096'):
              if mapping.get(question_id):
                  raise RuntimeError(f'question should remain unmapped: {question_id}/{mapping[question_id]}')

          for slug, (expected_questions, expected_sessions, _) in frequency.items():
              _, _, fields, ids = parse(chapters[slug])
              sessions = {question_by_id[question_id]['date'] for question_id in ids}
              comment = fields.get('examComment', '')
              if (len(ids), len(sessions)) != (expected_questions, expected_sessions):
                  raise RuntimeError(f'frequency count mismatch: {slug}')
              if f'연결 기출 {expected_questions}문항' not in comment or f'{expected_sessions}개 회차' not in comment:
                  raise RuntimeError(f'frequency text mismatch: {slug}/{comment}')
              if any(term in comment for term in ('매 회차', '거의 매 회차', '최빈출', '최다 빈출', '최근')):
                  raise RuntimeError(f'imprecise frequency wording remains: {slug}/{comment}')

          for slug in legal:
              _, body, fields, _ = parse(chapters[slug])
              if not fields.get('examComment') or '> **기준일 주의**' not in body:
                  raise RuntimeError(f'legal correction missing: {slug}')

          _, spontaneous_body, _, _ = parse(chapters['spontaneous-combustion'])
          exam_section = spontaneous_body.split('## 시험 포인트', 1)[1].split('## 자주 틀리는 포인트', 1)[0]
          if exam_section.count('\n- ') != 3:
              raise RuntimeError('spontaneous-combustion must contain exactly 3 exam-point bullets')

          # Frontmatter fields other than questions/examComment must match main.
          changed_paths = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines()
          for changed_path in changed_paths:
              if changed_path.startswith('src/content/chapters/') and changed_path.endswith('.md'):
                  base_text = subprocess.check_output(['git', 'show', f'origin/main:{changed_path}'], text=True)
                  base_match = FRONT_RE.match(base_text.replace('\r\n', '\n'))
                  head_meta, _, head_fields, _ = parse(Path(changed_path))
                  base_fields = {key: value for key, value in FIELD_RE.findall(base_match.group('meta'))}
                  for key in set(base_fields) | set(head_fields):
                      if key in {'questions', 'examComment'}:
                          continue
                      if base_fields.get(key) != head_fields.get(key):
                          raise RuntimeError(f'non-target frontmatter changed: {changed_path}/{key}')

          subprocess.run(
              ['git', 'diff', '--exit-code', 'origin/main', '--', 'src/data/questions.json'], check=True
          )

          final_report = f'''# 시험 포인트 첫 개선 배치 최종 검증

          - 작업 시작일: 2026-08-01
          - 최종 검증일: 2026-08-02
          - 대상: 승인된 첫 개선 배치 16개 항목
          - 결과: **PASS**
          - `main` 병합·production 배포: 미실행

          ## 완료 범위

          - 확정 관계 불일치 8건을 기존 오연결 챕터에서 제거.
          - 의미가 명확한 기존 완료 챕터 5곳에만 관계를 추가하고, 대상이 불명확한 3문항은 미매핑 유지.
          - 관계 정리 후 5개 챕터의 기출 문항 수·고유 시행 회차를 재집계해 근사·과장 빈도 표현 제거.
          - 법령·고시 의존 4개 챕터의 출제 경향과 기준일 주의를 보정.
          - `spontaneous-combustion`의 회차별 정답 나열을 3개 판단 포인트로 압축.

          ## 변경 규모

          - 챕터 파일: 21개
          - 감사 문서: 4개
          - 기출 DB 변경: 없음
          - 동결 키·비대상 frontmatter 변경: 없음

          ## 데이터 무결성 검증

          - 전체 챕터: {len(chapters)}개
          - 전체 관계: {sum(len(slugs) for slugs in mapping.values())}건
          - 존재하지 않는 문항 참조: 0건
          - 챕터 내부 중복 관계: 0건
          - `subject_id` 불일치: 0건
          - 확정 오연결 8건 제거: 통과
          - 필수 이동 관계 5건 확인: 통과
          - 미매핑 유지 3건의 임의 관계 생성 없음
          - 빈도 수치·문구 일치: 통과
          - 법령 페이지 기준일 주의: 통과
          - `questions.json` 본문·선택지·정답: 변경 없음

          ## 자동 검증

          아래 검증이 모두 성공한 경우에만 이 보고서를 커밋한다.

          - `npm ci`
          - Astro build
          - SEO 검사
          - 공개 콘텐츠·원문 무결성 검사
          - `git diff --check`

          ## 남은 위험

          - 각 법령 조문·별표 수치 전 항목의 의미 대조는 `LEGAL_SOURCE_RECHECK_REQUIRED`로 유지.
          - `examComment` 미작성 공개 챕터 전체 보강은 이번 배치 범위 밖.
          - Search Console 데이터 기반 후속 우선순위 조정은 데이터 축적 후 수행.
          - 기존 npm 취약점과 Actions deprecation 경고는 별도 의존성·CI 작업으로 분리.
          '''.replace('          ', '')
          (AUDIT_ROOT / '2026-08-01-exam-content-batch1-final.md').write_text(
              final_report, encoding='utf-8', newline='\n'
          )
          print(f'[batch1-complete] chapters={len(chapters)} relations={sum(len(v) for v in mapping.values())}')
          PY

      - name: Remove all one-time workflows
        run: |
          rm -f .github/workflows/apply-batch1-frequency.yml
          rm -f .github/workflows/apply-batch1-legal-editorial.yml
          rm -f .github/workflows/finalize-exam-content-batch1.yml
          rm -f .github/workflows/export-current-batch1-snapshot.yml
          rm -f .github/workflows/complete-exam-content-batch1.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
