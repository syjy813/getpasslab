name: Finalize exam content batch1

on:
  push:
    branches:
      - 'agent/exam-content-batch-1'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/exam-content-batch-1
          fetch-depth: 0

      - name: Confirm implementation phases completed
        run: |
          test -f docs/audits/2026-08-01-exam-content-batch1-relations.md
          test -f docs/audits/2026-08-01-exam-content-batch1-frequency.md
          test -f docs/audits/2026-08-01-exam-content-batch1-legal-editorial.md
          git log -1 --pretty=%s | grep -Fq 'content: refine first legal exam insights'

      - name: Validate relation and frozen metadata integrity
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path('src/content/chapters')
          QUESTIONS_PATH = Path('src/data/questions.json')
          SOURCE_BY_ID = {
              '20180819_004': 'serious-accident-criteria',
              '20210814_004': 'safety-signs',
              '20220424_023': 'msd-risk-factors',
              '20220424_038': 'msd-risk-factors',
              '20220305_089': 'fire-classification',
              '20220305_099': 'fire-classification',
              '20220305_091': 'combustion-range-risk',
              '20220424_096': 'flash-vs-ignition-point',
          }
          REQUIRED_TARGETS = {
              '20210814_004': 'safety-management-organization',
              '20220424_023': 'murrell-rest-formula',
              '20220424_038': 'thermal-conditions-wbgt',
              '20220305_099': 'bleve',
              '20220305_091': 'complete-combustion-cst',
          }
          FREQUENCY_EXPECTED = {
              'reactor-distillation-equipment': (9, 6),
              'steel-pipe-scaffold': (9, 8),
              'temporary-passage-stairs': (9, 7),
              'static-occurrence-factors': (8, 8),
              'accident-ratio-law': (5, 5),
          }
          LEGAL_TARGETS = {
              'safety-valve-shutoff-exception',
              'excavation-slope-standard',
              'safety-management-cost',
              'welder-shock-protector',
          }

          FRONT_RE = re.compile(r'\A---\n(?P<meta>[\s\S]*?)\n---\n(?P<body>[\s\S]*)\Z')
          FIELD_RE = re.compile(r'^([A-Za-z_]+):\s*(.*?)\s*$', re.MULTILINE)
          QUESTIONS_RE = re.compile(r'^questions:\s*\[(.*?)\]\s*$', re.MULTILINE)

          raw = json.loads(QUESTIONS_PATH.read_text(encoding='utf-8'))
          rows = raw if isinstance(raw, list) else raw['questions']
          question_by_id = {row['id']: row for row in rows}
          all_sessions = {row['date'] for row in rows}
          if len(all_sessions) != 14:
              raise RuntimeError(f'unexpected session count: {len(all_sessions)}')

          def parse_text(text: str, path: str):
              normalized = text.replace('\r\n', '\n')
              match = FRONT_RE.match(normalized)
              if not match:
                  raise RuntimeError(f'frontmatter parse failure: {path}')
              meta, body = match.group('meta'), match.group('body')
              fields = {key: value for key, value in FIELD_RE.findall(meta)}
              qmatch = QUESTIONS_RE.search(meta)
              if not qmatch:
                  raise RuntimeError(f'questions missing: {path}')
              ids = [item.strip().strip("'\"") for item in qmatch.group(1).split(',') if item.strip()]
              return fields, ids, body

          chapters = {}
          mapping = defaultdict(list)
          for path in ROOT.rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              fields, ids, body = parse_text(text, str(path))
              slug = fields['slug'].strip("'\"")
              chapters[slug] = (path, fields, ids, body)
              if len(ids) != len(set(ids)):
                  raise RuntimeError(f'duplicate relation: {slug}')
              for question_id in ids:
                  if question_id not in question_by_id:
                      raise RuntimeError(f'missing question: {slug} / {question_id}')
                  if int(fields['subject_id']) != question_by_id[question_id]['subject_id']:
                      raise RuntimeError(f'subject mismatch: {slug} / {question_id}')
                  mapping[question_id].append(slug)

          for question_id, source_slug in SOURCE_BY_ID.items():
              if source_slug in mapping.get(question_id, []):
                  raise RuntimeError(f'wrong relation remains: {question_id} / {source_slug}')
          for question_id, target_slug in REQUIRED_TARGETS.items():
              if target_slug not in mapping.get(question_id, []):
                  raise RuntimeError(f'required target missing: {question_id} / {target_slug}')

          for slug, (expected_q, expected_sessions) in FREQUENCY_EXPECTED.items():
              _, fields, ids, _ = chapters[slug]
              sessions = {question_by_id[question_id]['date'] for question_id in ids}
              if (len(ids), len(sessions)) != (expected_q, expected_sessions):
                  raise RuntimeError(f'frequency count mismatch: {slug}')
              comment = fields.get('examComment', '')
              if f'연결 기출 {expected_q}문항' not in comment or f'{expected_sessions}개 회차' not in comment:
                  raise RuntimeError(f'frequency comment mismatch: {slug} / {comment}')
              if any(term in comment for term in ('매 회차', '최빈출', '최다 빈출', '최근')):
                  raise RuntimeError(f'imprecise frequency wording: {slug} / {comment}')

          for slug in LEGAL_TARGETS:
              _, fields, _, body = chapters[slug]
              if not fields.get('examComment'):
                  raise RuntimeError(f'legal examComment missing: {slug}')
              if '> **기준일 주의**' not in body:
                  raise RuntimeError(f'legal caution missing: {slug}')

          _, _, _, spontaneous_body = chapters['spontaneous-combustion']
          exam_section = spontaneous_body.split('## 시험 포인트', 1)[1].split('## 자주 틀리는 포인트', 1)[0]
          if exam_section.count('\n- ') != 3:
              raise RuntimeError('spontaneous-combustion exam point was not compressed to 3 bullets')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          for path in changed:
              if path.startswith('src/content/chapters/') and path.endswith('.md'):
                  base = subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)
                  head = Path(path).read_text(encoding='utf-8')
                  base_fields, _, _ = parse_text(base, path)
                  head_fields, _, _ = parse_text(head, path)
                  for key in set(base_fields) | set(head_fields):
                      if key in {'questions', 'examComment'}:
                          continue
                      if base_fields.get(key) != head_fields.get(key):
                          raise RuntimeError(f'frozen/non-target frontmatter changed: {path} / {key}')
              elif path.startswith('docs/audits/2026-08-01-exam-content-batch1-'):
                  continue
              elif path == '.github/workflows/finalize-exam-content-batch1.yml':
                  continue
              else:
                  raise RuntimeError(f'out-of-scope changed path: {path}')

          subprocess.run(['git', 'diff', '--exit-code', 'origin/main', '--', 'src/data/questions.json'], check=True)
          print(f'[batch1-final-integrity] chapters={len(chapters)} changed_files={len(changed)} relations={sum(len(v) for v in mapping.values())}')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build | tee /tmp/build.log

      - name: Validate SEO output
        run: npm run check:seo | tee /tmp/seo.log

      - name: Validate public content
        run: npm run check:public-content | tee /tmp/public-content.log

      - name: Validate diff formatting
        run: git diff --check

      - name: Write final batch report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
          content_files = [path for path in changed if path.startswith('src/content/chapters/')]
          audit_files = [path for path in changed if path.startswith('docs/audits/')]
          commits = subprocess.check_output(
              ['git', 'log', '--reverse', '--pretty=- `%h` — %s', 'origin/main..HEAD'], text=True
          ).strip()
          report = f'''# 시험 포인트 첫 개선 배치 최종 검증

- 작업일: 2026-08-01
- 대상: 승인된 첫 개선 배치 16개 챕터
- 결과: **PASS**
- `main` 병합·production 배포: 미실행

## 완료 범위

- 확정 관계 불일치 8건을 기존 오연결 챕터에서 제거.
- 의미가 명확한 기존 완료 챕터에만 관계 유지·추가하고, 대상이 불명확한 문항은 임의 매핑하지 않음.
- 관계 정리 후 5개 챕터의 기출 문항 수·고유 시행 회차를 재집계하여 근사·과장 빈도 표현 제거.
- 법령·고시 의존 4개 챕터의 출제 경향과 기준일 주의를 보정.
- `spontaneous-combustion`의 회차별 정답 나열을 3개 판단 포인트로 압축.

## 변경 규모

- 챕터 파일: {len(content_files)}개
- 감사 문서: {len(audit_files)}개
- 기출 DB 변경: 없음
- 동결 키·비대상 frontmatter 변경: 없음

## 검증

- 관계 ID 존재성·중복·subject 일치: 통과
- 확정 오연결 8건 제거: 통과
- 필수 대상 관계 5건 확인: 통과
- 빈도 수치·문구 일치: 통과
- 법령 페이지 기준일 주의: 통과
- `npm ci`: 성공
- Astro build: 성공
- SEO 검사: 성공
- 공개 콘텐츠 검사: 성공
- `git diff --check`: 성공

## 실행 커밋

{commits}

## 남은 위험

- 법령 공식 페이지 접근성과 적용 문서 범위는 확인했으나 각 조문·별표 수치 전 항목의 의미 대조는 `LEGAL_SOURCE_RECHECK_REQUIRED`로 유지.
- `examComment` 미작성 공개 챕터 127개 전체 보강은 이번 배치 범위 밖.
- Search Console 데이터 기반 우선순위 조정은 데이터 축적 후 별도 수행.
- 기존 npm 취약점 및 Actions deprecation 경고는 별도 의존성·CI 작업으로 분리.
'''
          Path('docs/audits/2026-08-01-exam-content-batch1-final.md').write_text(report, encoding='utf-8', newline='\n')
          PY

      - name: Remove one-time workflow and commit final report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-exam-content-batch1.yml
          git add docs/audits/2026-08-01-exam-content-batch1-final.md
          git commit -m "docs: finalize first exam insight batch"
          git push origin HEAD:agent/exam-content-batch-1

      - name: Mark PR ready and publish final report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 8 --repo syjy813/getpasslab
          cat > /tmp/pr-body.md <<'EOF'
          ## 결론

          시험 포인트·출제 경향 T0 감사에서 승인된 첫 개선 배치 16개 구현과 검증을 완료했습니다.

          ## 완료 범위

          1. 확정 관계 불일치 8건 / 6개 챕터 정리
          2. 관계 변경 후 기출 빈도 재집계
          3. 근사·과장 빈도 표현 5개 정밀 교정
          4. 법령·편집 고위험 5개 사용자용 문구 교정
          5. 단계별·최종 감사 문서 작성

          ## 무결성

          - slug, subject_id, question_id 변경 없음
          - 기출 DB 본문·선택지·정답 변경 없음
          - 명확한 기존 완료 챕터에만 관계 유지·추가
          - 불명확한 문항은 임의 매핑하지 않음
          - 스키마·의존성·URL·핵심 UX·production 설정 변경 없음

          ## 검증

          - 관계 ID 존재성·중복·subject 일치: 성공
          - 확정 오연결 8건 제거: 성공
          - 빈도 수치·문구 일치: 성공
          - npm ci: 성공
          - Astro build: 성공
          - SEO 검사: 성공
          - 공개 콘텐츠 검사: 성공
          - git diff --check: 성공

          ## 남은 위험

          - 법령 공식 출처 접근성과 적용 범위는 확인했으나 조문·별표 수치 전 항목의 의미 대조는 별도 LEGAL_SOURCE_RECHECK_REQUIRED
          - examComment 미작성 전체 챕터 보강은 후속 배치
          - 기존 npm 취약점과 Actions 경고는 범위 밖

          ## AI_HANDOVER.md

          이번 구현 PR에서는 갱신하지 않았습니다. Owner 병합 승인과 실제 배포 검증 후 별도 판단합니다.

          ## 병합·배포

          - 병합: 미실행
          - production 배포: 미실행
          - Owner 승인 전 병합하지 않음
          EOF
          gh pr edit 8 --repo syjy813/getpasslab --body-file /tmp/pr-body.md
          gh pr comment 8 --repo syjy813/getpasslab --body '첫 개선 배치 구현·자기 검증 완료. 상세 결과는 docs/audits/2026-08-01-exam-content-batch1-final.md에 기록했습니다. Owner 승인 전 병합·배포하지 않습니다.'
