name: Temporary subject1 final sweep clusters

on:
  push:
    branches:
      - audit/industrial-safety-subject1-p1-final-sweep-20260817

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify unmapped keyword clusters
        shell: python
        run: |
          import json, re
          from pathlib import Path

          qdata=json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          qline=re.compile(r'^questions:\s*\[(.*?)\]\s*$',re.M)
          mapped=set()
          for p in Path('src/content/chapters/safety-management').glob('*.md'):
              m=qline.search(p.read_text(encoding='utf-8'))
              if m:
                  mapped.update(x.strip() for x in m.group(1).split(',') if x.strip())

          clusters={
            'LEWIN': re.compile(r'레빈|레윈|Lewin|B\s*=\s*f',re.I),
            'BIORHYTHM': re.compile(r'생체\s*리듬|바이오리듬|Bio\s*Rhythm',re.I),
            'PERSONALITY_TEST': re.compile(r'Y[-·]?K|Yutaka|Y[-·]?G|성격검사',re.I),
            'VISUAL_ILLUSION': re.compile(r'착시|시지각|자동운동|헤링|Hering',re.I),
            'ACCIDENT_INVESTIGATION': re.compile(r'재해\s*조사|재해\s*발생\s*시\s*조치',re.I),
            'HUMAN_ERROR_TAXONOMY': re.compile(r'생략오류|실행오류|시간오류|명령오류|인간오류',re.I),
          }

          print('CLUSTER_SCAN_START')
          for name,pat in clusters.items():
              rows=[]
              for q in qdata:
                  if q.get('subject_id') != 1 or q['id'] in mapped:
                      continue
                  text=' '.join([q.get('body','')] + list(q.get('choices') or []))
                  if pat.search(text):
                      rows.append(q)
              print(f'\n## {name} | unmapped_count={len(rows)}')
              for q in rows:
                  print(f'- {q["id"]} | answer={q.get("answer")} | {q.get("body","")}')
          print('\nCLUSTER_SCAN_END')
