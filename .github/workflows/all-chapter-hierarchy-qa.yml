name: All chapter reading hierarchy QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/styles/global.css'
      - 'public/styles/fire-bulk-visual.css'
      - 'scripts/*all-chapter-hierarchy*'
      - 'scripts/read-before-fire-persona-corrections.mjs'
      - 'docs/audits/2026-10-22-all-chapter-hierarchy/**'
      - '.github/workflows/all-chapter-hierarchy-qa.yml'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  reading-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify immutable historical hierarchy and readability snapshots
        run: node scripts/ci-archived-history.cjs "node scripts/check-all-chapter-hierarchy.mjs && node scripts/check-global-chapter-readability.mjs"
      - name: Prepare browser
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: All 521 chapters at 320, 390, 768 and 1440px
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            export QA_BASE_URL=https://getpasslab.co.kr
          else
            npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-hierarchy-preview.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
              sleep 1
            done
            export QA_BASE_URL=http://127.0.0.1:4321
          fi
          node scripts/qa-all-chapter-hierarchy.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-chapter-hierarchy-qa
          path: qa-results/all-chapter-hierarchy/
          retention-days: 14

  accident-cause-qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate exact approved release scope against immutable PR base
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$REVIEW_BASE_SHA"
          node scripts/check-accident-cause-release.mjs
      - run: npm run check:seo && npm run check:public-content
      - name: Prepare scoped browser QA
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Accident cause chapter at 320, 390, 400, 768 and 1440px
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: http://127.0.0.1:4321
          QA_OUTPUT_DIR: qa-results/accident-cause-chapter
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-accident-cause-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS "$QA_BASE_URL/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$QA_BASE_URL/" >/dev/null
          node scripts/qa-accident-cause-chapter.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accident-cause-chapter-qa
          path: qa-results/accident-cause-chapter/
          retention-days: 14

  current-chapter-sample-qa:
    if: github.event_name == 'pull_request'
    needs: accident-cause-qa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser for current chapter styles
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate representative chapters at four viewport widths
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: http://127.0.0.1:4321
          QA_OUTPUT_DIR: qa-results/accident-cause-current-chapters
          QA_CHAPTER_SAMPLE: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-current-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS "$QA_BASE_URL/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$QA_BASE_URL/" >/dev/null
          node scripts/qa-all-chapter-hierarchy.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accident-cause-current-chapters
          path: qa-results/accident-cause-current-chapters/
          retention-days: 14

  archived-baseline-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prove historical hierarchy audit on unchanged original release
        run: |
          node scripts/check-all-chapter-hierarchy.mjs
          node scripts/check-global-chapter-readability.mjs
