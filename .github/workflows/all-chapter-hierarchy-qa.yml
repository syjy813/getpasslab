name: All chapter reading hierarchy QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/styles/global.css'
      - 'public/styles/fire-bulk-visual.css'
      - 'scripts/*all-chapter-hierarchy*'
      - 'scripts/read-before-fire-persona-corrections.mjs'
      - 'docs/audits/2026-10-22-all-chapter-hierarchy/**'
      - '.github/workflows/all-chapter-hierarchy-qa.yml'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  reading-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-all-chapter-hierarchy.mjs
      - run: node scripts/check-global-chapter-readability.mjs
      - name: Prepare browser
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: All 521 chapters at 320, 390, 768 and 1440px
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            export QA_BASE_URL=https://getpasslab.co.kr
          else
            npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-hierarchy-preview.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
              sleep 1
            done
            export QA_BASE_URL=http://127.0.0.1:4321
          fi
          node scripts/qa-all-chapter-hierarchy.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-chapter-hierarchy-qa
          path: qa-results/all-chapter-hierarchy/
          retention-days: 14
