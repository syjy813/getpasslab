name: Industrial chapter mobile table QA

on:
  pull_request:
    paths:
      - 'src/styles/industrialReadability.css'
      - 'src/layouts/ChapterLayout.astro'
      - 'scripts/qa-industrial-mobile-table.mjs'
      - '.github/workflows/industrial-mobile-table-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-industrial-mobile-table.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-mobile-table-qa
          path: qa-results/industrial-mobile-table/
          if-no-files-found: ignore
