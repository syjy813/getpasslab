      - name: Install dependencies
        run: npm ci

      - name: Build and standard validation
        run: |
          npm run build
          npm run check:seo
          npm run check:public-content

      - name: Relation and validator QA
        shell: python
        run: |
          import json, re
          from collections import Counter
          from pathlib import Path

          expected = {
              'motivation-theories': ['20180428_011','20190427_006','20200822_008','20210814_014','20220424_001'],
              'compatibility': ['20190804_028','20200822_038','20220305_039','20220424_036'],
              'anthropometry-design': ['20190303_032','20200926_031'],
              'machine-tools-safety': ['20190427_053','20220305_044'],
              'spontaneous-combustion': ['20190303_094'],
          }
          holds = {'20180304_048','20180304_061','20190804_072','20200606_079','20180304_073','20210307_101'}
          questions = json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          qmap = {q['id']: q for q in questions}
          if len(questions) != 1680 or len(qmap) != 1680:
              raise SystemExit(f'STOP: question integrity {len(questions)=} {len(qmap)=}')

          refs = []
          by_slug = {}
          for f in Path('dist/industrial-safety/written').rglob('index.html'):
              rel = f.relative_to('dist/industrial-safety/written')
              if len(rel.parts) != 3:
                  continue
              text = f.read_text(encoding='utf-8', errors='ignore')
              ids = re.findall(r'data-open="(\d{8}_\d{3})"', text)
              slug = rel.parts[1]
              by_slug[slug] = ids
              refs.extend(ids)

          for slug, ids in expected.items():
              actual = by_slug.get(slug, [])
              for qid in ids:
                  if actual.count(qid) != 1:
                      raise SystemExit(f'STOP: {qid} count in {slug} = {actual.count(qid)}')
          mapped = set(refs)
          if holds & mapped:
              raise SystemExit(f'STOP: hold candidate unexpectedly mapped: {sorted(holds & mapped)}')

          counts = Counter(refs)
          multi = sum(1 for c in counts.values() if c > 1)
          expected_counts = (978, 968, 712, 10)
          actual_counts = (len(refs), len(mapped), 1680-len(mapped), multi)
          if actual_counts != expected_counts:
              raise SystemExit(f'STOP: relation counts {actual_counts} != {expected_counts}')
          print(f'RELATION QA PASS refs={len(refs)} unique={len(mapped)} unmapped={1680-len(mapped)} multi={multi}')

      - name: Validator regex regression
        run: |
          node --input-type=module - <<'NODE'
          const p = /Git(?:Hub)?\s*저장소|코드\s*저장소|프로젝트\s*저장소|저장소\s*(?:정본|기준|경로|브랜치|커밋)/gi;
          for (const text of ['Git 저장소', 'GitHub 저장소', '프로젝트 저장소', '저장소 기준']) {
            p.lastIndex = 0;
            if (!p.test(text)) throw new Error(`internal phrase not caught: ${text}`);
          }
          p.lastIndex = 0;
          if (p.test('저장소 등의 주위 온도를 낮게 한다.')) throw new Error('legitimate exam wording still blocked');
          console.log('VALIDATOR REGRESSION PASS');
          NODE

