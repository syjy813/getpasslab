name: Fix gate A question diff

on:
  push:
    branches:
      - agent/relation-structure-gate-a
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/relation-structure-gate-a
          fetch-depth: 0

      - name: Restore main formatting and apply only review changes
        run: |
          git fetch origin main
          git show origin/main:src/data/questions.json > /tmp/questions-main.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          source_path = Path('/tmp/questions-main.json')
          target_path = Path('src/data/questions.json')
          original = source_path.read_text(encoding='utf-8')
          updated = original
          target_ids = ['20220305_040', '20210814_021', '20180428_065']

          for question_id in target_ids:
              pattern = re.compile(
                  rf'("id": "{question_id}",[\s\S]*?"review": )""',
                  re.MULTILINE,
              )
              updated, count = pattern.subn(r'\1"jpg 확필"', updated, count=1)
              if count != 1:
                  raise SystemExit(
                      f'Expected one blank review for {question_id}, found {count}'
                  )

          original_lines = original.splitlines()
          updated_lines = updated.splitlines()
          if len(original_lines) != len(updated_lines):
              raise SystemExit('questions.json line count changed')

          differences = [
              (index + 1, old, new)
              for index, (old, new) in enumerate(zip(original_lines, updated_lines))
              if old != new
          ]
          if len(differences) != 3:
              raise SystemExit(f'Unexpected line differences: {differences}')
          for line_number, old, new in differences:
              if old != '  "review": ""' or new != '  "review": "jpg 확필"':
                  raise SystemExit(
                      f'Unexpected question diff at line {line_number}: {old!r} -> {new!r}'
                  )

          parsed_original = json.loads(original)
          parsed_updated = json.loads(updated)
          by_old = {item['id']: item for item in parsed_original}
          by_new = {item['id']: item for item in parsed_updated}
          for question_id in target_ids:
              old = dict(by_old[question_id])
              new = dict(by_new[question_id])
              if old.pop('review') != '' or new.pop('review') != 'jpg 확필':
                  raise SystemExit(f'Unexpected review state: {question_id}')
              if old != new:
                  raise SystemExit(f'Non-review data changed: {question_id}')

          target_path.write_text(updated, encoding='utf-8')
          print(f'questions-only review changes PASS: {target_ids}')
          PY

      - name: Check exact question diff
        run: |
          git diff --check
          git diff -- src/data/questions.json

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-gate-a-question-diff.yml

      - name: Commit corrected question diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/questions.json .github/workflows/fix-gate-a-question-diff.yml
          git commit -m "fix: limit question changes to review flags"
          git push origin HEAD:agent/relation-structure-gate-a
