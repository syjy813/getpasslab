name: FTA symbols split QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/read-before-hanging-scaffold-wire-rope.mjs'
      - 'src/content/chapters/ergonomics/fta*.md'
      - 'src/assets/questions/industrial-safety/20180304_036.png'
      - 'src/data/question-assets/industrial-safety.json'
      - 'docs/audits/2026-10-06-fta-original-options/**'
      - 'scripts/check-fta-original-options.mjs'
      - 'scripts/reviewed-chapter-hash.mjs'
      - 'public/images/chapters/fta-symbols/**'
      - 'docs/audits/2026-10-05-fta-symbols-split/**'
      - 'scripts/*fta-symbols-split*'
      - '.github/workflows/fta-symbols-split-qa.yml'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  browser-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-fta-symbols-split.mjs
      - run: node scripts/check-fta-original-options.mjs
      - name: Prepare temporary browser tooling
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check FTA pages, 12 questions and figures at three widths
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            export QA_BASE_URL=https://getpasslab.co.kr
          else
            npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-formula-preview.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
              sleep 1
            done
            export QA_BASE_URL=http://127.0.0.1:4321
          fi
          node scripts/qa-fta-symbols-split.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fta-symbols-split-qa
          path: qa-results/fta-symbols-split/
          retention-days: 14
