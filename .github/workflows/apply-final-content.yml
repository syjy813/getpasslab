name: Apply final reviewed public content

on:
  push:
    branches:
      - agent/public-id-guard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-id-guard
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply checksum-verified reviewed operations
        run: python scripts/apply-final-content-ops.py

      - name: Remove one-time transport and runner
        run: |
          git rm scripts/final-content-ops.part-*
          git rm scripts/apply-final-content-ops.py
          git rm .github/workflows/apply-final-content.yml

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Check patch formatting
        run: git diff --check

      - name: Commit final reviewed content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/chapters scripts/check-public-content.mjs .github/workflows/seo-check.yml package.json
          git commit -m "content: finalize reviewed public exam notes"
          git push origin HEAD:agent/public-id-guard
