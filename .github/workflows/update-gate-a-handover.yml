name: Update Gate A handover record

on:
  push:
    branches:
      - agent/record-gate-a-production

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/record-gate-a-production
          fetch-depth: 0

      - name: Update AI handover
        run: python scripts/update-gate-a-handover.py

      - name: Commit handover update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_HANDOVER.md
          git commit -m "docs: update Gate A handover record"
          git push origin HEAD:agent/record-gate-a-production
