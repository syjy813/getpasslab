name: Verify 20190804-119 production block

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production page
        shell: bash
        run: |
          set -euo pipefail
          url='https://getpasslab.co.kr/industrial-safety/written/construction/construction-hazard-plan-documents/'
          blocked='건설공사의 유해ㆍ위험방지계획서 제출 대상 중'
          retained='건설공사의 유해위험방지계획서 제출 기준일로 옳은 것은?'
          title='건설공사 유해·위험방지계획서 제출 기준'

          for attempt in $(seq 1 20); do
            html="$(curl --fail --silent --show-error --location --max-time 30 "$url")"

            if grep -Fq "$blocked" <<<"$html"; then
              echo "Attempt $attempt: old production content still visible; waiting for deployment."
              sleep 15
              continue
            fi

            grep -Fq "$title" <<<"$html"
            grep -Fq "$retained" <<<"$html"
            echo "Production verification passed on attempt $attempt."
            exit 0
          done

          echo 'Target question remained visible after all retries.' >&2
          exit 1
