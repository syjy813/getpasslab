name: Industrial table legacy-guard baseline comparison
on:
  pull_request:
    paths:
      - '.github/workflows/industrial-table-guard-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare representative historical guards without masking failures
        shell: bash
        run: |
          set +e
          for check in \
            scripts/check-image-copy-update.mjs \
            scripts/check-footer-left.mjs \
            scripts/check-mobile-top-ad.mjs \
            scripts/check-gnb-chapter-toc.mjs \
            scripts/check-chapter-formula-style.mjs; do
            echo "=== ${{ matrix.revision }}: $check ==="
            node "$check" > /tmp/guard-output.txt 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "GUARD_RESULT ${{ matrix.revision }} PASS $check"
            else
              echo "GUARD_RESULT ${{ matrix.revision }} FAIL $check"
              grep -m1 -E 'AssertionError|Error:|ERR_ASSERTION' /tmp/guard-output.txt || true
              grep -m1 -E 'exact |native |reviewed |complete |original ' /tmp/guard-output.txt || true
            fi
          done
      - name: Inspect exact built HTML and asset differences
        if: matrix.revision == 'head'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/gpl-table-base "$BASE_SHA"
          (cd /tmp/gpl-table-base && npm ci >/tmp/gpl-base-install.log && npm run build >/tmp/gpl-base-build.log)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const rootA='/tmp/gpl-table-base/dist',rootB='dist';
          const pages=[
            'industrial-safety/written/safety-management/accident-analysis-tools/index.html',
            'computer-literacy/written/computer-basics/aero-peek/index.html',
            'fire-safety-manager-level2/written/fire-safety-practice/detector-transmitter-signal-reading/index.html',
            'index.html'
          ];
          const sha = s=>createHash('sha256').update(s).digest('hex').slice(0,12);
          const tokens = s=>[...s.matchAll(/(?:src|href)="(\/_astro\/[^"]+)"/g)].map(m=>m[1]);
          const normalize = s=>s.replaceAll(/\/_astro\/[\w.-]+/g,'/_astro/ASSET');
          for(const file of pages){
            const old=fs.readFileSync(path.join(rootA,file),'utf8'), now=fs.readFileSync(path.join(rootB,file),'utf8');
            let prefix=0;while(prefix<Math.min(old.length,now.length)&&old[prefix]===now[prefix])prefix++;
            let suffix=0;while(suffix<Math.min(old.length,now.length)-prefix&&old[old.length-1-suffix]===now[now.length-1-suffix])suffix++;
            const article = html=>html.match(/<article\b[^>]*>[\s\S]*?<\/article>/)?.[0]||'';
            console.log('HTML_COMPARISON',JSON.stringify({
              file, oldHash:sha(old),newHash:sha(now),oldLength:old.length,newLength:now.length,
              firstDiff:prefix, oldSnippet:old.slice(prefix,prefix+210),newSnippet:now.slice(prefix,prefix+210),
              suffix, articleEqual:sha(article(old))===sha(article(now)),normalizedEqual:normalize(old)===normalize(now),
              oldAssets:tokens(old).slice(0,12),newAssets:tokens(now).slice(0,12)
            }));
          }
          NODE
      - name: Show precise output changes
        if: matrix.revision == 'head'
        run: |
          python3 - <<'PY'
          from difflib import SequenceMatcher
          from pathlib import Path
          for rel in [
            'industrial-safety/written/safety-management/accident-analysis-tools/index.html',
            'computer-literacy/written/computer-basics/aero-peek/index.html',
          ]:
            a=(Path('/tmp/gpl-table-base/dist')/rel).read_text()
            b=(Path('dist')/rel).read_text()
            print('CHANGES_FOR', rel)
            matches=SequenceMatcher(None,a,b,autojunk=False)
            edits=[(tag,i,j,k,l) for tag,i,j,k,l in matches.get_opcodes() if tag!='equal']
            print('EDIT_COUNT',len(edits))
            for tag,i,j,k,l in edits[:25]:
              print('EDIT',tag,'old',i,j,'new',k,l, 'FROM',repr(a[i:j][:650]),'TO',repr(b[k:l][:650]))
          PY
