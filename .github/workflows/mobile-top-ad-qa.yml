name: Mobile top advertisement QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/layouts/BaseLayout.astro'
      - 'src/layouts/ChapterLayout.astro'
      - 'src/pages/**/index.astro'
      - 'src/styles/global.css'
      - 'scripts/*mobile-top-ad*'
      - 'scripts/*mobile-chapter-top-ad*'
      - 'docs/audits/2026-10-27-mobile-chapter-top-ad/**'
      - 'docs/audits/2026-10-27-mobile-top-ad/**'
      - '.github/workflows/mobile-top-ad-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select historical snapshot verification root
        id: historical
        run: node scripts/prepare-mobile-ad-legacy-qa.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: ${{ steps.historical.outputs.root }}
      - run: npm run build
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-mobile-top-ad.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-mobile-chapter-top-ad.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-gnb-toc-height.mjs && node scripts/check-gnb-chapter-toc.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - name: Prepare temporary browser tooling
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: All listing pages and advertisement initialization
        working-directory: ${{ steps.historical.outputs.root }}
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-ad-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-mobile-top-ad.cjs
          node scripts/qa-mobile-chapter-top-ad.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-top-ad-qa
          path: |
            ${{ steps.historical.outputs.root }}/qa-results/mobile-top-ad/
            ${{ steps.historical.outputs.root }}/qa-results/mobile-chapter-top-ad/
          retention-days: 14
