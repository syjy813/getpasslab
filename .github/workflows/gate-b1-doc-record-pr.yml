name: Apply Gate B1 documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/gate-b1-production-record
          fetch-depth: 0

      - name: Update documents
        shell: python
        run: |
          from pathlib import Path

          p = Path('AI_HANDOVER.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('**최종 갱신일**: 2026-08-02 / **작성자**: Claude·ChatGPT·Codex / **버전**: v1.8', '**최종 갱신일**: 2026-08-03 / **작성자**: Claude·ChatGPT·Codex / **버전**: v1.9', 1)
          s = s.replace('시험 인사이트 2개 배치, 관계·구조 정리 Gate A의 production 검증까지 완료됐다.', '시험 인사이트 2개 배치, 관계·구조 정리 Gate A와 기존 챕터 범위 보정 Gate B1의 production 검증까지 완료됐다.', 1)
          s = s.replace('문서 맨 아래의 `관계·구조 정리 Gate A·production 검증 게이트 완료` 절을 우선한다.', '문서 맨 아래의 `관계·구조 범위 보정 Gate B1·production 검증 게이트 완료` 절을 우선한다.', 1)

          marker = '## 관계·구조 범위 보정 Gate B1·production 검증 게이트 완료 (2026-08-03)'
          section = '''

## 관계·구조 범위 보정 Gate B1·production 검증 게이트 완료 (2026-08-03)

- PR #16 `content: broaden Gate B1 chapter scope` 완료.
- Owner 승인 후 Squash and merge로 `main` 반영 완료.
- `main` 병합 커밋: `6546086ed12e5b239a286a570397ce3672215a7b`.
- 병합 전 `SEO validation` run #124 (`30779394278`): **PASS**.
- production 검증 workflow run `30780077891`, job `91582847298`: **PASS**.
- Gate B1 Production 상태: **VERIFIED**.

### 완료 범위

- `ventricular-fibrillation-current`: `심실세동·전격사 위험`으로 범위 확대.
- `construction-hazard-plan-documents`: `건설공사 유해·위험방지계획서 제출 기준`으로 범위 확대.
- `leakage-breaker-types`: `누전차단기 구조·정격·시설기준`으로 범위 확대.
- 변경 파일 3개, 추가 134줄, 삭제 36줄.
- 기존 `slug`, `subject_id`, `question_id`, 관계 배열과 문제 데이터는 변경하지 않음.

### 검증

- PR 최종 HEAD: `178d52209af90d92a9d5d28e26fedb26e4b34a4a`.
- Astro build: 209페이지.
- SEO: HTML 209개, sitemap URL 210개, 경고 0개, 오류 0개.
- 공개 콘텐츠 검사: HTML 209개, 오류 0개.
- 세 production 페이지에서 기존 URL 유지와 신규 제목·본문 반영 확인.
- 임시 검증 PR #17은 병합하지 않고 종료했으며 workflow도 제거함.
- 상세 문서: `docs/audits/2026-08-03-relation-structure-gate-b1-production-verification.md`.

### 남은 위험과 다음 작업

- Gate B2에서 건설공사 법령 수치와 누전차단기 산업안전보건기준·KEC 수치·조건·예외 및 후보 관계 3건을 정밀 검토.
- 신규 Reason 인간오류·일반 연삭기 안전 챕터는 신규 공개 `slug` Owner 결정 필요.
- 원문 누락·OCR·이미지 의존 문항은 복원 전 비공개 유지.
- npm 취약점 5건과 Actions deprecation 경고는 별도 감사로 유지.

다음 권장 작업은 Gate B2 법령·관계 정밀 감사이며 GPT-5.6 Sol의 Pro 추론 강도를 권장한다.
'''
          if marker not in s:
              s = s.rstrip() + section + '\n'
          p.write_text(s, encoding='utf-8')

          q = Path('docs/audits/2026-08-03-relation-structure-gate-b1-production-verification.md')
          q.parent.mkdir(parents=True, exist_ok=True)
          q.write_text('''# 관계·구조 범위 보정 Gate B1 production 검증

- 검증일: 2026-08-03
- 대상 PR: #16 `content: broaden Gate B1 chapter scope`
- `main` 병합 커밋: `6546086ed12e5b239a286a570397ce3672215a7b`
- 병합 방식: Squash and merge
- 최종 결과: **PASS**

## 구현 범위

| `slug` | 기존 제목 | 변경 제목 |
|---|---|---|
| `ventricular-fibrillation-current` | 심실세동 전류 | 심실세동·전격사 위험 |
| `construction-hazard-plan-documents` | 유해·위험방지계획서 첨부서류 6가지 | 건설공사 유해·위험방지계획서 제출 기준 |
| `leakage-breaker-types` | 누전차단기 종류 | 누전차단기 구조·정격·시설기준 |

- 변경 파일 3개, 추가 134줄, 삭제 36줄.
- 기존 동결 키·관계 배열·문제 데이터·스키마·의존성·URL·production 설정 무변경.

## 병합 전 검증

- PR HEAD: `178d52209af90d92a9d5d28e26fedb26e4b34a4a`.
- `SEO validation` run `30779394278` (#124): 성공.
- Astro build 209페이지.
- SEO 경고 0개·오류 0개.
- 공개 콘텐츠 검사 오류 0개.

## Production 검증

- workflow run `30780077891`, job `91582847298`: 성공.
- 심실세동·전격사 위험: 신규 제목과 `전격사의 주요 메커니즘` 확인.
- 건설공사 유해·위험방지계획서 제출 기준: 신규 제목과 `기출 기준과 현행 기준` 확인.
- 누전차단기 구조·정격·시설기준: 신규 제목과 `습윤장소와 욕실 기준` 확인.
- 기존 URL과 `slug` 유지 확인.
- 검증 PR #17은 미병합 종료, 임시 workflow 제거.

## 남은 위험

- npm 감사 경고 5건, `tsconfck` deprecated, install-script allowlist, Actions Node.js 20 deprecation 경고 유지.
- 현행 법령·KEC 세부 수치와 후보 관계 추가는 Gate B2로 유지.
- GitHub Pages run ID는 별도 수집하지 않았으나 production 응답으로 실제 반영 검증.

## 최종 판정

- Gate B1: **완료**.
- production: **VERIFIED**.
- `AI_HANDOVER.md`: v1.9 갱신.
- 다음 작업: Gate B2 법령·관계 정밀 감사.
''', encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_HANDOVER.md docs/audits/2026-08-03-relation-structure-gate-b1-production-verification.md
          git commit -m 'docs: record Gate B1 production verification [skip ci]'
          git push origin HEAD:docs/gate-b1-production-record
