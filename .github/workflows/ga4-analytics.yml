name: GA4 facility article page views

on:
  push:
    branches: [chore/ga4-auth-connection]
    paths:
      - '.github/workflows/ga4-analytics.yml'
      - 'scripts/check-ga4-auth.mjs'
      - 'scripts/test-ga4-auth.mjs'
      - 'scripts/sync-ga4-page-views.mjs'
      - 'scripts/test-ga4-page-views.mjs'
      - 'scripts/commit-ga4-page-views.mjs'
      - 'scripts/lib/facility-page-views.mjs'
  workflow_dispatch:
  # Runs only on the default branch after a separately approved merge.
  schedule:
    - cron: '13 2 * * *'

permissions:
  contents: read

concurrency:
  group: ga4-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --check scripts/check-ga4-auth.mjs
      - run: node scripts/test-ga4-auth.mjs
      - run: node --check scripts/sync-ga4-page-views.mjs
      - run: node --check scripts/commit-ga4-page-views.mjs
      - run: node --check scripts/lib/facility-page-views.mjs
      - run: node scripts/test-ga4-page-views.mjs
  authenticate-and-query:
    needs: validate
    # External identity trust and IAM grant approved by the user.
    if: github.repository_id == '1292439277' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chore/ga4-auth-connection')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # only this job can update the facility view-count JSON
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Authenticate with short-lived read-only credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: level-array-514808-v0
          workload_identity_provider: projects/528916134663/locations/global/workloadIdentityPools/getpasslab-github/providers/github-actions
          service_account: getpasslab-ga4-reader@level-array-514808-v0.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify authentication and cumulative page-view query
        env:
          GA4_PROPERTY_ID: '547805075'
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/check-ga4-auth.mjs
      - name: Build published facility article view-count snapshot
        env:
          GA4_PROPERTY_ID: '547805075'
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/sync-ga4-page-views.mjs
      - name: Commit the single approved snapshot file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/commit-ga4-page-views.mjs
