name: GA4 facility article page views

on:
  push:
    branches: [chore/ga4-auth-connection]
    paths:
      - '.github/workflows/ga4-analytics.yml'
      - 'scripts/check-ga4-auth.mjs'
      - 'scripts/test-ga4-auth.mjs'
      - 'scripts/sync-ga4-page-views.mjs'
      - 'scripts/test-ga4-page-views.mjs'
      - 'scripts/commit-ga4-page-views.mjs'
      - 'scripts/dispatch-ga4-pages.mjs'
      - 'scripts/lib/facility-page-views.mjs'
      - 'scripts/read-ga4-sorting-release.mjs'
      - 'scripts/qa-ga4-sorting.cjs'
      - 'scripts/check-facility-launch.mjs'
      - 'src/pages/facility-management/[category]/index.astro'
  workflow_dispatch:
  # Runs only on the default branch after a separately approved merge.
  schedule:
    - cron: '13 2 * * *'

permissions:
  contents: read

concurrency:
  group: ga4-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --check scripts/check-ga4-auth.mjs
      - run: node scripts/test-ga4-auth.mjs
      - run: node --check scripts/sync-ga4-page-views.mjs
      - run: node --check scripts/commit-ga4-page-views.mjs
      - run: node --check scripts/dispatch-ga4-pages.mjs
      - run: node --check scripts/lib/facility-page-views.mjs
      - run: node scripts/test-ga4-page-views.mjs
  authenticate-and-query:
    needs: validate
    # External identity trust and IAM grant approved by the user.
    if: github.repository_id == '1292439277' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chore/ga4-auth-connection')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # only this job can update the facility view-count JSON
      id-token: write
    outputs:
      snapshot_changed: ${{ steps.commit_snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Authenticate with short-lived read-only credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: level-array-514808-v0
          workload_identity_provider: projects/528916134663/locations/global/workloadIdentityPools/getpasslab-github/providers/github-actions
          service_account: getpasslab-ga4-reader@level-array-514808-v0.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify authentication and cumulative page-view query
        env:
          GA4_PROPERTY_ID: '547805075'
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/check-ga4-auth.mjs
      - name: Build published facility article view-count snapshot
        env:
          GA4_PROPERTY_ID: '547805075'
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/sync-ga4-page-views.mjs
      - name: Commit the single approved snapshot file
        id: commit_snapshot
        # A branch push validates collection but does not move the PR head with [skip ci].
        # Manual dispatch can refresh this branch; production schedule refreshes main.
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/commit-ga4-page-views.mjs
  deploy-refreshed-data:
    needs: authenticate-and-query
    if: github.ref == 'refs/heads/main' && needs.authenticate-and-query.outputs.snapshot_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Request existing Pages workflow after verified data update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-ga4-pages.mjs
  verify-sorting-ui:
    needs: validate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and verify protected facility source and publication
        run: |
          npm run build > /tmp/ga4-sort-build.log 2>&1
          tail -n 8 /tmp/ga4-sort-build.log
          node scripts/check-facility-launch.mjs
          node scripts/check-facility-publication.mjs
          npm run check:seo
          npm run check:public-content
      - name: Install Chromium for sorting behavior checks
        run: |
          npm install --prefix /tmp/ga4-sort-tools --no-package-lock --no-audit playwright@1.62.1
          /tmp/ga4-sort-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check sorting at mobile and desktop widths
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/ga4-sort-tools/node_modules/playwright
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist >/tmp/ga4-sort-server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          node scripts/qa-ga4-sorting.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga4-facility-sorting-review
          path: qa-results/ga4-sorting/
          if-no-files-found: ignore
          retention-days: 14
