name: Temporary P0 relation recheck retry

on:
  push:
    branches:
      - work/industrial-safety-p0-recheck-20260816

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/industrial-safety-p0-recheck-20260816
          fetch-depth: 0

      - name: Apply two verified relations
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, qid, replacements):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              m = re.search(r'^questions:\s*\[(.*?)\]\s*$', t, re.MULTILINE)
              if not m:
                  raise SystemExit(f'STOP: questions line missing: {path}')
              ids = [x.strip() for x in m.group(1).split(',') if x.strip()]
              if qid in ids:
                  raise SystemExit(f'STOP: already related: {qid}')
              ids.append(qid)
              t = t[:m.start()] + 'questions: [' + ', '.join(ids) + ']' + t[m.end():]
              for label, old, new in replacements:
                  if t.count(old) != 1:
                      raise SystemExit(f'STOP: {label} marker count={t.count(old)}')
                  t = t.replace(old, new, 1)
              p.write_text(t, encoding='utf-8', newline='\n')

          fta_feature = 'FTA의 특징 — 연역적 분석, 정량적 평가 가능(발생확률 계산), 논리기호 사용으로 해석 명확, 컴퓨터 처리 가능, 단기간 훈련으로 사용 가능 · 한계 — 톱사상 선정에 따라 결과가 좌우, 복잡한 시스템은 FT 규모 급증'
          patch(
              'src/content/chapters/ergonomics/fta-procedure.md',
              '20190427_026',
              [
                  ('FTA concept', fta_feature, fta_feature + '\n\nFTA의 대표 기대효과는 **시스템 결함 진단**, **사고원인 규명의 간편화**, **사고원인 분석의 정량화**로 묶어 판별함 · 수록 기출에서는 `시간에 따른 원인 분석`을 FTA의 대표 기대효과와 거리가 먼 항목으로 출제함'),
                  ('FTA exam points', '| FTA 수행 절차 · 개선계획의 작성 | **개선계획의 작성** |\n', '| FTA 수행 절차 · 개선계획의 작성 | **개선계획의 작성** |\n| FTA 기대효과 | **시스템 결함 진단 · 사고원인 규명의 간편화 · 사고원인 분석의 정량화** |\n| FTA 기대효과와 거리가 먼 것 | **시간에 따른 원인 분석** |\n'),
              ],
          )

          ai_anchor = 'AI는 말의 이해 가능성을 나타내고, SIL 계열은 잡음의 통화 방해 정도를 나타냄 · PSIL은 음성통신에 중요한 `500·1000·2000 Hz` 옥타브 대역의 소음 수준을 이용하는 지표임\n\n'
          ai_calc = ai_anchor + '### 수록 그림형 명료도 지수 계산\n\n2021년 8월 수록 기출의 그림형은 각 구간에 제시된 `log(S/N)` 값에 **말소리 중요도 가중치**를 곱한 뒤 모두 합산하는 방식으로 계산함\n\n| 구간 | `log(S/N)` | 중요도 가중치 | 기여값 |\n|---|---:|---:|---:|\n| I | -0.7 | 1 | -0.7 |\n| II | 0.18 | 1 | 0.18 |\n| III | 0.6 | 2 | 1.2 |\n| IV | 0.7 | 1 | 0.7 |\n\n`(-0.7×1) + (0.18×1) + (0.6×2) + (0.7×1) = 1.38`이므로 이 그림의 정답은 <strong>1.38</strong>임 · 이 계산은 해당 기출 그림에 주어진 값과 가중치를 그대로 적용하는 판별법으로 사용하고, 현대 SII의 일반 계산 절차 전체를 이 한 식으로 대체해 해석하지 않음\n\n'
          patch(
              'src/content/chapters/ergonomics/articulation-index.md',
              '20210814_036',
              [
                  ('AI examComment', 'examComment: 잡음이 통화이해도에 미치는 영향을 추정하는 지수와, 소음환경 관련 지수 묶음에서 MAA를 제외하는 유형이 각각 확인됨', 'examComment: 잡음의 통화이해도 영향·소음환경 지수 구분형과, 그림의 대역별 log(S/N) 값에 말소리 중요도 가중치를 곱해 합산하는 명료도 지수 계산형이 확인됨'),
                  ('AI calculation section', ai_anchor, ai_calc),
                  ('AI exam point', '| AI | **명료도 지수(Articulation Index)** · 말소리 중 이해 가능한 비율을 나타내는 값 |\n', '| AI | **명료도 지수(Articulation Index)** · 말소리 중 이해 가능한 비율을 나타내는 값 |\n| 그림형 AI 계산 | **각 구간 `log(S/N) × 말소리 중요도 가중치`의 합** · 수록 그림은 **1.38** |\n'),
                  ('AI pitfall', '- 통화 간섭 수준을 AI와 같은 이름으로 보지 않음 · 두 지수는 관련되지만 평가 표현이 다름\n', '- 통화 간섭 수준을 AI와 같은 이름으로 보지 않음 · 두 지수는 관련되지만 평가 표현이 다름\n- 그림형 계산에서는 각 구간의 부호와 가중치를 그대로 반영함 · 특히 I 구간의 `-0.7`을 양수로 바꾸거나 III 구간의 가중치 `2`를 누락하지 않음\n'),
              ],
          )

      - name: Install and validate
        run: |
          npm ci
          npm run build
          npm run check:seo
          npm run check:public-content

      - name: Relation and scope QA
        shell: python
        run: |
          import json, re, subprocess
          from collections import Counter
          from pathlib import Path

          expected = {
              'fta-procedure': ('20190427_026', 2, 2),
              'articulation-index': ('20210814_036', 2, 3),
          }
          holds = {'20180304_035','20190804_018','20190804_061','20190804_112','20200606_023','20200606_075','20200822_035','20200822_070','20200822_073','20210515_102','20220424_062'}
          qs = json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          qmap = {q['id']: q for q in qs}
          if len(qs) != 1680 or len(qmap) != 1680:
              raise SystemExit('STOP: question integrity')
          for slug, (qid, sid, answer) in expected.items():
              q = qmap[qid]
              if q['subject_id'] != sid or q['answer'] != answer:
                  raise SystemExit(f'STOP: source mismatch {qid}: subject={q["subject_id"]}, answer={q["answer"]}')

          assets = json.loads(Path('src/data/question-assets/industrial-safety.json').read_text(encoding='utf-8'))
          amap = {a['id']: a for a in assets}
          if '20210814_036' not in amap or not Path(amap['20210814_036']['asset_path']).is_file():
              raise SystemExit('STOP: 20210814_036 source image missing')

          refs, by_slug = [], {}
          root = Path('dist/industrial-safety/written')
          for f in root.rglob('index.html'):
              rel = f.relative_to(root)
              if len(rel.parts) != 3:
                  continue
              ids = re.findall(r'data-open="(\d{8}_\d{3})"', f.read_text(encoding='utf-8', errors='ignore'))
              by_slug[rel.parts[1]] = ids
              refs.extend(ids)
          for slug, (qid, _, _) in expected.items():
              if by_slug.get(slug, []).count(qid) != 1:
                  raise SystemExit(f'STOP: relation missing/duplicate {qid} -> {slug}')
          mapped = set(refs)
          if holds & mapped:
              raise SystemExit(f'STOP: hold mapped: {sorted(holds & mapped)}')
          c = Counter(refs)
          actual = (len(refs), len(mapped), 1680-len(mapped), sum(v > 1 for v in c.values()))
          if actual != (980, 970, 710, 10):
              raise SystemExit(f'STOP: relation counts {actual}')

          status = subprocess.check_output(['git','status','--porcelain'], text=True)
          files = set()
          for line in status.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              files.add(path)
          expected_files = {'src/content/chapters/ergonomics/articulation-index.md','src/content/chapters/ergonomics/fta-procedure.md'}
          if files != expected_files:
              raise SystemExit(f'STOP: changed scope {sorted(files)}')
          subprocess.run(['git','diff','--check'], check=True)
          print(f'P0 QA PASS refs={actual[0]} unique={actual[1]} unmapped={actual[2]} multi={actual[3]}')

      - name: Commit verified chapter changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/chapters/ergonomics/articulation-index.md src/content/chapters/ergonomics/fta-procedure.md
          git commit -m 'feat: add verified P0 industrial safety relations'
          git push origin HEAD:work/industrial-safety-p0-recheck-20260816
