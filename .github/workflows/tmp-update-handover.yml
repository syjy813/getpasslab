name: Temporary handover update

on:
  push:
    branches:
      - docs/handover-relations-20260816

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/handover-relations-20260816
          fetch-depth: 0
      - name: Update AI handover
        shell: python
        run: |
          from pathlib import Path

          path = Path('AI_HANDOVER.md')
          text = path.read_text(encoding='utf-8')

          old_header = '**최초 작성일**: 2026-07-14 / **최종 갱신일**: 2026-08-13 / **작성자**: Claude·ChatGPT·Codex / **버전**: v1.17'
          new_header = '**최초 작성일**: 2026-07-14 / **최종 갱신일**: 2026-08-16 / **작성자**: Claude·ChatGPT·Codex / **버전**: v1.18'
          if old_header not in text:
              raise SystemExit('STOP: expected handover header not found')
          text = text.replace(old_header, new_header, 1)

          old_dynamic = '- **최신 동적 상태**: 문서 맨 아래의 `전 공개 챕터 시험 포인트 전수 개선 production 게이트 완료` 절을 우선한다.'
          new_dynamic = '- **산업안전 관계 상태**: 1,680문항 중 고유 연결 954문항, 미연결 726문항. 관계 참조 964건, 다중 연결 10문항. PR #66에서 검증된 23개 관계를 기존 18개 챕터에 추가했다.\n- **최신 동적 상태**: 문서 맨 아래의 `산업안전기사 기출 관계 정밀 보강 게이트 완료` 절을 우선한다.'
          if old_dynamic not in text:
              raise SystemExit('STOP: expected dynamic-state marker not found')
          text = text.replace(old_dynamic, new_dynamic, 1)

          old_next = '다음 작업은 Owner 우선순위에 따라 산업안전기사 미연결 이미지의 관계 검토, 컴활 2급 추가 회차 내재화, 기출 이용 권리 결정 또는 수익화·분석 상태 확인 중 하나를 별도 승인 범위로 진행한다.'
          new_next = '다음 작업은 산업안전기사 미연결 726문항을 위험 기반 배치로 재검토한다. 먼저 기존 챕터에 거의 일치하지만 본문 범위·검사기 문제로 보류한 20문항을 정밀 검토하고, 이후 REVIEW 후보를 과목별로 진행한다. 신규 공개 slug는 Owner 승인 없이 생성하지 않는다.'
          if old_next not in text:
              raise SystemExit('STOP: expected next-task marker not found')
          text = text.replace(old_next, new_next, 1)

          gate_title = '## 산업안전기사 기출 관계 정밀 보강 게이트 완료 (2026-08-16)'
          if gate_title in text:
              raise SystemExit('STOP: gate already recorded')

          gate = r'''

---

## 산업안전기사 기출 관계 정밀 보강 게이트 완료 (2026-08-16)

기존 산업안전기사 1,680문항을 새로 수집하지 않고, 보유 기출의 활용도를 높이기 위해 미연결 문항과 기존 공개 챕터의 관계를 재검토했다. 자동 후보를 그대로 반영하지 않고 문항 의미·챕터 범위·법령·이미지·공개 콘텐츠 검사를 다시 확인해 검증된 관계만 반영했다.

### 1. 구현 결과

- PR: `#66 fix: add verified industrial safety question relations`
- merge commit: `0998dc439f8abfc1a20010f731092a1cf8307cea`
- 기존 공개 챕터 18개에 기출 관계 **23건** 추가
- 신규 `slug`, `subject_id`, `question_id` 변경 없음
- 신규 의존성·스키마·UX 변경 없음
- `anthropometry-design`, `severity-rate`의 관계 수에 맞춰 `examComment` 수치 보정
- 기존 `total-noise-dose`의 공개 HTML에 Markdown 강조 마커가 남던 렌더링 오류 1건을 의미·수치 변경 없이 수정

### 2. 검증된 관계 상태

- 산업안전기사 전체 문항: **1,680**
- 관계 참조: **964**
- 고유 연결 문항: **954**
- 미연결 문항: **726**
- 다중 연결 문항: **10**
- 최초 ADD 후보 43건 중 19건은 챕터 범위 불일치·본문 미수록으로 제외
- `20190303_094 -> spontaneous-combustion` 1건은 의미상 관계가 맞지만 `check-public-content.mjs`가 정상 시험 용어 `저장소`를 금지어로 오탐하여 관계 반영을 보류

### 3. 검증·배포 증거

PR 최종 검증:

- 관계 dry-run 및 question_id 무결성: PASS
- `npm run build`: PASS — **255 pages**
- `npm run check:seo`: PASS — HTML **257**, sitemap URL **256**, 경고 **0**, 오류 **0**
- `npm run check:public-content`: PASS — HTML **257**, 오류 **0**

merge 후 GitHub Pages run `31892749968`:

- build job: **success**
- deploy job: **success**

실제 라이브 페이지의 별도 브라우저 runtime QA는 이번 게이트에서 수행하지 않았다.

### 4. 남은 위험·다음 작업

- 미연결 **726문항**은 추가 검토 대상이며, 관계 수를 늘리기 위해 억지 매핑하지 않는다.
- 우선 검토 대상은 기존 ADD에서 보류된 **20문항**이다. 이 중 19건은 기존 챕터 범위·본문 보강 가능성을 다시 판단하고, `20190303_094`는 공개 콘텐츠 검사기의 false positive를 별도 범위에서 다룬다.
- 신규 챕터·신규 공개 slug가 필요하면 별도 Owner 결정으로 분리한다.
- `npm ci`에서 기존 의존성의 **2 high severity vulnerabilities** 경고가 확인됐으나 이번 작업에서 의존성을 변경하지 않았다.
- 기출 텍스트·이미지 이용 권리, AdSense·Search Console·GA4 외부 상태는 기존 Owner 결정/외부 검증 범위로 유지한다.

최종 상태: 산업안전기사 기출 관계 정밀 보강 게이트 **VERIFIED**. 다음 관계 작업은 현재 `main`과 이 수치를 기준선으로 사용한다.
'''

          text = text.rstrip() + gate + '\n'
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "AI_HANDOVER.md"
          grep -Fq '고유 연결 문항: **954**' AI_HANDOVER.md
          grep -Fq '미연결 문항: **726**' AI_HANDOVER.md
          grep -Fq '0998dc439f8abfc1a20010f731092a1cf8307cea' AI_HANDOVER.md
      - name: Commit verified handover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_HANDOVER.md
          git commit -m 'docs: record industrial safety relation gate'
          git push origin HEAD:docs/handover-relations-20260816
