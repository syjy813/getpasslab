name: Temporary subject1 handover update

on:
  push:
    branches:
      - docs/industrial-safety-subject1-final-sweep-20260817

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/industrial-safety-subject1-final-sweep-20260817
      - name: Update verified audit and handover
        shell: python
        run: |
          from pathlib import Path
          import base64

          section_b64 = ""
          audit_b64 = ""

          handover = Path('AI_HANDOVER.md')
          text = handover.read_text(encoding='utf-8')
          section = base64.b64decode(section_b64).decode('utf-8')
          audit_content = base64.b64decode(audit_b64).decode('utf-8')
          title = '## 산업안전기사 1과목 P1 관계 보강·최종 sweep 완료 (2026-08-17)'

          if title not in text:
              replacements = {
                  '> **최초 작성일**: 2026-07-14 / **최종 갱신일**: 2026-08-16 / **작성자**: Claude·ChatGPT·Codex / **버전**: v1.19': '> **최초 작성일**: 2026-07-14 / **최종 갱신일**: 2026-08-17 / **작성자**: Claude·ChatGPT·Codex / **버전**: v1.20',
                  '- **산업안전 관계 상태**: 1,680문항 중 고유 연결 968문항, 미연결 712문항. 관계 참조 978건, 다중 연결 10문항. PR #66의 23건에 이어 PR #68에서 14개 관계를 기존 5개 챕터에 추가했고, 보류 6건은 미연결 상태를 유지한다.': '- **산업안전 관계 상태**: 1,680문항 중 고유 연결 **994문항**, 미연결 **686문항**. 관계 참조 **1,004건**, 다중 연결 **10문항**. 1과목은 280문항 중 170문항 연결·110문항 미연결이며, 기존 챕터에 안전하게 추가할 수 있는 P1 후보의 최종 sweep을 완료했다.',
                  '- **최신 동적 상태**: 문서 맨 아래의 `산업안전기사 기출 관계 정밀 보강 게이트 완료` 절을 우선한다.': '- **최신 동적 상태**: 문서 맨 아래의 `산업안전기사 1과목 P1 관계 보강·최종 sweep 완료` 절을 우선한다.'
              }
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'STOP replacement target count={text.count(old)}: {old[:80]}')
                  text = text.replace(old, new, 1)
              text = text.rstrip() + section + '\n'
              handover.write_text(text, encoding='utf-8', newline='\n')

          audit = Path('docs/audits/2026-08-17-industrial-safety-subject1-p1-final-sweep.md')
          if not audit.exists():
              audit.write_text(audit_content, encoding='utf-8', newline='\n')
      - name: Validate documentation changes
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "AI_HANDOVER.md docs/audits/2026-08-17-industrial-safety-subject1-p1-final-sweep.md "
          grep -Fq '관계 참조: **1,004**' AI_HANDOVER.md
          grep -Fq '고유 연결: **994문항**' AI_HANDOVER.md
          grep -Fq '미연결: **686문항**' AI_HANDOVER.md
          grep -Fq '7503b7b9686868019fb60f2cd2c705774b33c67b' AI_HANDOVER.md
          grep -Fq '기존 챕터 신규 연결: **0건**' docs/audits/2026-08-17-industrial-safety-subject1-p1-final-sweep.md
      - name: Commit verified documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_HANDOVER.md docs/audits/2026-08-17-industrial-safety-subject1-p1-final-sweep.md
          git commit -m "docs: record subject1 P1 final sweep [skip ci]"
          git push origin HEAD:docs/industrial-safety-subject1-final-sweep-20260817
