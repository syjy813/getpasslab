name: Temporary final subject1 handover update

on:
  push:
    branches:
      - docs/industrial-safety-subject1-final-sweep-20260817

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/industrial-safety-subject1-final-sweep-20260817
      - name: Apply verified handover update
        run: python .github/tmp/update_subject1_handover.py
      - name: Validate exact diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "AI_HANDOVER.md"
          grep -Fq '고유 연결 **994문항**, 미연결 **686문항**' AI_HANDOVER.md
          grep -Fq '관계 참조 **1,004건**' AI_HANDOVER.md
          grep -Fq -- '- 고유 연결 문항: **994**.' AI_HANDOVER.md
          grep -Fq -- '- 미연결 문항: **686**.' AI_HANDOVER.md
      - name: Commit handover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_HANDOVER.md
          git commit -m "docs: update verified subject1 handover [skip ci]"
          git push origin HEAD:docs/industrial-safety-subject1-final-sweep-20260817
