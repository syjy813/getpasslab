name: Temporary subject1 P1 scope correction

on:
  push:
    branches:
      - work/industrial-safety-subject1-p1-batch1-20260816

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Remove three over-broad relations and content expansion
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/content/chapters/safety-management/safety-education-stages.md')
          t = p.read_text(encoding='utf-8')

          old_q = 'questions: [20190427_010, 20190804_007, 20200926_020, 20210307_008, 20180428_016, 20200926_019, 20200606_008]'
          new_q = 'questions: [20190427_010, 20190804_007, 20200926_020, 20210307_008]'
          if t.count(old_q) != 1:
              raise SystemExit('STOP questions state changed')
          t = t.replace(old_q, new_q, 1)

          plan = '\n\n기출의 교육계획 항목 분류에서는 **교육의 종류·대상 / 과목·교육내용 / 장소·교육방법**을 계획에 포함함 · `교육지도안`은 이 문제에서 교육계획의 포함 항목으로 분류하지 않음'
          if t.count(plan) != 1:
              raise SystemExit('STOP planning expansion state changed')
          t = t.replace(plan, '', 1)

          basic = '''\n\n### 학습지도 기본원리\n\n| 원리 | 판별 기준 |\n|---|---|\n| **직관의 원리** | 구체적 사물·자료와 직접 경험을 활용해 이해를 도움 |\n| **개별화의 원리** | 학습자의 요구·능력·개인차에 맞는 학습기회를 제공 |\n| **자기활동의 원리** | 학습자가 스스로 참여하고 활동하도록 구성 |\n| **사회화의 원리** | 공동활동과 상호작용을 통해 사회적 학습을 촉진 |\n\n`계속성`은 위 학습지도 기본원리의 명칭으로 고르지 않음 · 계속성·계열성·통합성은 타일러 학습경험 **조직** 원리와 구분함'''
          if t.count(basic) != 1:
              raise SystemExit('STOP learning-guidance expansion state changed')
          t = t.replace(basic, '', 1)
          p.write_text(t, encoding='utf-8', newline='\n')

          a = Path('docs/audits/2026-08-16-industrial-safety-subject1-p1-batch1.md')
          x = a.read_text(encoding='utf-8')
          replacements = {
            '- 판정: 기존 챕터 연결 18건 / 보류 6건': '- 판정: 기존 챕터 연결 15건 / 보류 9건',
            '## 기존 챕터 연결 18건': '## 기존 챕터 연결 15건',
            '- `safety-education-stages`: `20200926_020`, `20210307_008`, `20180428_016`, `20200926_019`, `20200606_008`': '- `safety-education-stages`: `20200926_020`, `20210307_008`',
            '관계만으로 정답 근거가 부족한 `zero-accident-movement`, `safety-education-stages`, `carelessness-misjudgment`는 해당 18문항이 요구하는 범위 안에서만 본문을 보강했다.': '관계만으로 정답 근거가 부족한 `zero-accident-movement`, `safety-education-stages`, `carelessness-misjudgment`는 해당 15문항이 요구하는 범위 안에서만 본문을 보강했다.',
            '## 보류 6건': '## 보류 9건',
          }
          for old, new in replacements.items():
              if x.count(old) != 1:
                  raise SystemExit(f'STOP audit marker changed: {old}')
              x = x.replace(old, new, 1)
          insert = '''\n- `20180428_016`: 학습지도 기본원리 문제 — 현재 `safety-education-stages`의 교육 3단계보다 범위가 넓어 신규 주제 후보로 유지\n- `20200926_019`: 학습지도 개별화 원리 문제 — 현재 `safety-education-stages`의 교육 3단계보다 범위가 넓어 신규 주제 후보로 유지\n- `20200606_008`: 안전보건교육 계획 포함 항목 문제 — 교육단계 챕터의 직접 소유 범위가 아니므로 신규 주제 후보로 유지'''
          marker = '- `20190427_015`: 듀이 사고과정 5단계로 현재 기존 챕터와 직접 일치하지 않아 신규 주제 후보로 유지'
          if x.count(marker) != 1:
              raise SystemExit('STOP audit insert marker changed')
          x = x.replace(marker, marker + insert, 1)
          a.write_text(x, encoding='utf-8', newline='\n')

      - name: Validate relation structure and holds
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from collections import Counter

          safe = {
            '20190804_003','20200926_012','20200926_020','20210307_008',
            '20180304_009','20210515_006','20180819_020',
            '20180428_013','20180819_015','20190303_006','20200606_003','20210814_017','20220305_012',
            '20180819_009','20210814_003'
          }
          holds = {
            '20210515_005','20190427_015','20180304_011','20180819_018','20190303_002','20200606_012',
            '20180428_016','20200926_019','20200606_008'
          }
          data = json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          by_id = {q['id']: q for q in data}
          assert len(data) == len(by_id) == 1680

          refs=[]; owners={}
          for folder in ['safety-management','ergonomics','mechanical','electrical','chemical','construction']:
              for p in Path('src/content/chapters', folder).glob('*.md'):
                  t=p.read_text(encoding='utf-8')
                  sidm=re.search(r'^subject_id:\s*(\d+)\s*$',t,re.M)
                  slugm=re.search(r'^slug:\s*([^\n]+)$',t,re.M)
                  qm=re.search(r'^questions:\s*\[(.*?)\]\s*$',t,re.M)
                  if not (sidm and slugm and qm): continue
                  sid=int(sidm.group(1)); slug=slugm.group(1).strip().strip('"\'')
                  qids=[x.strip() for x in qm.group(1).split(',') if x.strip()]
                  assert len(qids)==len(set(qids)), slug
                  for qid in qids:
                      assert qid in by_id, (slug,qid)
                      assert by_id[qid]['subject_id']==sid, (slug,qid)
                      refs.append(qid); owners.setdefault(qid,[]).append(slug)

          for qid in safe:
              assert qid in owners, qid
          for qid in holds:
              assert qid not in owners, (qid, owners.get(qid))
          c=Counter(refs)
          assert len(refs)==995, len(refs)
          assert len(c)==985, len(c)
          assert 1680-len(c)==695
          assert sum(v>1 for v in c.values())==10
          print('CORRECTED_RELATION_QA_PASS refs=995 mapped=985 unmapped=695 multi=10')

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: SEO validation
        run: npm run check:seo
      - name: Public content validation
        run: npm run check:public-content
      - name: Diff check
        run: git diff --check

      - name: Commit correction and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-subject1-p1-scope-correction.yml
          git add src/content/chapters/safety-management/safety-education-stages.md docs/audits/2026-08-16-industrial-safety-subject1-p1-batch1.md
          git commit -m 'fix: tighten subject1 P1 relation scope'
          git push origin HEAD:work/industrial-safety-subject1-p1-batch1-20260816
