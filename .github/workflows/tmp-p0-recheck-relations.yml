name: Temporary P0 relation recheck batch

on:
  push:
    branches:
      - work/industrial-safety-p0-recheck-20260816

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/industrial-safety-p0-recheck-20260816
          fetch-depth: 0

      - name: Apply two verified relations and content gaps
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'STOP: {label}: marker count={text.count(old)}')
              return text.replace(old, new, 1)

          def append_question(text, qid, label):
              m = re.search(r'^questions:\s*\[(.*?)\]\s*$', text, re.MULTILINE)
              if not m:
                  raise SystemExit(f'STOP: {label}: questions line not found')
              ids = [x.strip() for x in m.group(1).split(',') if x.strip()]
              if qid in ids:
                  raise SystemExit(f'STOP: {label}: {qid} already present')
              ids.append(qid)
              line = 'questions: [' + ', '.join(ids) + ']'
              return text[:m.start()] + line + text[m.end():]

          # 1) FTA expected-effect question: existing chapter already owns FTA characteristics.
          p = 'src/content/chapters/ergonomics/fta-procedure.md'
          t = read(p)
          t = append_question(t, '20190427_026', 'fta-procedure')
          old = 'FTA의 특징 — 연역적 분석, 정량적 평가 가능(발생확률 계산), 논리기호 사용으로 해석 명확, 컴퓨터 처리 가능, 단기간 훈련으로 사용 가능 · 한계 — 톱사상 선정에 따라 결과가 좌우, 복잡한 시스템은 FT 규모 급증'
          new = old + '\n\nFTA의 대표 기대효과는 **시스템 결함 진단**, **사고원인 규명의 간편화**, **사고원인 분석의 정량화**로 묶어 판별함 · 수록 기출에서는 `시간에 따른 원인 분석`을 FTA의 대표 기대효과와 거리가 먼 항목으로 출제함'
          t = replace_once(t, old, new, 'FTA expected effects concept')
          old = '| FTA 수행 절차 · 개선계획의 작성 | **개선계획의 작성** |\n'
          new = old + '| FTA 기대효과 | **시스템 결함 진단 · 사고원인 규명의 간편화 · 사고원인 분석의 정량화** |\n| FTA 기대효과와 거리가 먼 것 | **시간에 따른 원인 분석** |\n'
          t = replace_once(t, old, new, 'FTA expected effects exam points')
          write(p, t)

          # 2) Articulation Index image calculation: source image is registered in Git.
          p = 'src/content/chapters/ergonomics/articulation-index.md'
          t = read(p)
          t = append_question(t, '20210814_036', 'articulation-index')
          old = 'examComment: 잡음이 통화이해도에 미치는 영향을 추정하는 지수와, 소음환경 관련 지수 묶음에서 MAA를 제외하는 유형이 각각 확인됨'
          new = 'examComment: 잡음의 통화이해도 영향·소음환경 지수 구분형과, 그림의 대역별 log(S/N) 값에 말소리 중요도 가중치를 곱해 합산하는 명료도 지수 계산형이 확인됨'
          t = replace_once(t, old, new, 'AI examComment')
          anchor = 'AI는 말의 이해 가능성을 나타내고, SIL 계열은 잡음의 통화 방해 정도를 나타냄 · PSIL은 음성통신에 중요한 `500·1000·2000 Hz` 옥타브 대역의 소음 수준을 이용하는 지표임\n\n'
          addition = '''AI는 말의 이해 가능성을 나타내고, SIL 계열은 잡음의 통화 방해 정도를 나타냄 · PSIL은 음성통신에 중요한 `500·1000·2000 Hz` 옥타브 대역의 소음 수준을 이용하는 지표임

### 수록 그림형 명료도 지수 계산

2021년 8월 수록 기출의 그림형은 각 구간에 제시된 `log(S/N)` 값에 **말소리 중요도 가중치**를 곱한 뒤 모두 합산하는 방식으로 계산함

| 구간 | `log(S/N)` | 중요도 가중치 | 기여값 |
|---|---:|---:|---:|
| I | -0.7 | 1 | -0.7 |
| II | 0.18 | 1 | 0.18 |
| III | 0.6 | 2 | 1.2 |
| IV | 0.7 | 1 | 0.7 |

`(-0.7×1) + (0.18×1) + (0.6×2) + (0.7×1) = 1.38`이므로 이 그림의 정답은 **1.38**임 · 이 계산은 해당 기출 그림에 주어진 값과 가중치를 그대로 적용하는 판별법으로 사용하고, 현대 SII의 일반 계산 절차 전체를 이 한 식으로 대체해 해석하지 않음

'''
          t = replace_once(t, anchor, addition, 'AI image calculation section')
          old = '| AI | **명료도 지수(Articulation Index)** · 말소리 중 이해 가능한 비율을 나타내는 값 |\n'
          new = old + '| 그림형 AI 계산 | **각 구간 `log(S/N) × 말소리 중요도 가중치`의 합** · 수록 그림은 **1.38** |\n'
          t = replace_once(t, old, new, 'AI calculation exam point')
          old = '- 통화 간섭 수준을 AI와 같은 이름으로 보지 않음 · 두 지수는 관련되지만 평가 표현이 다름\n'
          new = old + '- 그림형 계산에서는 각 구간의 부호와 가중치를 그대로 반영함 · 특히 I 구간의 `-0.7`을 양수로 바꾸거나 III 구간의 가중치 `2`를 누락하지 않음\n'
          t = replace_once(t, old, new, 'AI calculation pitfall')
          write(p, t)

          audit = '''# 산업안전기사 P0 기존 챕터 재검토 13문항 — 2026-08-16

기준 `main`: `3bf2690fba9cea729d2fe16778ee4308a5b1382e`

## 결론

- 기존 챕터 최소 보강 후 관계 추가: **2건**
- 계속 보류: **11건**
- 신규 slug: **0건**

## 구현 2건

| question_id | target | 판정 |
|---|---|---|
| `20190427_026` | `fta-procedure` | FTA 기대효과 문항. 기존 챕터가 FTA 특징·정량평가까지 이미 소유하므로 기대효과 판별만 보강 후 연결 |
| `20210814_036` | `articulation-index` | 원본 이미지 자산이 Git에 등록됨. 그림의 `log(S/N)×중요도 가중치` 합산값 `1.38`을 직접 확인하고 계산형만 최소 보강 후 연결 |

`20210814_036`은 이미지에 제시된 네 구간 값 `-0.7, 0.18, 0.6, 0.7`과 가중치 `1, 1, 2, 1`을 사용하면 `1.38`이다. AI/SII 일반 이론은 주파수대별 중요도를 반영한 기여도를 합산한다는 원칙까지만 교차 확인했고, 챕터에는 이 기출 그림의 계산법을 현대 SII 전체 공식으로 일반화하지 않도록 제한 문구를 둔다.

## 계속 보류 11건

| question_id | 판정 | 이유 |
|---|---|---|
| `20180304_035` | IMAGE_REQUIRED | 직·병렬 신뢰도 시스템 도형이 필요하나 해당 ID의 source image 등록을 확인하지 못함 |
| `20190804_018` | SOURCE_HOLD | 법령 문항 본문의 괄호 원문 맥락이 복원되지 않음 |
| `20190804_061` | IMAGE_FORMULA_REQUIRED | 인체통과전류 회로도와 수치 조건 직접 대조 필요 |
| `20190804_112` | SOURCE_HOLD | 건설공사 안전관리계획서 원본/법령 범위 재검증 필요 |
| `20200606_023` | IMAGE_REQUIRED | 시스템 신뢰도 도형 필요 |
| `20200606_075` | LEGAL_STANDARD_REQUIRED | 폭발위험장소 설정·관리 기준 최신성 검증 필요 |
| `20200822_035` | IMAGE_FORMULA_REQUIRED | 펌프·병렬밸브 시스템 도형과 계산 직접 대조 필요 |
| `20200822_070` | LEGAL_HISTORICAL_HOLD | 문제 데이터 자체가 관련 규정 개정 전 문제임을 명시함 |
| `20200822_073` | LEGAL_STANDARD_REQUIRED | 누전차단기 정격감도전류·동작시간은 현행 규칙 직접 검증 필요 |
| `20210515_102` | LEGAL_SOURCE_HOLD | 산업안전보건관리비 사용명세서 보존기간의 현행/출제시점 법령 검증 필요 |
| `20220424_062` | STANDARD_REQUIRED | KS C IEC 60079-10-2 분진 폭발위험장소 구분의 표준 직접 검증 필요 |

## 범위

이번 작업은 T1이다. 기존 두 챕터의 누락 시험 포인트와 관계만 보강하고, 법령·표준·이미지 원본·신규 구조가 필요한 11건은 수정하지 않는다.
'''
          Path('docs/audits/2026-08-16-industrial-safety-p0-existing-chapter-review.md').write_text(audit, encoding='utf-8', newline='\n')

      - name: Install dependencies and validate public output
        run: |
          npm ci
          npm run build
          npm run check:seo
          npm run check:public-content

      - name: Relation, question and asset QA
        shell: python
        run: |
          import json, re, subprocess
          from collections import Counter
          from pathlib import Path

          expected = {
              'fta-procedure': ('20190427_026', 2, 2),
              'articulation-index': ('20210814_036', 2, 3),
          }
          holds = {
              '20180304_035','20190804_018','20190804_061','20190804_112','20200606_023',
              '20200606_075','20200822_035','20200822_070','20200822_073','20210515_102','20220424_062'
          }

          qs = json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          qmap = {q['id']: q for q in qs}
          if len(qs) != 1680 or len(qmap) != 1680:
              raise SystemExit('STOP: question integrity')
          for slug, (qid, sid, answer) in expected.items():
              q = qmap[qid]
              if q['subject_id'] != sid or q['answer'] != answer:
                  raise SystemExit(f'STOP: question source mismatch {qid}: subject={q["subject_id"]} answer={q["answer"]}')

          assets = json.loads(Path('src/data/question-assets/industrial-safety.json').read_text(encoding='utf-8'))
          amap = {a['id']: a for a in assets}
          if '20210814_036' not in amap:
              raise SystemExit('STOP: 20210814_036 asset registry missing')
          asset_path = Path(amap['20210814_036']['asset_path'])
          if not asset_path.is_file():
              raise SystemExit(f'STOP: image asset file missing {asset_path}')

          refs, by_slug = [], {}
          root = Path('dist/industrial-safety/written')
          for f in root.rglob('index.html'):
              rel = f.relative_to(root)
              if len(rel.parts) != 3:
                  continue
              ids = re.findall(r'data-open="(\d{8}_\d{3})"', f.read_text(encoding='utf-8', errors='ignore'))
              by_slug[rel.parts[1]] = ids
              refs.extend(ids)

          for slug, (qid, _, _) in expected.items():
              if by_slug.get(slug, []).count(qid) != 1:
                  raise SystemExit(f'STOP: relation missing/duplicate {qid} -> {slug}')
          mapped = set(refs)
          if holds & mapped:
              raise SystemExit(f'STOP: P0 hold unexpectedly mapped: {sorted(holds & mapped)}')
          counts = Counter(refs)
          actual = (len(refs), len(mapped), 1680-len(mapped), sum(v > 1 for v in counts.values()))
          if actual != (980, 970, 710, 10):
              raise SystemExit(f'STOP: relation counts={actual}, expected=(980,970,710,10)')

          expected_files = {
              'docs/audits/2026-08-16-industrial-safety-p0-existing-chapter-review.md',
              'src/content/chapters/ergonomics/articulation-index.md',
              'src/content/chapters/ergonomics/fta-procedure.md',
          }
          status = subprocess.check_output(['git','status','--porcelain'], text=True)
          actual_files = set()
          for line in status.splitlines():
              p = line[3:]
              if ' -> ' in p: p = p.split(' -> ',1)[1]
              actual_files.add(p)
          if actual_files != expected_files:
              raise SystemExit(f'STOP: scope mismatch expected={sorted(expected_files)} actual={sorted(actual_files)}')
          subprocess.run(['git','diff','--check'], check=True)
          print(f'P0 QA PASS refs={actual[0]} unique={actual[1]} unmapped={actual[2]} multi={actual[3]}')

      - name: Commit verified P0 batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audits/2026-08-16-industrial-safety-p0-existing-chapter-review.md \
            src/content/chapters/ergonomics/articulation-index.md \
            src/content/chapters/ergonomics/fta-procedure.md
          git commit -m 'feat: add verified P0 industrial safety relations'
          git push origin HEAD:work/industrial-safety-p0-recheck-20260816
