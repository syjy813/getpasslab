name: Mobile learning UX QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/layouts/ChapterLayout.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'src/components/GNB.astro'
      - 'src/styles/global.css'
      - 'scripts/*mobile-learning-ux*'
      - 'scripts/*gnb-chapter-toc*'
      - 'scripts/*gnb-toc-height*'
      - 'scripts/*mobile-toc-width*'
      - 'docs/audits/2026-10-28-mobile-toc-width/**'
      - 'docs/audits/2026-10-26-gnb-toc-height/**'
      - 'docs/audits/2026-10-26-gnb-chapter-toc/**'
      - 'scripts/read-before-global-chapter-readability.mjs'
      - 'scripts/check-global-chapter-readability.mjs'
      - 'docs/audits/2026-10-26-mobile-learning-ux/**'
      - '.github/workflows/mobile-learning-ux-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select historical snapshot verification root
        id: historical
        run: node scripts/prepare-mobile-ad-legacy-qa.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: ${{ steps.historical.outputs.root }}
      - run: npm run build
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-footer-left.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-mobile-toc-width.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-fire-image-copy.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-gnb-toc-height.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-gnb-chapter-toc.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-mobile-learning-ux.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-global-chapter-readability.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: node scripts/check-all-chapter-hierarchy.mjs
        working-directory: ${{ steps.historical.outputs.root }}
      - run: npm run check:seo && npm run check:public-content && npm run check:contrast && npm run check:deferred-question-content
        working-directory: ${{ steps.historical.outputs.root }}
      - name: Prepare temporary browser tooling
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Responsive navigation, questions and image lifecycle
        working-directory: ${{ steps.historical.outputs.root }}
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-mobile-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-mobile-learning-ux.cjs
      - name: Content-sized mobile chapter menu and ellipsis
        working-directory: ${{ steps.historical.outputs.root }}
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_OUTPUT_DIR: qa-results/mobile-toc-width
        run: node scripts/qa-mobile-toc-width.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-learning-ux-qa
          path: |
            ${{ steps.historical.outputs.root }}/qa-results/mobile-learning-ux/
            ${{ steps.historical.outputs.root }}/qa-results/mobile-toc-width/
          retention-days: 14
