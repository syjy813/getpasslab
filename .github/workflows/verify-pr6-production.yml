name: Verify PR6 production

on:
  push:
    branches:
      - agent/public-id-guard

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ac2a610d68958c7a3193c8fbf75334c310aedf87
      SITE_URL: https://getpasslab.co.kr
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-id-guard
          fetch-depth: 0

      - name: Verify Pages deployment and production pages
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          report="$RUNNER_TEMP/pr6-production-verification.md"
          work="$RUNNER_TEMP/pr6-production"
          mkdir -p "$work"

          cat > "$report" <<EOF
          ## PR #6 production verification

          - Target merge commit: \`$TARGET_SHA\`
          - Verification time (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          deploy_json="$work/deploy-runs.json"
          deploy_run=''
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=30" \
              -o "$deploy_json"

            deploy_run=$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0] // empty' "$deploy_json")
            if [[ -n "$deploy_run" ]]; then
              status=$(jq -r '.status' <<<"$deploy_run")
              if [[ "$status" == "completed" ]]; then
                break
              fi
            fi
            sleep 10
          done

          if [[ -z "$deploy_run" ]]; then
            echo '- Pages deployment: **FAIL — matching workflow run not found**' >> "$report"
            echo 'verification_result=FAIL' >> "$GITHUB_OUTPUT"
            cp "$report" "$RUNNER_TEMP/final-report.md"
            exit 1
          fi

          deploy_status=$(jq -r '.status' <<<"$deploy_run")
          deploy_conclusion=$(jq -r '.conclusion // ""' <<<"$deploy_run")
          deploy_id=$(jq -r '.id' <<<"$deploy_run")
          deploy_url=$(jq -r '.html_url' <<<"$deploy_run")
          deploy_created=$(jq -r '.created_at' <<<"$deploy_run")
          deploy_updated=$(jq -r '.updated_at' <<<"$deploy_run")

          cat >> "$report" <<EOF
          - Pages workflow run: [#$deploy_id]($deploy_url)
          - Pages workflow status: \`$deploy_status / $deploy_conclusion\`
          - Pages workflow window: \`$deploy_created → $deploy_updated\`
          EOF

          if [[ "$deploy_status" != "completed" || "$deploy_conclusion" != "success" ]]; then
            echo '- Pages deployment: **FAIL**' >> "$report"
            echo 'verification_result=FAIL' >> "$GITHUB_OUTPUT"
            cp "$report" "$RUNNER_TEMP/final-report.md"
            exit 1
          fi

          fetch_page() {
            local label="$1"
            local url="$2"
            local output="$3"
            local headers="$4"
            local code
            code=$(curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --max-time 45 \
              --dump-header "$headers" --output "$output" \
              --write-out '%{http_code}' "$url")
            printf '%s' "$code"
          }

          assert_contains() {
            local file="$1"
            local value="$2"
            local label="$3"
            if ! grep -Fq -- "$value" "$file"; then
              echo "Missing expected content [$label]: $value" >&2
              return 1
            fi
          }

          assert_not_contains() {
            local file="$1"
            local value="$2"
            local label="$3"
            if grep -Fq -- "$value" "$file"; then
              echo "Forbidden content found [$label]: $value" >&2
              return 1
            fi
          }

          smoke_fail=0

          home_code=$(fetch_page 'home' "$SITE_URL/" "$work/home.html" "$work/home.headers") || smoke_fail=1
          if [[ "$home_code" != "200" ]]; then smoke_fail=1; fi
          assert_contains "$work/home.html" 'GetPassLab' 'home title' || smoke_fail=1

          reactive_url="$SITE_URL/industrial-safety/written/chemical/reactive-dangerous-gases/"
          reactive_code=$(fetch_page 'reactive-dangerous-gases' "$reactive_url" "$work/reactive.html" "$work/reactive.headers") || smoke_fail=1
          if [[ "$reactive_code" != "200" ]]; then smoke_fail=1; fi
          assert_contains "$work/reactive.html" '2022년 4월 시험 98번' 'natural-language exam label' || smoke_fail=1
          assert_contains "$work/reactive.html" '반응 조건을 확인해 수소를 선택' 'learner-facing exam point' || smoke_fail=1
          assert_not_contains "$work/reactive.html" '20220424_098' 'internal question ID' || smoke_fail=1
          assert_not_contains "$work/reactive.html" 'PDF 원문' 'internal PDF wording' || smoke_fail=1
          assert_not_contains "$work/reactive.html" 'JSON' 'internal JSON wording' || smoke_fail=1

          vdt_url="$SITE_URL/industrial-safety/written/ergonomics/vdt-contrast/"
          vdt_code=$(fetch_page 'vdt-contrast' "$vdt_url" "$work/vdt.html" "$work/vdt.headers") || smoke_fail=1
          if [[ "$vdt_code" != "200" ]]; then smoke_fail=1; fi
          assert_contains "$work/vdt.html" '<strong>VDT 화면 대비</strong>' 'rendered strong element' || smoke_fail=1
          assert_contains "$work/vdt.html" '\rho=0.85' 'repaired LaTeX rho expression' || smoke_fail=1
          assert_not_contains "$work/vdt.html" '20200606_028' 'internal question ID' || smoke_fail=1
          assert_not_contains "$work/vdt.html" 'ho=0.85' 'damaged rho expression' || smoke_fail=1
          assert_not_contains "$work/vdt.html" '**VDT 화면 대비**' 'unrendered emphasis' || smoke_fail=1

          cause_url="$SITE_URL/industrial-safety/written/safety-management/accident-cause-classification/"
          cause_code=$(fetch_page 'accident-cause-classification' "$cause_url" "$work/cause.html" "$work/cause.headers") || smoke_fail=1
          if [[ "$cause_code" != "200" ]]; then smoke_fail=1; fi
          assert_contains "$work/cause.html" '<strong>불안전한 행동 88%, 불안전한 상태 10%, 불가항력 2%</strong>' 'rendered emphasis in exam point' || smoke_fail=1
          assert_not_contains "$work/cause.html" '**불안전한 행동 88%' 'unrendered emphasis' || smoke_fail=1

          cat >> "$report" <<EOF

          ### Runtime smoke test

          | Page | HTTP | Result |
          |---|---:|---|
          | Home | $home_code | $([[ "$home_code" == "200" ]] && echo PASS || echo FAIL) |
          | Reactive dangerous gases | $reactive_code | ID/PDF/JSON removal and learner-facing copy checked |
          | VDT contrast | $vdt_code | strong rendering and \`\\rho=0.85\` checked |
          | Accident cause classification | $cause_code | strong rendering checked |
          EOF

          if [[ "$smoke_fail" -ne 0 ]]; then
            echo '' >> "$report"
            echo '**Overall result: FAIL**' >> "$report"
            echo 'verification_result=FAIL' >> "$GITHUB_OUTPUT"
            cp "$report" "$RUNNER_TEMP/final-report.md"
            exit 1
          fi

          cat >> "$report" <<'EOF'

          **Overall result: PASS**

          Production deployment and representative runtime content were verified against the merged PR #6 changes.
          EOF

          echo 'verification_result=PASS' >> "$GITHUB_OUTPUT"
          cp "$report" "$RUNNER_TEMP/final-report.md"

      - name: Post verification evidence to PR #6
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/final-report.md" ]]; then
            cat > "$RUNNER_TEMP/final-report.md" <<EOF
          ## PR #6 production verification

          **Overall result: FAIL**

          The verification job stopped before producing the detailed report. Review this workflow run.
          EOF
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/6/comments" \
            --method POST \
            --raw-field body="$(cat "$RUNNER_TEMP/final-report.md")"

      - name: Remove one-time verification workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-pr6-production.yml
          git commit -m "chore: remove one-time production verification workflow"
          git push origin HEAD:agent/public-id-guard
