name: Verify relation structure Gate A production

on:
  push:
    branches:
      - agent/verify-gate-a-production
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: 571a4aec906a4127e99f474b3a0e57d8c239598b
    steps:
      - name: Verify GitHub Pages deployment run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['DEPLOY_SHA']
          url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=20'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'getpasslab-gate-a-verifier',
          }

          last = None
          for attempt in range(1, 21):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              runs = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('name') == 'Deploy to GitHub Pages'
              ]
              if runs:
                  last = runs[0]
                  if last.get('status') == 'completed':
                      break
              if attempt == 20:
                  raise SystemExit(f'Pages deployment did not complete: {last}')
              time.sleep(15)

          print(f"pages_run_id={last['id']}")
          print(f"pages_status={last['status']}")
          print(f"pages_conclusion={last['conclusion']}")
          print(f"pages_created_at={last['created_at']}")
          print(f"pages_updated_at={last['updated_at']}")
          if last.get('conclusion') != 'success':
              raise SystemExit('Pages deployment conclusion is not success')
          PY

      - name: Verify production relation and visibility changes
        run: |
          python - <<'PY'
          import html
          import re
          import time
          import urllib.error
          import urllib.request

          targets = {
              'swain-human-error': {
                  'url': 'https://getpasslab.co.kr/industrial-safety/written/ergonomics/swain-human-error/',
                  'present': [
                      'Swain 인간 실수 분류',
                      '2019~2021년 기출 4회 · 3개 연도',
                      '서로 다른 체계다',
                  ],
                  'absent': [
                      '2022년 4월 시험 22번',
                      '2022년 3월 시험 40번',
                      '2021년 8월 시험 21번',
                  ],
              },
              'ventricular-fibrillation-current': {
                  'url': 'https://getpasslab.co.kr/industrial-safety/written/electrical/ventricular-fibrillation-current/',
                  'present': [
                      '심실세동 전류',
                      '2018~2021년 기출 3회 · 2개 연도',
                  ],
                  'absent': [
                      '2022년 3월 시험 78번',
                      '2018년 4월 시험 65번',
                  ],
              },
              'vf-danger-energy': {
                  'url': 'https://getpasslab.co.kr/industrial-safety/written/electrical/vf-danger-energy/',
                  'present': [
                      '심실세동 위험한계 에너지',
                      '2019~2022년 기출 8회 · 4개 연도',
                      '수록 기출 8문항이 전체 14개 회차 중 8개 회차에서 확인되며',
                  ],
                  'absent': [
                      '2018년 3월 시험 80번',
                      '2018년 4월 시험 63번',
                      '2018년 8월 시험 80번',
                  ],
              },
              'grinder-rotation-speed': {
                  'url': 'https://getpasslab.co.kr/industrial-safety/written/mechanical/grinder-rotation-speed/',
                  'present': [
                      '연삭숫돌 회전속도',
                      '2019~2021년 기출 3회 · 3개 연도',
                      '평형플랜지, 방호덮개와 작업수칙은 별도 주제로 구분한다',
                  ],
                  'absent': ['연삭숙돌 회전속도'],
              },
              'five-pinch-points': {
                  'url': 'https://getpasslab.co.kr/industrial-safety/written/mechanical/five-pinch-points/',
                  'present': [
                      '기계의 5대 위험점',
                      '2021~2022년 기출 3회 · 2개 연도',
                      '연삭숫돌과 작업받침대',
                  ],
                  'absent': [],
              },
              'leakage-breaker-exception': {
                  'url': 'https://getpasslab.co.kr/industrial-safety/written/electrical/leakage-breaker-exception/',
                  'present': [
                      '누전차단기 설치 불필요 조건',
                      '2018~2022년 기출 4회 · 4개 연도',
                      '사용전압이나 설치 대상 자체를 묻는 문제와',
                  ],
                  'absent': ['2022년 4월 시험 65번'],
              },
          }

          def visible_text(source: str) -> str:
              source = re.sub(r'<!--[\s\S]*?-->', ' ', source)
              source = re.sub(r'<(?:script|style|noscript|template)\b[^>]*>[\s\S]*?</(?:script|style|noscript|template)>', ' ', source, flags=re.I)
              source = re.sub(r'<[^>]+>', ' ', source)
              return re.sub(r'\s+', ' ', html.unescape(source)).strip()

          for name, checks in targets.items():
              last_error = None
              for attempt in range(1, 13):
                  try:
                      request = urllib.request.Request(
                          checks['url'],
                          headers={
                              'User-Agent': 'Mozilla/5.0 GetPassLab Gate A verifier',
                              'Cache-Control': 'no-cache',
                          },
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          status = response.status
                          source = response.read().decode('utf-8', errors='replace')
                      text = visible_text(source)
                      missing = [value for value in checks['present'] if value not in text]
                      leaked = [value for value in checks['absent'] if value in text]
                      if status == 200 and not missing and not leaked:
                          print(f'{name}: HTTP {status} / relation and visibility PASS')
                          break
                      last_error = f'HTTP={status}, missing={missing}, leaked={leaked}'
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last_error = repr(exc)
                  if attempt == 12:
                      raise SystemExit(f'{name}: FAIL after {attempt} attempts: {last_error}')
                  time.sleep(15)
          PY
