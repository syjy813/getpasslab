## 자주 틀리는 포인트

특정 장소의 15mA 기준을 모든 전로에 적용하거나, 전압 50V·150V와 정격감도전류 15mA·30mA를 같은 수치 체계로 비교하지 않는다. 전력퓨즈는 과전류 보호장치이지 누전차단기 내부 구성요소가 아니다.

