## 핵심 개념

누전차단기는 누설전류를 검출하고 정해진 감도와 시간 안에 전로를 차단하여 감전과 전기재해를 줄이는 장치다. 기출에서는 구성요소, 동작 형식, 정격감도전류와 설치 장소별 기준을 묻는다.

## 기본 구조와 작동 원리

누전차단기의 기본 구성은 누설 상태를 검출하는 부분, 영상변류기, 동작 신호를 처리하는 부분과 전로를 끊는 차단장치로 구분할 수 있다. 전력퓨즈는 누전차단기 자체의 구성요소가 아니라 별도의 과전류 보호장치다.

정상 상태에서는 불필요하게 동작하지 않아야 하며, 누설전류가 설정 조건에 도달하면 정해진 시간 안에 차단해야 한다.

## 정격 용어와 동작 형식

- **정격감도전류**: 누전차단기가 동작하도록 정해진 누설전류 기준
- **정격전류용량**: 누전차단기가 정상적으로 통전할 수 있는 부하전류 기준
- **동작시간**: 누전을 검출한 뒤 회로를 차단하기까지의 시간
- **고속형**: 짧은 시간 안에 차단하는 형식
- **시연형**: 보호장치 간 동작 협조 등을 위해 의도적인 시간 지연을 두는 형식

감도 구분과 동작시간 구분을 같은 개념으로 보지 않는다.

## 법령·장소별 핵심 기준

누전차단기 수치는 적용 근거와 장소에 따라 달라진다.

| 적용 상황 | 핵심 기준 |
|---|---|
| 안전보건규칙상 일반 감전방지용 누전차단기 | 정격감도전류 **30mA 이하**, 작동시간 **0.03초 이내** |
| 정격전부하전류 50A 이상 기기의 오작동 방지 예외 | **200mA 이하**, **0.1초 이내** 가능 |
| 욕조·샤워시설이 있고 인체가 물에 젖은 상태로 전기를 사용하는 장소의 콘센트 | 인체감전보호용 **15mA 이하**, **0.03초 이하** 또는 정격용량 **3kVA 이하** 절연변압기 등 |
| 2022년 기출의 금속제 외함 저압 기계기구 | 당시 KEC 문항 기준 사용전압 **50V 초과** |

50V·150V·15mA·30mA는 서로 바꿔 쓸 수 있는 공통 기준이 아니다. 전압 기준인지 감도전류 기준인지, 산업안전보건기준인지 KEC의 장소별 기준인지 먼저 구분한다.

## 산업안전보건기준상 설치 대상

「산업안전보건기준에 관한 규칙」 제304조는 다음 전기기계·기구에 감전방지용 누전차단기를 설치하도록 정한다.

1. 대지전압이 **150V를 초과**하는 이동형 또는 휴대형 전기기계·기구
2. 물 등 도전성이 높은 액체가 있는 습윤장소에서 사용하는 저압용 전기기계·기구
3. 철판·철골 위 등 도전성이 높은 장소에서 사용하는 이동형 또는 휴대형 전기기계·기구
4. 임시배선 전로가 설치되는 장소에서 사용하는 이동형 또는 휴대형 전기기계·기구

이중절연 구조, 절연대 위 등 감전위험이 없는 장소, 비접지방식 전로와 같은 설치 예외는 `누전차단기 설치 불필요 조건` 챕터에서 별도로 다룬다.

## 욕실·습윤장소의 KEC 기준

욕조나 샤워시설이 있는 욕실·화장실 등 인체가 물에 젖은 상태에서 전기를 사용하는 장소에 콘센트를 시설할 때는 인체감전보호용 누전차단기 또는 절연변압기 등의 별도 보호조건을 적용한다.

욕조나 샤워시설이 없고 인체가 물에 젖은 상태로 전기를 사용하는 장소가 아니라면 이 15mA 기준을 자동으로 적용하지 않는다. 단순히 습기가 있다는 이유만으로 모든 누전차단기에 같은 수치를 적용하지 않는다.

## 기출 기준과 현행 기준

`20220424_065`는 2022년 시행 당시 KEC의 금속제 외함 저압 기계기구 시설기준을 직접 묻는 문항이므로 이 챕터 관계에 포함한다. 현행 설계·시공에는 2026년 KEC 전문과 해당 전로·기기의 조건을 다시 확인한다.

`20200926_065`와 `20180428_073`은 누전차단기 구성요소를 직접 묻는 동일 유형의 문항으로, 전력퓨즈가 구성요소가 아니라는 판별 근거를 제공한다.

