name: Gate B2 batch runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-batch:
    if: github.event_name == 'pull_request' && github.head_ref == 'automation/gate-b2-batch' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply verified Gate B2 batch
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_SHA}"
          git show "${BASE_SHA}:scripts/gate-b2-batch.py" > /tmp/gate-b2-batch.py
          BASE_SHA="${BASE_SHA}" python /tmp/gate-b2-batch.py

      - name: Validate diff and commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No batch changes to commit.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'content: implement Gate B2 law and relation batch [gate-b2-batch]'
          git push origin HEAD:${{ github.head_ref }}

  update-handover:
    if: github.event_name == 'pull_request' && github.head_ref == 'docs/gate-b2-completion' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply verified Gate B2 completion records
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_SHA}"
          git show "${BASE_SHA}:scripts/gate-b2-handover.py" > /tmp/gate-b2-handover.py
          python /tmp/gate-b2-handover.py

      - name: Validate docs diff and commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No Gate B2 completion record change to commit.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          for name in [
              'AI_HANDOVER.md',
              'docs/audits/2026-08-03-gate-b2-law-and-relations-implementation.md',
          ]:
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record Gate B2 production completion [gate-b2-docs]'
          git push origin HEAD:${{ github.head_ref }}

  verify-production:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate-b2-batch]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Gate B2 production pages
        shell: bash
        run: |
          set -euo pipefail
          construction='https://getpasslab.co.kr/industrial-safety/written/construction/construction-hazard-plan-documents/'
          leakage='https://getpasslab.co.kr/industrial-safety/written/electrical/leakage-breaker-types/'

          for attempt in $(seq 1 24); do
            construction_html="$(curl --fail --silent --show-error --location --max-time 30 "$construction")"
            leakage_html="$(curl --fail --silent --show-error --location --max-time 30 "$leakage")"

            if ! grep -Fq '현행 제출 대상 규모' <<<"$construction_html" || ! grep -Fq '법령·장소별 핵심 기준' <<<"$leakage_html"; then
              echo "Attempt $attempt: new production content not ready; waiting."
              sleep 15
              continue
            fi

            grep -Fq '착공 전날까지' <<<"$construction_html"
            grep -Fq '6개월 이내마다' <<<"$construction_html"
            ! grep -Fq '건설공사의 유해ㆍ위험방지계획서 제출 대상 중' <<<"$construction_html"
            ! grep -Fq '감전재해의 직접적인 요인으로 가장 거리가 먼 것은?' <<<"$construction_html"

            grep -Fq '누전차단기의 구성요소가 아닌 것은?' <<<"$leakage_html"
            grep -Fq '사용전압이 몇 V를 초과할 때' <<<"$leakage_html"
            grep -Fq '30mA 이하' <<<"$leakage_html"
            grep -Fq '15mA 이하' <<<"$leakage_html"

            echo "Gate B2 production verification passed on attempt $attempt."
            exit 0
          done

          echo 'Gate B2 production content did not pass within the retry window.' >&2
          exit 1
