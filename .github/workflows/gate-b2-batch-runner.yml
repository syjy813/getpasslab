name: Gate B2 batch runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-batch:
    if: github.event_name == 'pull_request' && github.head_ref == 'automation/gate-b2-batch' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply verified Gate B2 batch
        shell: python
        run: |
          import json
          from copy import deepcopy
          from pathlib import Path

          questions_path = Path('src/data/questions.json')
          page_path = Path('src/pages/industrial-safety/written/[subject]/[slug].astro')
          construction_path = Path('src/content/chapters/construction/construction-hazard-plan-documents.md')
          leakage_path = Path('src/content/chapters/electrical/leakage-breaker-types.md')
          q119_audit_path = Path('docs/audits/2026-08-03-question-20190804-119-source-mismatch.md')
          gate_audit_path = Path('docs/audits/2026-08-03-gate-b2-law-and-relations-implementation.md')
          trigger_path = Path('.gate-b2-trigger')

          questions = json.loads(questions_path.read_text(encoding='utf-8'))
          if len(questions) != 1680:
              raise RuntimeError(f'Expected 1680 questions, found {len(questions)}')

          ids = [q['id'] for q in questions]
          if len(ids) != len(set(ids)):
              raise RuntimeError('Duplicate question IDs detected before update')

          by_id = {q['id']: q for q in questions}
          required_ids = {
              '20190804_118', '20190804_119', '20190804_120',
              '20220424_065', '20200926_065', '20180428_073',
          }
          missing = sorted(required_ids - set(by_id))
          if missing:
              raise RuntimeError(f'Missing required question IDs: {missing}')

          before_118 = deepcopy(by_id['20190804_118'])
          before_120 = deepcopy(by_id['20190804_120'])
          target = by_id['20190804_119']

          expected_identity = {
              'id': '20190804_119',
              'subject_id': 6,
              'date': '2019-08-04',
              'label': '2019년 8월 시행',
              'number': 119,
          }
          for key, value in expected_identity.items():
              if target.get(key) != value:
                  raise RuntimeError(f'Unexpected 20190804_119 {key}: {target.get(key)!r}')

          restored = {
              'body': '감전재해의 직접적인 요인으로 가장 거리가 먼 것은?',
              'choices': ['통전전압의 크기', '통전전류의 크기', '통전시간', '통전경로'],
              'answer': 1,
              'review': '',
          }
          if not all(target.get(key) == value for key, value in restored.items()):
              if '유해' not in str(target.get('body', '')) or target.get('answer') != 1:
                  raise RuntimeError('20190804_119 no longer matches the audited corrupted state')
              target.update(restored)

          if by_id['20190804_118'] != before_118 or by_id['20190804_120'] != before_120:
              raise RuntimeError('Adjacent question records changed unexpectedly')

          questions_path.write_text(
              json.dumps(questions, ensure_ascii=False, indent=1) + '\n',
              encoding='utf-8',
          )

          page = page_path.read_text(encoding='utf-8')
          filter_snippet = "  if (question.id === '20190804_119') {\n    exclusionReasons.push('source answer verification pending');\n  }\n"
          if filter_snippet in page:
              page = page.replace(filter_snippet, '', 1)
          elif 'source answer verification pending' in page or "question.id === '20190804_119'" in page:
              raise RuntimeError('Temporary 20190804_119 filter changed shape')
          page_path.write_text(page, encoding='utf-8')

          expected_construction_questions = [
              '20220424_103', '20220424_107', '20220305_101', '20210814_108',
              '20200606_101', '20200822_119', '20200926_119', '20180428_102',
              '20180819_110', '20190303_106', '20190427_107', '20210307_118',
              '20210515_116',
          ]
          construction_current = construction_path.read_text(encoding='utf-8')
          if 'slug: construction-hazard-plan-documents' not in construction_current:
              raise RuntimeError('Construction chapter slug mismatch')
          if '20190804_119' in construction_current.split('---', 2)[1]:
              raise RuntimeError('Corrupted 20190804_119 relation reappeared')
          for qid in expected_construction_questions:
              if qid not in construction_current.split('---', 2)[1]:
                  raise RuntimeError(f'Missing expected construction relation: {qid}')

          construction_content = '''---
title: 건설공사 유해·위험방지계획서 제출 기준
slug: construction-hazard-plan-documents
subject_id: 6
group: 건설 법령·기준
tags: [개념, 법령]
summary: 제출 대상 규모·제출 시기·확인 주기·첨부서류를 현행 기준과 기출 시점으로 구분
questions: [20220424_103, 20220424_107, 20220305_101, 20210814_108, 20200606_101, 20200822_119, 20200926_119, 20180428_102, 20180819_110, 20190303_106, 20190427_107, 20210307_118, 20210515_116]
order: 1
priority: 1차
status: 완료
---

## 핵심 개념

건설공사 유해·위험방지계획서는 법령에서 정한 규모의 건설공사를 착공하려는 사업주가 공사의 유해·위험요인과 예방조치를 미리 정리하여 제출하고 심사받는 제도다. 기출에서는 제출 대상 규모, 제출 시기, 공사 중 확인과 첨부서류를 서로 다른 질문 축으로 묻는다.

## 현행 제출 대상 규모

2026년 8월 3일 확인한 「산업안전보건법 시행령」 제42조제3항의 건설공사 기준은 다음과 같다.

| 공사 유형 | 제출 대상 기준 |
|---|---|
| 건축물 또는 인공구조물 | 지상높이 **31m 이상** |
| 일반 건축물 | 연면적 **30,000㎡ 이상** |
| 법령이 열거한 특정 시설 | 연면적 **5,000㎡ 이상** |
| 냉동·냉장 창고시설의 설비공사 및 단열공사 | 연면적 **5,000㎡ 이상** |
| 다리의 건설·개조·해체공사 | 최대 지간길이 **50m 이상** |
| 터널공사 | 규모와 관계없이 대상 |
| 법령이 열거한 댐 공사 | 다목적댐·발전용댐·지방상수도 전용댐 또는 저수용량 **2,000만 톤 이상** 용수전용댐 |
| 굴착공사 | 깊이 **10m 이상** |

연면적 5,000㎡ 기준이 적용되는 특정 시설에는 문화 및 집회시설 일부, 판매시설, 운수시설 일부, 종교시설, 종합병원, 관광숙박시설, 지하도상가와 냉동·냉장 창고시설이 포함된다. 선택지에서는 시설 종류의 포함·제외 조건까지 함께 확인한다.

## 제출 시기

건설공사 유해·위험방지계획서는 대상 시설물 또는 구조물 공사의 **착공 전날까지** 공단에 2부를 제출한다.

이때 대지 정리와 가설사무소 설치 등 공사 준비기간은 법령상 착공으로 보지 않는다. 따라서 문제에서 단순한 현장 준비와 대상 구조물 공사의 실제 시작을 구분해야 한다.

## 공사 중 확인

계획서를 제출한 사업주는 건설공사 중 **6개월 이내마다** 다음 사항에 관하여 공단의 확인을 받아야 한다.

1. 계획서 내용과 실제 공사 내용의 부합 여부
2. 계획서 변경 내용의 적정성
3. 추가적인 유해·위험요인의 존재 여부

제출·심사 단계와 공사 중 이행 확인 단계를 혼동하지 않는다.

## 계획서와 첨부서류

건설공사 계획서에는 공사의 개요와 공정, 주변 현황, 건설물·기계·설비의 배치, 안전보건관리 조직과 산업안전보건관리비 사용계획, 비상연락·대피방법 및 공사 종류별 재해예방계획 등이 포함된다.

시행규칙은 별지 서식과 별표의 서류를 첨부하도록 정하고 있으므로, 과거 기출의 문구와 현행 서식 명칭이 다를 수 있다. 서류의 개수만 외우기보다 공사 개요·배치·공정·조직·비상대응·공종별 위험대책이라는 기능으로 구분한다.

## 기출 기준과 현행 기준

2018~2022년 연결 기출의 주요 규모 수치는 현재 기준과 대체로 일치하지만, 2020년 전부개정 전후로 법률·시행령·시행규칙의 조문 체계가 달라졌다. 기출문제는 시행 당시 법령으로 판단하고 실제 업무에는 확인일 기준 현행 원문을 적용한다.

잘못 저장됐던 `20190804_119`는 원본 PDF 대조 결과 감전재해 문항으로 확인되어 이 챕터 관계에서 제거된 상태를 유지한다.

## 시험 포인트

- 건축물 높이 **31m**, 일반 건축물 **30,000㎡**, 특정 시설 **5,000㎡** 구분
- 교량은 전체 길이가 아니라 **최대 지간길이 50m 이상**인지 확인
- 냉동·냉장 창고시설 설비·단열공사는 **5,000㎡ 이상**인지 확인
- 제출은 **착공 전날까지**, 공사 중 확인은 **6개월 이내마다**로 분리
- 터널·댐·굴착공사의 조건과 부정형 선택지 확인

## 자주 틀리는 포인트

높이 21m, 교량 지간 40m, 굴착 깊이 5m처럼 다른 기준이나 오답 숫자를 제출 대상 기준과 섞지 않는다. 또한 제조업 등 유해·위험방지계획서의 작업 시작 15일 전 기준을 건설공사에 적용하지 않는다.

## 근거와 기준

- 「산업안전보건법」 제42조
- 「산업안전보건법 시행령」 제42조제3항
- 「산업안전보건법 시행규칙」 제42조제3항 및 제46조
- 기준 확인일: 2026-08-03
'''
          construction_path.write_text(construction_content, encoding='utf-8')

          candidate_ids = ['20220424_065', '20200926_065', '20180428_073']
          relation_hits = {qid: [] for qid in candidate_ids}
          for chapter in Path('src/content/chapters').rglob('*.md'):
