              '20180304_065', '20190303_072', '20190303_076', '20190427_068',
          ]
          for qid in expected_existing:
              if qid not in leakage_current.split('---', 2)[1]:
                  raise RuntimeError(f'Missing expected leakage relation: {qid}')

