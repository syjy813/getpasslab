name: Mobile ad swap verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/layouts/BaseLayout.astro'
      - 'src/layouts/ChapterLayout.astro'
      - 'src/pages/**/index.astro'
      - 'src/styles/global.css'
      - 'scripts/check-mobile-ad-swap.mjs'
      - 'scripts/qa-mobile-ad-swap.cjs'
      - '.github/workflows/mobile-ad-swap-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Check every published advertisement placement
        run: node scripts/check-mobile-ad-swap.mjs
      - name: Validate SEO and published content
        run: npm run check:seo && npm run check:public-content
      - name: Install browser for responsive QA
        run: |
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser check across six widths and production SDK stub
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: http://127.0.0.1:4321
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/getpasslab-mobile-ad-swap-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$QA_BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$QA_BASE_URL/" > /dev/null
          node scripts/qa-mobile-ad-swap.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ad-swap-qa
          path: qa-results/mobile-ad-swap/
          retention-days: 14