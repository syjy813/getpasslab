name: Apply batch1 production gate documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/record-batch1-production-gate' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/record-batch1-production-gate
          fetch-depth: 0

      - name: Apply verified gate documentation
        run: python3 scripts/apply-batch1-production-gate.py

      - name: Validate documentation
        run: |
          git diff --check
          grep -Fq '시험 포인트 첫 개선 배치·production 검증 게이트 완료' AI_HANDOVER.md
          grep -Fq '30706599852' docs/audits/2026-08-02-exam-content-batch1-production-verification.md
          grep -Fq '7898e84ed78d318fec1886daaad00bb0ef67815f' docs/audits/2026-08-02-exam-content-batch1-production-verification.md

      - name: Remove one-time verification files
        run: |
          rm -f .github/workflows/verify-batch1-production.yml
          rm -f .github/workflows/verify-batch1-production-pr.yml
          rm -f .github/workflows/apply-batch1-production-gate.yml
          rm -f scripts/verify-batch1-production.py
          rm -f scripts/apply-batch1-production-gate.py
          rm -f docs/audits/batch1-production-trigger.tmp

      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record first exam insight production gate"
          git push origin HEAD:agent/record-batch1-production-gate
