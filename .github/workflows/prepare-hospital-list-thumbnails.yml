name: Prepare approved hospital thumbnails
on:
  push:
    branches: [feat/hobyeongbaekma-hospital-list-thumbnails]
    paths: [.github/workflows/prepare-hospital-list-thumbnails.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate original PNGs and encode reviewed WebP blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import sharp from 'sharp';
          const sha256 = b => createHash('sha256').update(b).digest('hex');
          const gitBlob = b => createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');
          const inputs = [
           {id:'hobyeongbaekma-hospital-despair',file:'병원 시설 업무 체크리스트.png',size:1954853,blob:'d95b84ad720a2110f971a5d7c7f24a52da83a701'},
           {id:'hobyeongbaekma-hospital-hope',file:'병원 HVAC 정밀 진단 디오라마.png',size:1959370,blob:'4bcabe6a1e812287a031e209553320bb66ca57e0'},
           {id:'hobyeongbaekma-hospital-large-university',file:'가까이 담은 대학병원 정문.png',size:2534283,blob:'4ac66fb5e3e3f216abe1e364256a806c155e6323'}
          ];
          const results=[];
          for(const row of inputs){
           const png=fs.readFileSync('facility-assets/hobyeongbaekma-list-thumbnails/'+row.file);
           assert.equal(png.length,row.size);assert.equal(gitBlob(png),row.blob);
           const meta=await sharp(png).metadata();
           assert.deepEqual([meta.format,meta.width,meta.height],['png',1448,1086]);
           let quality=84,webp;
           do {webp=await sharp(png).webp({quality,effort:6}).toBuffer();if(webp.length<200000)break;quality-=4;}while(quality>=60);
           assert(webp.length<200000,'optimized image budget');
           const encoded=await sharp(webp).metadata();
           assert.deepEqual([encoded.format,encoded.width,encoded.height],['webp',1448,1086]);
           const res=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs',{
            method:'POST',
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({encoding:'base64',content:webp.toString('base64')})
           });
           if(!res.ok)throw new Error('Create optimized blob failed: '+res.status+' '+await res.text());
           const blob=await res.json();
           assert.equal(blob.sha,gitBlob(webp));
           results.push({...row,png:sha256(png),webp:sha256(webp),webpBlob:blob.sha,webpBytes:webp.length,width:1448,height:1086,quality});
          }
          console.log('HOSPITAL_THUMBNAILS_RESULT='+JSON.stringify(results));
          NODE
