name: Temporary subject1 P1 batch2 validation

on:
  push:
    branches:
      - work/industrial-safety-subject1-p1-batch2-20260817

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate canonical questions and relation integrity
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from collections import Counter

          expected = {
            '20200606_002': ('group-discussion-methods', 1),
            '20210307_006': ('group-discussion-methods', 2),
            '20190303_018': ('severity-rate', 2),
          }
          data = json.loads(Path('src/data/questions/industrial-safety.json').read_text(encoding='utf-8'))
          by_id = {q['id']: q for q in data}
          assert len(data) == len(by_id) == 1680
          assert '전문가' in by_id['20200606_002']['body'] and '심포지움' in ' '.join(by_id['20200606_002']['choices'])
          assert '브레인스토밍' in by_id['20210307_006']['body']
          assert '제12급' in by_id['20190303_018']['body']
          for qid, (_, answer) in expected.items():
              assert by_id[qid]['subject_id'] == 1, qid
              assert by_id[qid]['answer'] == answer, (qid, by_id[qid]['answer'], answer)

          refs, owners = [], {}
          for folder in ['safety-management','ergonomics','mechanical','electrical','chemical','construction']:
              for p in Path('src/content/chapters', folder).glob('*.md'):
                  text = p.read_text(encoding='utf-8')
                  sid_m = re.search(r'^subject_id:\s*(\d+)\s*$', text, re.M)
                  slug_m = re.search(r'^slug:\s*([^\n]+)$', text, re.M)
                  q_m = re.search(r'^questions:\s*\[(.*?)\]\s*$', text, re.M)
                  if not (sid_m and slug_m and q_m):
                      continue
                  sid = int(sid_m.group(1))
                  slug = slug_m.group(1).strip().strip('"\'')
                  qids = [x.strip() for x in q_m.group(1).split(',') if x.strip()]
                  assert len(qids) == len(set(qids)), slug
                  for qid in qids:
                      assert qid in by_id, (slug, qid)
                      assert by_id[qid]['subject_id'] == sid, (slug, qid)
                      refs.append(qid)
                      owners.setdefault(qid, []).append(slug)

          for qid, (slug, _) in expected.items():
              assert owners.get(qid) == [slug], (qid, owners.get(qid))
          counts = Counter(refs)
          assert len(refs) == 998, len(refs)
          assert len(counts) == 988, len(counts)
          assert 1680 - len(counts) == 692
          assert sum(v > 1 for v in counts.values()) == 10
          print('RELATION_QA_PASS refs=998 mapped=988 unmapped=692 multi=10')

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: SEO validation
        run: npm run check:seo
      - name: Public content validation
        run: npm run check:public-content

      - name: Validate final branch scope
        run: |
          git diff --check origin/main
          python - <<'PY'
          import subprocess
          expected = {
            '.github/workflows/tmp-subject1-p1-batch2-candidates.yml',
            'docs/audits/2026-08-17-industrial-safety-subject1-p1-batch2.md',
            'src/content/chapters/safety-management/group-discussion-methods.md',
            'src/content/chapters/safety-management/severity-rate.md',
          }
          tracked = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit(f'Unexpected scope: expected={sorted(expected)} actual={sorted(actual)}')
          print('SCOPE_PASS', sorted(actual))
          PY
