name: Fire production publication QA
on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare browser
        timeout-minutes: 5
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' -o "$HOME/.local/share/fonts/NotoSansKR.ttf"
          echo '194018e6b2b293a7964f037b25c0249ce1418bc9ab3c971060a03aa57861e252  '"$HOME/.local/share/fonts/NotoSansKR.ttf" | sha256sum -c -
          fc-cache -f "$HOME/.local/share/fonts"
          npm install --prefix /tmp/getpasslab-browser-tools --no-package-lock playwright@1.62.1
          /tmp/getpasslab-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual production chapter and 50-question mock exams
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: https://getpasslab.co.kr
          QA_COMMIT: ${{ github.event.workflow_run.head_sha }}
          QA_OUTPUT_DIR: qa-results/fire-production
        run: node scripts/qa-fire-publication.cjs
      - name: Full-panel lessons on the actual production site
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: https://getpasslab.co.kr
          QA_OUTPUT_DIR: qa-results/fire-production/full-panels
        run: node scripts/qa-fire-full-panels.cjs
      - name: Five priority chapters on the actual production site
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: https://getpasslab.co.kr
          QA_OUTPUT_DIR: qa-results/fire-production/priority-chapters
        run: node scripts/qa-fire-priority-chapters.cjs
      - name: Chapter menu width on the actual production site
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: https://getpasslab.co.kr
          QA_OUTPUT_DIR: qa-results/fire-production/mobile-toc-width
        run: node scripts/qa-mobile-toc-width.cjs
      - name: Phase-two practice illustrations on the actual production site
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: https://getpasslab.co.kr
          QA_OUTPUT_DIR: qa-results/fire-production/phase2
        run: node scripts/qa-fire-practice-phase2.cjs
      - name: Original 22-unit plan on the actual production site
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/getpasslab-browser-tools/node_modules/playwright
          QA_BASE_URL: https://getpasslab.co.kr
          QA_OUTPUT_DIR: qa-results/fire-production/original-plan
        run: node scripts/qa-fire-original-plan.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fire-production-qa
          path: qa-results/fire-production/
          retention-days: 14
