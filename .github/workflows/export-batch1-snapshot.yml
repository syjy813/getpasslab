name: Apply batch1 relation fixes

on:
  push:
    branches:
      - 'agent/exam-content-batch-1'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/exam-content-batch-1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconcile confirmed relation mismatches
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          CHAPTER_ROOT = Path('src/content/chapters')
          QUESTIONS_PATH = Path('src/data/questions.json')
          REPORT_PATH = Path('docs/audits/2026-08-01-exam-content-batch1-relations.md')

          SOURCE_BY_ID = {
              '20180819_004': 'serious-accident-criteria',
              '20210814_004': 'safety-signs',
              '20220424_023': 'msd-risk-factors',
              '20220424_038': 'msd-risk-factors',
              '20220305_089': 'fire-classification',
              '20220305_099': 'fire-classification',
              '20220305_091': 'combustion-range-risk',
              '20220424_096': 'flash-vs-ignition-point',
          }

          EXPLICIT_TARGET = {
              '20210814_004': 'safety-management-organization',
              '20220424_023': 'murrell-rest-formula',
              '20220424_038': 'thermal-conditions-wbgt',
              '20220305_099': 'bleve',
              '20220305_091': 'complete-combustion-cst',
          }

          SOURCE_EXAM_COMMENTS = {
              'serious-accident-criteria': '중대재해의 인원·요양기간 기준과 발생 사실 보고 시기(지체 없이)를 구분하는 유형이 확인된다.',
              'safety-signs': '표지 유형·색채 의미·기본 모형을 적용 상황과 함께 구분하는 문제가 반복된다.',
              'msd-risk-factors': '부담작업의 반복·자세·힘·진동 조건과 OWAS 평가요소를 구분하는 유형이 확인된다.',
              'fire-classification': 'A·B·C·D급의 대상 물질과 전기·금속 화재 분류를 연결하는 유형이 중심이다.',
              'combustion-range-risk': '연소하한·상한·범위 폭과 혼합가스 조성을 비교하거나 계산하는 유형이 중심이다.',
              'flash-vs-ignition-point': '점화원 유무와 물질별 인화점 비교를 통해 인화점·발화점을 구분하는 유형이 확인된다.',
          }

          EXPECTED_KEYWORDS = {
              '20180819_004': ('정기', '교육'),
              '20210814_004': ('안전관리', '조직'),
              '20220424_023': ('휴식',),
              '20220424_038': ('WBGT',),
              '20220305_089': ('시안화수소', '우레탄'),
              '20220305_099': ('BLEVE',),
              '20220305_091': ('완전연소',),
              '20220424_096': ('발화에너지',),
          }

          FRONT_RE = re.compile(r'\A---\n(?P<meta>[\s\S]*?)\n---\n(?P<body>[\s\S]*)\Z')
          QUESTION_LINE_RE = re.compile(r'^questions:\s*\[(.*?)\]\s*$', re.MULTILINE)
          STATUS_RE = re.compile(r'^status:\s*(.+?)\s*$', re.MULTILINE)
          SLUG_RE = re.compile(r'^slug:\s*([^\n]+?)\s*$', re.MULTILINE)
          SUBJECT_RE = re.compile(r'^subject_id:\s*(\d+)\s*$', re.MULTILINE)
          TITLE_RE = re.compile(r'^title:\s*(.+?)\s*$', re.MULTILINE)
          EXAM_RE = re.compile(r'^examComment:\s*(.*?)\s*$', re.MULTILINE)

          def split_source(text: str, path: Path):
              normalized = text.replace('\r\n', '\n')
              match = FRONT_RE.match(normalized)
              if not match:
                  raise RuntimeError(f'frontmatter parse failure: {path}')
              return match.group('meta'), match.group('body')

          def parse_questions(meta: str) -> list[str]:
              match = QUESTION_LINE_RE.search(meta)
              if not match:
                  raise RuntimeError('questions line missing')
              raw = match.group(1).strip()
              if not raw:
                  return []
              return [item.strip().strip("'\"") for item in raw.split(',') if item.strip()]

          def replace_questions(meta: str, values: list[str]) -> str:
              if len(values) != len(set(values)):
                  raise RuntimeError(f'duplicate relation in chapter: {values}')
              return QUESTION_LINE_RE.sub('questions: [' + ', '.join(values) + ']', meta, count=1)

          def set_exam_comment(meta: str, value: str) -> str:
              if EXAM_RE.search(meta):
                  return EXAM_RE.sub(f'examComment: {value}', meta, count=1)
              return meta.rstrip() + f'\nexamComment: {value}'

          def meta_value(pattern: re.Pattern[str], meta: str, path: Path) -> str:
              match = pattern.search(meta)
              if not match:
                  raise RuntimeError(f'metadata missing: {path} / {pattern.pattern}')
              return match.group(1).strip().strip("'\"")

          questions_raw = json.loads(QUESTIONS_PATH.read_text(encoding='utf-8'))
          question_rows = questions_raw if isinstance(questions_raw, list) else questions_raw['questions']
          questions_by_id = {row['id']: row for row in question_rows}

          chapters: dict[str, dict[str, object]] = {}
          path_by_slug: dict[str, Path] = {}
          before_frozen: dict[str, tuple[str, str, str]] = {}

          for path in sorted(CHAPTER_ROOT.rglob('*.md')):
              text = path.read_text(encoding='utf-8')
              meta, body = split_source(text, path)
              slug = meta_value(SLUG_RE, meta, path)
              subject_id = meta_value(SUBJECT_RE, meta, path)
              title = meta_value(TITLE_RE, meta, path)
              status = meta_value(STATUS_RE, meta, path)
              values = parse_questions(meta)
              chapters[slug] = {
                  'path': path,
                  'text': text.replace('\r\n', '\n'),
                  'meta': meta,
                  'body': body,
                  'title': title,
                  'status': status,
                  'subject_id': int(subject_id),
                  'questions': values,
              }
              path_by_slug[slug] = path
              before_frozen[slug] = (slug, subject_id, status)

          mapping_before: defaultdict[str, list[str]] = defaultdict(list)
          for slug, item in chapters.items():
              for question_id in item['questions']:
                  mapping_before[question_id].append(slug)

          def semantically_matches(slug: str, question_id: str) -> bool:
              item = chapters[slug]
              haystack = f"{item['title']}\n{item['meta']}\n{item['body']}".lower()
              words = EXPECTED_KEYWORDS[question_id]
              return all(word.lower() in haystack for word in words) or any(word.lower() in haystack for word in words)

          def resolve_target(question_id: str, source_slug: str) -> tuple[str | None, str]:
              explicit = EXPLICIT_TARGET.get(question_id)
              if explicit:
                  if explicit not in chapters:
                      raise RuntimeError(f'explicit target missing: {question_id} -> {explicit}')
                  if chapters[explicit]['status'] != '완료':
                      raise RuntimeError(f'explicit target is not completed: {question_id} -> {explicit}')
                  if not semantically_matches(explicit, question_id):
                      raise RuntimeError(f'explicit target keyword check failed: {question_id} -> {explicit}')
                  return explicit, 'explicit-target'

              existing_candidates = [
                  slug for slug in mapping_before.get(question_id, [])
                  if slug != source_slug and chapters[slug]['status'] == '완료' and semantically_matches(slug, question_id)
              ]
              if len(existing_candidates) == 1:
                  return existing_candidates[0], 'existing-semantic-target'
              if len(existing_candidates) > 1:
                  raise RuntimeError(f'ambiguous existing targets: {question_id} -> {existing_candidates}')

              completed_candidates = [
                  slug for slug, item in chapters.items()
                  if slug != source_slug and item['status'] == '완료' and semantically_matches(slug, question_id)
              ]
              if len(completed_candidates) == 1:
                  return completed_candidates[0], 'discovered-semantic-target'
              return None, 'unmapped-no-exact-target'

          changes: dict[str, dict[str, object]] = {}
          decisions: list[dict[str, object]] = []

          for question_id, source_slug in SOURCE_BY_ID.items():
              if question_id not in questions_by_id:
                  raise RuntimeError(f'question missing from DB: {question_id}')
              if source_slug not in chapters:
                  raise RuntimeError(f'source chapter missing: {source_slug}')
              source = chapters[source_slug]
              if question_id not in source['questions']:
                  raise RuntimeError(f'confirmed mismatch no longer present: {source_slug} / {question_id}')

              target_slug, reason = resolve_target(question_id, source_slug)
              source['questions'].remove(question_id)

              target_added = False
              if target_slug:
                  target = chapters[target_slug]
                  if target['subject_id'] != questions_by_id[question_id]['subject_id']:
                      raise RuntimeError(f'subject mismatch target: {question_id} -> {target_slug}')
                  if question_id not in target['questions']:
                      target['questions'].append(question_id)
                      target_added = True

              decisions.append({
                  'question_id': question_id,
                  'source': source_slug,
                  'target': target_slug,
                  'reason': reason,
                  'target_added': target_added,
                  'question': questions_by_id[question_id]['body'],
              })

          for slug, comment in SOURCE_EXAM_COMMENTS.items():
              item = chapters[slug]
              item['meta'] = set_exam_comment(item['meta'], comment)

          msd = chapters['msd-risk-factors']
          old_msd = (
              '2022년 4월 시험 32번은 OWAS의 평가요소를 묻는 표·자세 판독형 문제다. '
              '2022년 4월 시험 23번과 2022년 4월 시험 38번은 작업 자세와 부담작업 조건을 함께 비교해 주된 위험요인을 판단한다.'
          )
          new_msd = '2022년 4월 시험 32번은 OWAS의 평가요소를 묻는 표·자세 판독형 문제다.'
          if old_msd not in msd['body']:
              raise RuntimeError('msd-risk-factors correction anchor missing')
          msd['body'] = msd['body'].replace(old_msd, new_msd, 1)

          changed_slugs: list[str] = []
          for slug, item in chapters.items():
              new_meta = replace_questions(item['meta'], item['questions'])
              new_text = f"---\n{new_meta}\n---\n{item['body']}"
              if new_text != item['text']:
                  item['path'].write_text(new_text, encoding='utf-8', newline='\n')
                  changed_slugs.append(slug)

          mapping_after: defaultdict[str, list[str]] = defaultdict(list)
          relation_count_after = 0
          for path in sorted(CHAPTER_ROOT.rglob('*.md')):
              text = path.read_text(encoding='utf-8')
              meta, _ = split_source(text, path)
              slug = meta_value(SLUG_RE, meta, path)
              subject_id = meta_value(SUBJECT_RE, meta, path)
              status = meta_value(STATUS_RE, meta, path)
              if before_frozen[slug] != (slug, subject_id, status):
                  raise RuntimeError(f'frozen metadata changed: {slug}')
              values = parse_questions(meta)
              if len(values) != len(set(values)):
                  raise RuntimeError(f'duplicate relation after change: {slug}')
              for question_id in values:
                  if question_id not in questions_by_id:
                      raise RuntimeError(f'missing question relation after change: {slug} / {question_id}')
                  if questions_by_id[question_id]['subject_id'] != int(subject_id):
                      raise RuntimeError(f'subject relation mismatch after change: {slug} / {question_id}')
                  mapping_after[question_id].append(slug)
                  relation_count_after += 1

          for decision in decisions:
              question_id = decision['question_id']
              source_slug = decision['source']
              target_slug = decision['target']
              if source_slug in mapping_after.get(question_id, []):
                  raise RuntimeError(f'wrong relation remains: {source_slug} / {question_id}')
              if target_slug and target_slug not in mapping_after.get(question_id, []):
                  raise RuntimeError(f'target relation missing: {target_slug} / {question_id}')

          relation_count_before = sum(len(item['questions']) for item in chapters.values()) + sum(
              1 for decision in decisions if decision['question_id'] not in chapters[decision['source']]['questions']
          )
          unmapped = [item for item in decisions if item['target'] is None]

          REPORT_PATH.parent.mkdir(parents=True, exist_ok=True)
          lines = [
              '# 시험 포인트 첫 개선 배치 — 관계 무결성 단계',
              '',
              '- 작업일: 2026-08-01',
              '- 대상: 확정 관계 불일치 8건 / 6개 공개 챕터',
              '- 결과: 관계 정리 및 사용자용 출제 경향 보정',
              '',
              '## 관계 처리 결과',
              '',
              '| 문항 | 기존 오연결 | 처리 대상 | 판정 |',
              '|---|---|---|---|',
          ]
          for item in decisions:
              target = item['target'] or '미매핑 유지'
              action = item['reason'] + (' / 신규 추가' if item['target_added'] else '')
              lines.append(f"| `{item['question_id']}` | `{item['source']}` | `{target}` | {action} |")

          lines.extend([
              '',
              '## 미매핑 유지 사유',
              '',
          ])
          if unmapped:
              for item in unmapped:
                  lines.append(
                      f"- `{item['question_id']}`: 승인 범위의 기존 완료 챕터에서 의미가 정확히 일치하는 단일 대상을 찾지 못해 관계를 임의 생성하지 않음. 문항: {item['question']}"
                  )
          else:
              lines.append('- 없음.')

          lines.extend([
              '',
              '## 검증 기준',
              '',
              '- 8개 문항이 기존 오연결 챕터에서 모두 제거됨.',
              '- 명확한 기존 완료 챕터가 있는 경우에만 관계를 유지·추가함.',
              '- 대상 챕터와 문항의 `subject_id` 일치 확인.',
              '- 존재하지 않는 `question_id`, 챕터 내부 중복 관계, 동결 메타데이터 변경 없음.',
              '- `msd-risk-factors`에서 잘못 연결된 휴식시간·WBGT 문항 설명 제거.',
              '- 6개 원본 챕터의 `examComment`를 관계 정리 후 의미에 맞게 보정.',
              '',
              '## 변경 챕터',
              '',
          ])
          for slug in sorted(changed_slugs):
              lines.append(f'- `{slug}`')
          lines.extend([
              '',
              '## 다음 단계',
              '',
              '- 관계 변경 결과를 기준으로 첫 배치 16개 챕터의 빈도 수치를 다시 집계한다.',
              '- 빈도 표현 5개를 근사 표현 없이 교정한다.',
              '- 법령·편집 고위험 5개는 공식 출처 검증 후 별도 커밋으로 처리한다.',
          ])
          REPORT_PATH.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          print(f'[batch1-relations] decisions={len(decisions)} changed_chapters={len(changed_slugs)} unmapped={len(unmapped)} relations_after={relation_count_after}')
          for item in decisions:
              print(f"[batch1-relations] {item['question_id']}: {item['source']} -> {item['target'] or 'UNMAPPED'} ({item['reason']})")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate SEO output
        run: npm run check:seo

      - name: Validate public content
        run: npm run check:public-content

      - name: Validate diff formatting
        run: git diff --check

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-batch1-snapshot.yml
          git add src/content/chapters docs/audits/2026-08-01-exam-content-batch1-relations.md
          git commit -m "fix: reconcile first exam insight relations"
          git push origin HEAD:agent/exam-content-batch-1
