name: Export batch1 audit snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package repository snapshot
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/batch1-snapshot.tar.gz .

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: batch1-repository-snapshot
          path: /tmp/batch1-snapshot.tar.gz
          retention-days: 1
