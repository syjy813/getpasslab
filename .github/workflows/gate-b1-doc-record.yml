''', encoding='utf-8')

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_HANDOVER.md docs/audits/2026-08-03-relation-structure-gate-b1-production-verification.md
          git commit -m 'docs: record Gate B1 production verification [skip ci]'
          git push origin HEAD:docs/gate-b1-production-record
