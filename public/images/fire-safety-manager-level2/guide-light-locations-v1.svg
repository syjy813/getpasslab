<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" aria-labelledby="t d"><title id="t">피난구유도등은 문 위 1.5m 이상, 복도통로유도등은 바닥 1m 이하 위치를 보여주는 공간 개념도</title><desc id="d">학습용 재구성</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526176"/></marker></defs><rect width="320" height="300" fill="white"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="600"><rect x="43" y="50" width="125" height="218" rx="8" fill="#F7F9FC" stroke="#526176" stroke-width="3"/><text x="105.5" y="167.0" font-size="22" text-anchor="middle" fill="#25334B"></text><rect x="58" y="12" width="95" height="32" rx="8" fill="#F7F9FC" stroke="#526176" stroke-width="3"/><text x="105.5" y="36.0" font-size="22" text-anchor="middle" fill="#25334B">피난구</text><rect x="190" y="194" width="112" height="38" rx="8" fill="#F7F9FC" stroke="#526176" stroke-width="3"/><text x="246" y="221.0" font-size="22" text-anchor="middle" fill="#25334B">복도통로</text><path d="M10 270L306 270" fill="none" stroke="#526176" stroke-width="5"/><text x="238" y="80" font-size="20" text-anchor="middle" fill="#25334B">≥1.5m</text><text x="245" y="254" font-size="20" text-anchor="middle" fill="#25334B">≤1m</text></g></svg>