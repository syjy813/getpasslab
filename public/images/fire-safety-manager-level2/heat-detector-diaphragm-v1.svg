<title id="title">차동식 스포트형 감지기의 작동 개념</title>
<desc id="desc">급격한 온도 상승으로 감열실 공기가 팽창하여 위쪽의 막을 밀고 고정 접점에 닿는 상태. 오른쪽의 리크구멍은 완만한 온도 변화 때 압력을 평형시키는 통로</desc>
