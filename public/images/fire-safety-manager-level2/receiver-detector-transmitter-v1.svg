<svg xmlns="http://www.w3.org/2000/svg" width="380" height="600" viewBox="0 0 380 600" role="img" aria-labelledby="t d"><title id="t">같은 화재·지구 표시에서도 발신기 표시를 함께 판독</title><desc id="d">동작시험이 해제된 정상 예시에서 감지기 신호는 화재와 3회로 표시 점등, 발신기 신호는 발신기 표시까지 추가 점등. 학습용 재구성</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#F4F6F8"/><stop offset=".48" stop-color="#DCE1E7"/><stop offset="1" stop-color="#F1F3F6"/></linearGradient><linearGradient id="button" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient><radialGradient id="lens"><stop stop-color="#FFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15785C"/></marker></defs><rect width="380" height="600" fill="white"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="12" y="14" width="356" height="47" rx="10" fill="#EBF3FB" stroke="none" stroke-width="1.5"/><text x="190" y="45" font-size="22" fill="#175C9B" font-weight="600" text-anchor="middle">동작시험 해제 · 기타 이상 없음</text><rect x="12" y="84" width="356" height="244" rx="10" fill="#D5DBE3" stroke="none" stroke-width="1.5"/><rect x="12" y="80" width="356" height="244" rx="10" fill="url(#metal)" stroke="#526176" stroke-width="1.5"/><rect x="22" y="90" width="336" height="48" rx="6" fill="#25334B" stroke="none" stroke-width="1.5"/><text x="190.0" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">감지기 신호</text><circle cx="19" cy="87" r="2.5" fill="#7B8796"/><circle cx="361" cy="87" r="2.5" fill="#7B8796"/><circle cx="19" cy="317" r="2.5" fill="#7B8796"/><circle cx="361" cy="317" r="2.5" fill="#7B8796"/><circle cx="48" cy="176" r="17" fill="#D4DAE2" stroke="#526176" stroke-width="2"/><circle cx="48" cy="176" r="12" fill="#90234B"/><circle cx="45" cy="172" r="7" fill="url(#lens)"/><text x="78" y="184" font-size="24" fill="#25334B" font-weight="600" text-anchor="start">화재</text><text x="78" y="215" font-size="22" fill="#90234B" font-weight="600" text-anchor="start">켜짐</text><circle cx="218" cy="176" r="17" fill="#D4DAE2" stroke="#526176" stroke-width="2"/><circle cx="218" cy="176" r="12" fill="#90234B"/><circle cx="215" cy="172" r="7" fill="url(#lens)"/><text x="248" y="184" font-size="24" fill="#25334B" font-weight="600" text-anchor="start">3회로</text><text x="248" y="215" font-size="22" fill="#90234B" font-weight="600" text-anchor="start">켜짐</text><circle cx="48" cy="260" r="17" fill="#D4DAE2" stroke="#526176" stroke-width="2"/><circle cx="48" cy="260" r="12" fill="#556170"/><text x="78" y="268" font-size="24" fill="#25334B" font-weight="600" text-anchor="start">발신기</text><text x="78" y="299" font-size="22" fill="#526176" font-weight="600" text-anchor="start">꺼짐</text><rect x="12" y="342" width="356" height="244" rx="10" fill="#D5DBE3" stroke="none" stroke-width="1.5"/><rect x="12" y="338" width="356" height="244" rx="10" fill="url(#metal)" stroke="#526176" stroke-width="1.5"/><rect x="22" y="348" width="336" height="48" rx="6" fill="#25334B" stroke="none" stroke-width="1.5"/><text x="190.0" y="381" font-size="25" fill="white" font-weight="700" text-anchor="middle">발신기 신호</text><circle cx="19" cy="345" r="2.5" fill="#7B8796"/><circle cx="361" cy="345" r="2.5" fill="#7B8796"/><circle cx="19" cy="575" r="2.5" fill="#7B8796"/><circle cx="361" cy="575" r="2.5" fill="#7B8796"/><circle cx="48" cy="434" r="17" fill="#D4DAE2" stroke="#526176" stroke-width="2"/><circle cx="48" cy="434" r="12" fill="#90234B"/><circle cx="45" cy="430" r="7" fill="url(#lens)"/><text x="78" y="442" font-size="24" fill="#25334B" font-weight="600" text-anchor="start">화재</text><text x="78" y="473" font-size="22" fill="#90234B" font-weight="600" text-anchor="start">켜짐</text><circle cx="218" cy="434" r="17" fill="#D4DAE2" stroke="#526176" stroke-width="2"/><circle cx="218" cy="434" r="