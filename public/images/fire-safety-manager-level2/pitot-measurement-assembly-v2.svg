<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="title desc"><title id="title">관창과 피토게이지의 측정 위치</title><desc id="desc">직사형 관창에서 봉상주수가 오른쪽으로 흐른다. 노즐 구경 D의 절반인 D/2 거리에서 피토관 입구가 왼쪽의 흐름을 마주 본다. 0~1.0MPa 압력계는 0.20MPa를 가리키는 예시이다.</desc><defs>
