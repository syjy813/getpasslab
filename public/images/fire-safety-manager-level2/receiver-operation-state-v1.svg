<svg xmlns="http://www.w3.org/2000/svg" width="380" height="535" viewBox="0 0 380 535" role="img" aria-labelledby="t d"><title id="t">동작시험과 자동복구를 선택한 시험 예시</title><desc id="d">동작시험과 자동복구가 선택되고 도통시험은 해제된 개념 수신기. 화재 표시와 1회로 지구 표시가 켜진 시험 상태. 학습용 재구성</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#F4F6F8"/><stop offset=".48" stop-color="#DCE1E7"/><stop offset="1" stop-color="#F1F3F6"/></linearGradient><linearGradient id="button" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE3EC"/></linearGradient><radialGradient id="lens"><stop stop-color="#FFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15785C"/></marker></defs><rect width="380" height="535" fill="white"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="12" y="22" width="356" height="500" rx="10" fill="#D5DBE3" stroke="none" stroke-width="1.5"/><rect x="12" y="18" width="356" height="500" rx="10" fill="url(#metal)" stroke="#526176" stroke-width="1.5"/><rect x="22" y="28" width="336" height="48" rx="6" fill="#25334B" stroke="none" stroke-width="1.5"/><text x="190.0" y="61" font-size="25" fill="white" font-weight="700" text-anchor="middle">수신기</text><circle cx="19" cy="25" r="2.5" fill="#7B8796"/><circle cx="361" cy="25" r="2.5" fill="#7B8796"/><circle cx="19" cy="511" r="2.5" fill="#7B8796"/><circle cx="361" cy="511" r="2.5" fill="#7B8796"/><circle cx="48" cy="105" r="17" fill="#D4DAE2" stroke="#526176" stroke-width="2"/><circle cx="48" cy="105" r="12" fill="#236E49"/><circle cx="45" cy="101" r="7" fill="url(#lens)"/><text x="78" y="113" font-size="24" fill="#25334B" font-weight="600" text-anchor="start">교류전원</text><text x="78" y="144" font-size="22" fill="#236E49" font-weight="600" text-anchor="start">켜짐</text><circle cx="48" cy="175" r="17" fill="#D