<svg xmlns="http://www.w3.org/2000/svg" width="380" height="570" viewBox="0 0 380 570" role="img" aria-labelledby="t d"><title id="t">겸용수조의 소화용 유효수량</title><desc id="d">일반급수 흡수구와 소화용 흡수구 사이 높이 1.5m를 소화용 유효높이로 계산하는 겸용수조 예시. 두 흡수구 밖의 부피는 계산에서 제외</desc><defs><linearGradient id="metal" x2="0%" y2="100%"><stop stop-color="#F4F6F8"/><stop offset=".5" stop-color="#DCE1E7"/><stop offset="1" stop-color="#F1F3F6"/></linearGradient><marker id="water" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15785C"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#175C9B"/></marker></defs><rect width="380" height="570" fill="white"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="48" y="50" width="198" height="440" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="2"/><rect x="57" y="65" width="180" height="412" rx="5" fill="white" stroke="white" stroke-width="2"/><rect x="58" y="100" width="178" height="80" rx="0" fill="#EFF6F2" stroke="none" stroke-width="2"/><rect x="58" y="180" width="178" height="240" rx="0" fill="#DCEDE6" stroke="none" stroke-width="2"/><rect x="58" y="420" width="178" height="55" rx="0" fill="#EEF0F3" stroke="none" stroke-width="2"/><path d="M58 100H236" fill="none" stroke="#15785C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M58 180H236M58 420H236" fill="none" stroke="#526176" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><path id="general-intake" d="M246 180H340" fill="none" stroke="#15785C" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path id="fire-intake" d="M246 420H340" fill="none" stroke="#15785C" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M285 180H322" fill="none" stroke="#15785C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#water)"/><path d="M285 420H322" fill="none" stroke="#15785C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#water)"/><text x="302" y="152" font-size="21" fill="#25334B" text-anchor="middle" font-weight="600">일반급수</text><text x="302" y="460" font-size="22" fill="#25334B" text-anchor="middle" font-weight="600">소화용</text><text x="146" y="270" font-size="24" fill="#15785C" text-anchor="middle" font-weight="700">소화용</text><text x="146" y="306" font-size="24" fill="#15785C" text-anchor="middle" font-weight="700">유효수량</text><text x="146" y="344" font-size="22" fill="#15785C" text-anchor="middle" font-weight="600">높이 1.5m</text><path d="M32 180V420M26 180H38M26 420H38" fill="none" stroke="#526176" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="146" y="458" font-size="21" fill="#526176" text-anchor="middle" font-weight="600">흡수구 아래</text><text x="190" y="540" font-size="23" fill="#25334B" text-anchor="middle" font-weight="600">두 흡수구 사이의 물</text></g></svg>
