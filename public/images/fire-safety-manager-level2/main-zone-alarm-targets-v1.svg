<svg xmlns="http://www.w3.org/2000/svg" width="380" height="492" viewBox="0 0 380 492" role="img" aria-labelledby="t d"><title id="t">주경종과 지구경종의 정지 대상</title><desc id="d">위쪽 주경종 정지스위치의 대상은 수신기 주변 주경종. 아래쪽 지구경종 정지스위치의 대상은 구역에 설치된 지구경종. 파란 화살표는 각 스위치의 정지 대상을 나타냄</desc><defs><linearGradient id="metal" x2="0%" y2="100%"><stop stop-color="#F4F6F8"/><stop offset=".5" stop-color="#DCE1E7"/><stop offset="1" stop-color="#F1F3F6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#175C9B"/></marker><marker id="water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15785C"/></marker><marker id="error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90234B"/></marker></defs><rect width="380" height="492" fill="white"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="16" y="18" width="348" height="218" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="38" y="36" width="304" height="49" rx="8" fill="#175C9B" stroke="#175C9B" stroke-width="1.5"/><text x="190" y="69" font-size="24" fill="white" font-weight="700" text-anchor="middle">주경종 정지</text><path d="M190 96V121" fill="none" stroke="#175C9B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M66 190Q76 177 75 162Q76 141 88 141Q100 141 101 162Q100 177 110 190Z" fill="none" stroke="#526176" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="88" cy="199" r="5" fill="#526176"/><text x="147" y="165" font-size="22" fill="#526176" font-weight="600" text-anchor="start">수신기 주변</text><text x="147" y="200" font-size="25" fill="#25334B" font-weight="700" text-anchor="start">주경종</text><rect x="16" y="256" width="348" height="218" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="38" y="274" width="304" height="49" rx="8" fill="#175C9B" stroke="#175C9B" stroke-width="1.5"/><text x="190" y="307" font-size="24" fill="white" font-weight="700" text-anchor="middle">지구경종 정지</text><path d="M190 334V359" fill="none" stroke="#175C9B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M66 428Q76 415 75 400Q76 379 88 379Q100 379 101 400Q100 415 110 428Z" fill="none" stroke="#526176" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="88" cy="437" r="5" fill="#526176"/><text x="147" y="403" font-size="22" fill="#526176" font-weight="600" text-anchor="start">각 경계구역</text><text x="147" y="438" font-size="25" fill="#25334B" font-weight="700" text-anchor="start">지구경종</text></g></svg>
