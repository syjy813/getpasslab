<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc"><title id="title">체절과 최대유량 시험 결과</title><desc id="desc">정격값 대비 유량과 압력의 예시 곡선. 체절 135%는 140% 상한 이내이고, 정격점은 100%, 최대유량 150%에서 압력 61.7%는 65% 하한에 미달한다. 곡선은 학습용 예시이다.</desc><defs>
