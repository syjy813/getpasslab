<svg xmlns="http://www.w3.org/2000/svg" width="380" height="534" viewBox="0 0 380 534" role="img" aria-labelledby="t d"><title id="t">평상시 표시와 스위치주의</title><desc id="d">주요 표시부 비교. 평상시는 교류전원과 전압지시 정상 켜짐, 예비전원감시와 스위치주의 꺼짐. 별도 예시의 스위치주의는 켜짐 또는 점멸로 정상 위치를 벗어난 스위치를 알림</desc><defs><linearGradient id="metal" x2="0%" y2="100%"><stop stop-color="#F4F6F8"/><stop offset=".5" stop-color="#DCE1E7"/><stop offset="1" stop-color="#F1F3F6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#175C9B"/></marker><marker id="water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15785C"/></marker><marker id="error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90234B"/></marker></defs><rect width="380" height="534" fill="white"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="16" y="18" width="348" height="306" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="1.5"/><rect x="28" y="30" width="324" height="44" rx="6" fill="#25334B" stroke="#25334B" stroke-width="1.5"/><text x="190" y="61" font-size="24" fill="white" font-weight="700" text-anchor="middle">평상시 감시</text><circle cx="48" cy="104" r="13" fill="#15785C" stroke="white" stroke-width="3"/><text x="74" y="112" font-size="23" fill="#25334B" font-weight="600" text-anchor="start">교류전원</text><text x="334" y="112" font-size="22" fill="#15785C" font-weight="600" text-anchor="end">켜짐</text><circle cx="48" cy="166" r="13" fill="#15785C" stroke="white" stroke-width="3"/><text x="74" y="174" font-size="23" fill="#25334B" font-weight="600" text-anchor="start">전압지시 정상</text><text x="334" y="174" font-size="22" fill="#15785C" font-weight="600" text-anchor="end">켜짐</text><circle cx="48" cy="228" r="13" fill="#526176" stroke="white" stroke-width="3"/><text x="74" y="236" font-size="23" fill="#25334B" font-weight="600" text-anchor="start">예비전원감시</text><text x="334" y="236" font-size="22" fill="#526176" font-weight="600" text-anchor="end">꺼짐</text><circle cx="48" cy="290" r="13" fill="#526176" stroke="white" stroke-width="3"/><text x="74" y="298" font-size="23" fill="#25334B" font-weight="600" text-anchor="start">스위치주의</text><text x="334" y="298" font-size="22" fill="#526176" font-weight="600" text-anchor="end">꺼짐</text><rect x="16" y="348" width="348" height="168" rx="12" fill="#FFF9EB" stroke="#C4AA71" stroke-width="1.5"/><text x="36" y="383" font-size="21" fill="#855400" font-weight="600" text-anchor="start">스위치가 정상 위치를 벗어난 경우</text><circle cx="48" cy="420" r="13" fill="#855400" stroke="white" stroke-width="3"/><text x="74" y="428" font-size="23" fill="#25334B" font-weight="600" text-anchor="start">스위치주의</text><text x="334" y="463" font-size="22" fill="#855400" font-weight="600" text-anchor="end">켜짐 / 점멸</text><text x="36" y="495" font-size="22" fill="#855400" font-weight="600" text-anchor="start">시험·정지 스위치 위치 확인</text></g></svg>
