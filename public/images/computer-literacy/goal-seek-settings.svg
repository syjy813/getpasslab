<svg xmlns="http://www.w3.org/2000/svg" width="480" height="336" viewBox="0 0 480 336" role="img" aria-labelledby="title desc">
<title id="title">목표값 찾기: 세 항목에 입력할 값</title><desc id="desc">수식 셀 $E$3, 찾는 값 70, 값을 바꿀 셀 $B$3 — 목표 70은 문제의 조건에서 확인</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#191F28} .small{font-size:18px} .label{font-size:20px} .value{font-size:24px;font-weight:700} .blue{fill:#1E40AF} .muted{fill:#626D7A}</style>
