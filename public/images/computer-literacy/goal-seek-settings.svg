<text x="28" y="48" class="label" font-weight="700">목표값 찾기</text>
<path d="M436 35L448 47M448 35L436 47" stroke="#626D7A" stroke-width="2"/>
<rect x="28" y="80" width="32" height="32" rx="16" fill="#1D4ED8"/>
<rect x="28" y="126" width="32" height="32" rx="16" fill="#333D4B"/>
<rect x="28" y="172" width="32" height="32" rx="16" fill="#F59E0B"/>
