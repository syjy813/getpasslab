<svg xmlns="http://www.w3.org/2000/svg" width="390" height="480" viewBox="0 0 390 480" role="img" aria-labelledby="title desc">
<title id="title">주변 지반을 포함한 흙막이 지보공 입체 절개도</title>
<desc id="desc">주변 흙과 굴착바닥 아래 지반을 절개하여 보여 준 버팀대식 흙막이 지보공. 양쪽 벽의 수평 흙막이판 앞에 엄지말뚝이 서 있고, 벽을 따라 이어지는 띠장 사이를 세 개의 버팀대가 가로지른다. 말뚝은 바닥 아래로 이어지며 치수와 접합 상세는 생략한다.</desc>
