<svg xmlns="http://www.w3.org/2000/svg" width="360" height="390" viewBox="0 0 360 390" role="img" aria-labelledby="title desc">
<title id="title">드릴의 척과 고정된 일감</title><desc id="desc">스핀들에 연결된 척이 드릴날을 회전시키고, 바이스에 고정된 일감에 구멍을 뚫음. 척 렌치는 꽂혀 있지 않음. 학습용 재구성으로 방호장치와 조작부는 생략함.</desc>
