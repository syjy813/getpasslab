<svg xmlns="http://www.w3.org/2000/svg" width="390" height="460" viewBox="0 0 390 460" role="img" aria-labelledby="title desc">
<title id="title">흙막이 지보공 부재 배치</title>
<desc id="desc">학습용 버팀대식 구조. 흙막이판이 수직 엄지말뚝 사이에 놓이고, 벽에 평행한 띠장을 두 벽 사이의 버팀대가 연결한다. 내부를 보여주기 위해 앞쪽 흙막이판 일부를 생략했다.</desc>
