<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">기계의 다섯 가지 끼임 위험점</title>
  <desc id="desc">협착점, 끼임점, 절단점, 물림점, 접선물림점의 운동 관계와 위험 위치를 비교한 학습용 그림</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5Z" fill="#2563eb"/>
    </marker>
    <style>
      .label{font:700 25px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.note{font:17px Arial,'Noto Sans KR',sans-serif;fill:#475569}.part{fill:#cbd5e1;stroke:#334155;stroke-width:4}.move{fill:#93c5fd;stroke:#1d4ed8;stroke-width:4}.danger{fill:#ef4444;opacity:.85}.arrow{fill:none;stroke:#2563eb;stroke-width:7;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="label" font-size="30">움직이는 부분과 고정부의 관계로 위험점을 구분</text>

  <g transform="translate(35 85)">
    <rect width="350" height="260" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="175" y="40" text-anchor="middle" class="label">협착점</text>
    <rect x="50" y="92" width="76" height="92" rx="8" class="part"/>
    <rect x="230" y="92" width="76" height="92" rx="8" class="move"/>
    <path d="M270 74H155" class="arrow"/>
    <path d="M152 138l24-24 24 24-24 24Z" class="danger"/>
    <text x="175" y="225" text-anchor="middle" class="note">왕복운동부와 고정부 사이</text>
  </g>

  <g transform="translate(425 85)">
    <rect width="350" height="260" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="175" y="40" text-anchor="middle" class="label">끼임점</text>
    <circle cx="150" cy="137" r="64" class="move"/>
    <path d="M150 86a51 51 0 0 1 47 35" class="arrow"/>
    <rect x="213" y="78" width="74" height="118" rx="8" class="part"/>
    <path d="M207 137l18-18 18 18-18 18Z" class="danger"/>
    <text x="175" y="225" text-anchor="middle" class="note">회전운동부와 고정부 사이</text>
  </g>

  <g transform="translate(815 85)">
    <rect width="350" height="260" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="175" y="40" text-anchor="middle" class="label">절단점</text>
    <circle cx="175" cy="130" r="62" class="move"/>
    <path d="M175 68v18M175 174v18M113 130h18M219 130h18M131 86l13 13M206 161l13 13M219 86l-13 13M144 161l-13 13" stroke="#1d4ed8" stroke-width="12"/>
    <path d="M175 80a50 50 0 0 1 42 24" class="arrow"/>
    <rect x="82" y="183" width="186" height="17" rx="4" fill="#94a3b8"/>
    <path d="M161 176l14-23 14 23Z" class="danger"/>
    <text x="175" y="235" text-anchor="middle" class="note">회전날·커터와 재료 접촉부</text>
  </g>

  <g transform="translate(230 390)">
    <rect width="350" height="260" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="175" y="40" text-anchor="middle" class="label">물림점</text>
    <circle cx="124" cy="133" r="59" class="move"/>
    <circle cx="226" cy="133" r="59" class="move"/>
    <path d="M124 82a50 50 0 0 1 35 20" class="arrow"/>
    <path d="M226 82a50 50 0 0 0-35 20" class="arrow"/>
    <path d="M160 133l15-20 15 20-15 20Z" class="danger"/>
    <text x="175" y="225" text-anchor="middle" class="note">서로 반대방향 회전부 사이</text>
  </g>

  <g transform="translate(620 390)">
    <rect width="350" height="260" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="175" y="40" text-anchor="middle" class="label">접선물림점</text>
    <circle cx="226" cy="133" r="64" class="move"/>
    <path d="M226 81a50 50 0 0 1 43 25" class="arrow"/>
    <path d="M56 89h169v31H56z" fill="#64748b"/>
    <path d="M56 147h169v31H56z" fill="#64748b"/>
    <path d="M195 104l18-18 18 18-18 18Z" class="danger"/>
    <text x="175" y="225" text-anchor="middle" class="note">벨트·체인과 회전체의 접선부</text>
  </g>
  <g transform="translate(430 674)">
    <circle cx="0" cy="0" r="9" fill="#ef4444"/><text x="18" y="6" class="note">붉은 표시: 대표적인 위험 위치</text>
  </g>
</svg>
