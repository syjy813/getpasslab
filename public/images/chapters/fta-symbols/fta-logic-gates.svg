<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc">
  <title id="title">FTA AND·OR·억제 게이트</title>
  <desc id="desc">AND와 OR의 두 입력 연결, 억제 게이트의 한 입력과 옆 조건 P를 비교한 학습용 도식. 위쪽은 출력, 아래쪽은 입력</desc>
  <rect width="360" height="400" rx="8" fill="#FFFFFF"/>
  <g stroke="#526176" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
