    <g transform="translate(134 285)"><path d="M0-45 38-22V22L0 45-38 22V-22Z"/><path d="M0-45V-72M0 45V65M38 0H66"/><rect x="66" y="-19" width="110" height="38" rx="19"/></g>
  </g>
  <g fill="#25334B" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">
    <g font-size="20" font-weight="700"><text x="90" y="185">AND 게이트</text><text x="270" y="185">OR 게이트</text><text x="134" y="383">억제 게이트</text></g>
