<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">재해분석 도구 네 종류의 형태 비교</title>
  <desc id="desc">파레토도, 특성요인도, 클로즈분석, 관리도의 대표 형태를 비교한 그림</desc>
  <rect width="1000" height="650" rx="28" fill="#f8fafc"/>
  <text x="500" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">형태를 보면 분석 목적이 보인다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(40 78)">
      <rect width="440" height="245" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="25" y="38" font-size="22" font-weight="700" fill="#1d4ed8">파레토도</text>
      <path d="M58 196h315M58 75v121" stroke="#64748b" stroke-width="3"/>
      <rect x="78" y="102" width="48" height="94" fill="#2563eb"/>
      <rect x="142" y="126" width="48" height="70" fill="#3b82f6"/>
      <rect x="206" y="150" width="48" height="46" fill="#60a5fa"/>
      <rect x="270" y="169" width="48" height="27" fill="#93c5fd"/>
      <path d="M102 98c53 8 99 23 128 38 37 20 70 28 119 31" fill="none" stroke="#f97316" stroke-width="5"/>
      <circle cx="349" cy="167" r="6" fill="#f97316"/>
      <text x="215" y="225" text-anchor="middle" font-size="16" fill="#475569">내림차순 막대 + 누적곡선</text>
    </g>
    <g transform="translate(520 78)">
      <rect width="440" height="245" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="25" y="38" font-size="22" font-weight="700" fill="#1d4ed8">특성요인도</text>
