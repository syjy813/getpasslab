      <polyline points="66,132 112,119 158,145 204,110 250,137 296,100 342,126" fill="none" stroke="#2563eb" stroke-width="5"/>
      <g fill="#2563eb"><circle cx="66" cy="132" r="5"/><circle cx="112" cy="119" r="5"/><circle cx="158" cy="145" r="5"/><circle cx="204" cy="110" r="5"/><circle cx="250" cy="137" r="5"/><circle cx="296" cy="100" r="5"/><circle cx="342" cy="126" r="5"/></g>
