        <path d="M55 0v132M110 0v132M165 0v132M0 44h220M0 88h220" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="27" cy="22" r="10" fill="#60a5fa"/><circle cx="82" cy="66" r="17" fill="#2563eb"/>
        <circle cx="137" cy="22" r="13" fill="#3b82f6"/><circle cx="192" cy="110" r="19" fill="#1d4ed8"/>
        <circle cx="27" cy="110" r="7" fill="#93c5fd"/><circle cx="137" cy="66" r="8" fill="#93c5fd"/>
