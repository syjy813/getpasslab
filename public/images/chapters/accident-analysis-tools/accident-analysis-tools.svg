      <path d="M106 137L72 92M165 137l-35-58M224 137l-35-45M106 137l-34 45M165 137l-35 58M224 137l-35 45" stroke="#0f172a" stroke-width="4"/>
      <path d="M327 105h76v64h-76l-30-32Z" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/>
      <text x="365" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">재해</text>
      <text x="215" y="225" text-anchor="middle" font-size="16" fill="#475569">원인 → 결과를 생선뼈처럼 전개</text>
    </g>
    <g transform="translate(40 355)">
      <rect width="440" height="245" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="25" y="38" font-size="22" font-weight="700" fill="#1d4ed8">클로즈분석</text>
