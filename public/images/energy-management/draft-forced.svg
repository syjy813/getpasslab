<svg xmlns="http://www.w3.org/2000/svg" width="560" height="275" viewBox="0 0 560 275" role="img" aria-labelledby="title desc">
<title id="title">압입통풍 원리 · 앞에서 밀어 넣음</title>
<desc id="desc">연소실 앞쪽 FD 송풍기가 연소용 공기를 밀어 넣고 배기가스는 연돌로 배출되는 흐름</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#25334B}
.head{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#516176}.chamber{font-size:24px;font-weight:700}.fan-label{font-size:17px;font-weight:700}.pressure{font-size:16px;font-weight:700}.legend{font-size:16px;font-weight:700}
</style>
<defs>
<marker id="air" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#195FA8"/></marker>
<marker id="gas" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#BD4936"/></marker>
</defs>
<rect width="560" height="275" rx="14" fill="#FFFFFF"/>
<text x="20" y="34" class="head">압입통풍</text><text x="20" y="57" class="sub">앞에서 밀어 넣음</text>
<rect x="174" y="68" width="213" height="27" rx="13" fill="#F1F5FA" stroke="#C8D1DD"/>
<text x="280" y="87" text-anchor="middle" class="pressure">노내압: 양압 경향</text>
<!-- 연돌과 연소실을 간단히 재구성한 학습용 개념도 -->
<path d="M480 166 V62 M500 166 V62 M476 62 H504" fill="none" stroke="#677587" stroke-width="6" stroke-linecap="round"/>
<text x="490" y="45" text-anchor="middle" class="sub">연돌</text>
<rect x="168" y="109" width="203" height="102" rx="12" fill="#FFFAF3" stroke="#677587" stroke-width="3"/>
<text x="270" y="143" text-anchor="middle" class="chamber">연소실</text>
<path d="M271 194 C255 179 263 168 269 157 C272 166 282 168 281 176 C289 171 295 182 286 194Z" fill="#E87B2A"/>
<path d="M271 191 C266 184 272 179 275 173 C281 182 282 186 278 191Z" fill="#F9BE52"/>
<path d="M27 160 H76 M128 160 H165" fill="none" stroke="#195FA8" stroke-width="4" stroke-linecap="round" marker-end="url(#air)"/><g transform="translate(102 160)">
<circle r="25" fill="#EAF4FF" stroke="#175F9E" stroke-width="3"/>
<path d="M0 -4 C-10 -23 14 -22 7 -4 C23 -12 24 12 5 7 C10 23 -13 22 -7 5 C-24 9 -21 -14 -5 -7 Z" fill="#4C9DDE"/>
<circle r="5" fill="#31425B"/>
</g><text x="102" y="225" text-anchor="middle" class="fan-label">FD 송풍기</text>
<path d="M372 160 H490 V76" fill="none" stroke="#BD4936" stroke-width="4" stroke-linecap="round" marker-end="url(#gas)"/><path d="M382 160 H460" fill="none" stroke="#BD4936" stroke-width="3" marker-end="url(#gas)"/>
<path d="M20 246 H540" stroke="#E0E6ED" stroke-width="1"/>
<path d="M25 259 H59" stroke="#195FA8" stroke-width="3" marker-end="url(#air)"/>
<text x="70" y="264" class="legend">연소용 공기</text>
<path d="M291 259 H325" stroke="#BD4936" stroke-width="3" marker-end="url(#gas)"/>
<text x="336" y="264" class="legend">배기가스</text>
