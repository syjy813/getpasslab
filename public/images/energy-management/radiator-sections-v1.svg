<svg xmlns="http://www.w3.org/2000/svg" width="390" height="405" viewBox="0 0 390 405" role="img" aria-labelledby="t d">
<title id="t">온수 방열기 필요 쪽수 계산</title><desc id="d">난방부하 6000킬로칼로리 매시, 표준 방열량 450킬로칼로리 매 제곱미터 매시, 한 쪽 면적 0.15제곱미터이므로 88.89를 올려 89쪽. 여섯 쪽은 반복 단위를 보여 주는 예시다.</desc>
<defs>
<linearGradient id="wall" x2="1" y2="1"><stop stop-color="#F9F3E8"/><stop offset="1" stop-color="#E8DBC9"/></linearGradient>
<linearGradient id="metal" x2="1" y2="0"><stop stop-color="#C7D1DC"/><stop offset=".43" stop-color="#F8FAFC"/><stop offset="1" stop-color="#A5B5C3"/></linearGradient>
<filter id="shadow" x="-20%" y="-30%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#25334B" flood-opacity=".13"/></filter>
</defs>
<rect width="390" height="405" fill="#F7F9FC"/><rect x="12" y="12" width="366" height="381" rx="18" fill="#FFFFFF" stroke="#DEE5ED"/>
<rect x="32" y="36" width="326" height="68" rx="15" fill="#F7F9FC" stroke="#D8E0E9"/>
<text x="195" y="64" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#25334B">난방부하 6,000 kcal/h</text><text x="195" y="91" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15785C">온수 450 kcal/(m²·h)</text><path d="M52 177 H338" stroke="#526176" stroke-width="9" stroke-linecap="round"/>
<path d="M52 246 H338" stroke="#526176" stroke-width="9" stroke-linecap="round"/>
<rect x="58" y="149" width="28" height="125" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="3" filter="url(#shadow)"/><rect x="104" y="149" width="28" height="125" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="3" filter="url(#shadow)"/><rect x="150" y="149" width="28" height="125" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="3" filter="url(#shadow)"/><rect x="196" y="149" width="28" height="125" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="3" filter="url(#shadow)"/><rect x="242" y="149" width="28" height="125" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="3" filter="url(#shadow)"/><rect x="288" y="149" width="28" height="125" rx="12" fill="url(#metal)" stroke="#526176" stroke-width="3" filter="url(#shadow)"/><path d="M58 285 V294 H86 V285" fill="none" stroke="#526176" stroke-width="2"/>
<text x="72" y="315" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#25334B">1쪽 = 0.15 m²</text><text x="195" y="353" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#25334B">6,000 ÷ (450 × 0.15)</text><text x="195" y="384" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#236E49">= 88.89 → 89쪽</text>
</svg>
