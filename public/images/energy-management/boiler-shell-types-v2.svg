<svg xmlns="http://www.w3.org/2000/svg" width="390" height="675" viewBox="0 0 390 675" role="img" aria-labelledby="title description">
<title id="title">원통형 보일러 노통식·연관식·노통연관식 구조</title>
<desc id="description">측면을 잘라 본 학습용 구조 비교. 세 형식 모두 연소가스가 관 안, 물이 관 밖에 있다. 노통식은 큰 가스 통로, 연관식은 가는 연관 다발, 노통연관식은 두 구조가 함께 있다. 연소가스의 실제 왕복 경로는 표시하지 않는다.</desc>
<defs>
  <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#F5F8FC"/><stop offset="1" stop-color="#DDE6EF"/></linearGradient>
  <linearGradient id="fire" x1="0" x2="1"><stop stop-color="#F9CA7A"/><stop offset="1" stop-color="#F5A270"/></linearGradient>
  <marker id="water-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#15785C" stroke-width="1.5" stroke-linejoin="round"/></marker>
  <marker id="steam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#734BA6" stroke-width="1.5" stroke-linejoin="round"/></marker>
  <style>
    text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#25334B}
    .type{font-size:21px;font-weight:700}
    .label{font-size:17px;font-weight:700}
    .small{font-size:15px;font-weight:600}
    .waterText{fill:#15785C} .gasText{fill:#A94E32} .steamText{fill:#734BA6} .heatText{fill:#B45309}
    .body{fill:url(#metal);stroke:#526176;stroke-width:2.4}
    .water{fill:#DDF1E9}
    .gas{fill:#FCEDE7;stroke:#A94E32;stroke-width:2.2}
    .pipe{fill:none;stroke:#526176;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .pipeWater{fill:none;stroke:#15785C;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .pipeSteam{fill:none;stroke:#734BA6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .hair{fill:none;stroke:#A9B8C7;stroke-width:1.2}
  </style>
</defs>
