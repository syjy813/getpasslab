<svg xmlns="http://www.w3.org/2000/svg" width="390" height="360" viewBox="0 0 390 360" role="img" aria-labelledby="t d">
<title id="t">평판 한 겹의 정상 열전도 계산 구조</title>
<desc id="d">면적 10제곱미터, 두께 13센티미터를 0.13미터로 바꾸고, 고온 200도에서 저온 20도로 열이 흐르는 학습용 개념도</desc>
<defs><linearGradient id="slab"><stop stop-color="#E7DBBF"/><stop offset=".48" stop-color="#F9F4E7"/><stop offset="1" stop-color="#CDBB9C"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#25334B" flood-opacity=".2"/></filter></defs>
<rect width="390" height="360" fill="#F7F9FC"/><rect x="14" y="14" width="362" height="332" rx="20" fill="#FFFFFF" stroke="#DEE5ED"/>
<g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" text-anchor="middle" font-weight="700" fill="#25334B">
<text x="75" y="81" font-size="19" fill="#A54C17">200℃</text><text x="315" y="81" font-size="19" fill="#1769AA">20℃</text>
<text x="195" y="56" font-size="18">A = 10 m²</text>
<text x="195" y="250" font-size="20">L = 13 cm → 0.13 m</text>
<text x="195" y="292" font-size="17" fill="#526176">k = 0.02 kcal/(m·h·℃)</text>
<text x="195" y="326" font-size="20" fill="#236E49">Q ≈ 276.9 kcal/h</text></g>
