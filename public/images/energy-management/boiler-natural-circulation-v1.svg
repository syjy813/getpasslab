<svg xmlns="http://www.w3.org/2000/svg" width="390" height="420" viewBox="0 0 390 420" role="img" aria-labelledby="title description">
  <title id="title">수관 보일러의 자연순환 경로</title>
  <desc id="description">상부 증기드럼의 물은 왼쪽 강수관을 따라 하부 헤더로 내려간다. 오른쪽의 가열된 승수관 안에서는 물과 증기의 혼합물이 다시 증기드럼으로 올라간다. 두 관은 아래 헤더와 위 드럼으로 연결된다. 학습용 재구성이다.</desc>
  <defs>
    <clipPath id="drum-interior"><rect x="71" y="55" width="238" height="86" rx="31"/></clipPath>
    <marker id="water-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#FFFFFF" stroke="#15785C" stroke-width="1.15" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#25334B}
      .part{font-size:20px;font-weight:700}
      .medium{font-size:19px;font-weight:600}
      .water-text{fill:#15785C}
      .heat-text{fill:#855400;font-size:18px;font-weight:700}
      .pipe{fill:none;stroke:#526176;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
      .pipe-water{fill:none;stroke:#E1F2EA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#15785C;stroke-width:3;stroke-linecap:round}
      .callout{fill:none;stroke:#526176;stroke-width:2;stroke-linecap:round}
    </style>
  </defs>

  <rect width="390" height="420" fill="#FFFFFF"/>
  <!-- Heating is outside the riser; it is not a hot-gas path inside the tube. -->
  <rect x="229" y="167" width="54" height="145" rx="22" fill="#FFF4E5"/>

  <!-- Both pipes join the upper drum and the lower header. -->
  <path d="M117 137 V335 M260 137 V335" class="pipe"/>
  <path d="M117 137 V335 M260 137 V335" class="pipe-water"/>

  <rect x="68" y="52" width="244" height="92" rx="34" fill="#FFFFFF" stroke="#526176" stroke-width="3"/>
  <g clip-path="url(#drum-interior)">
    <rect x="71" y="105" width="238" height="40" fill="#E1F2EA"/>
    <path d="M71 105 Q91 101 111 105 T151 105 T191 105 T231 105 T271 105 T311 105" fill="none" stroke="#15785C" stroke-width="3"/>
  </g>
  <text x="190" y="85" text-anchor="middle" class="part">증기드럼</text>
  <text x="190" y="129" text-anchor="middle" class="medium water-text">물</text>

  <rect x="91" y="328" width="195" height="63" rx="24" fill="#E1F2EA" stroke="#526176" stroke-width="3"/>
  <text x="188" y="367" text-anchor="middle" class="part">하부 헤더</text>

  <!-- Heavier water descends; the heated water/steam mixture rises. -->
  <path d="M117 206 V266" class="flow" marker-end="url(#water-arrow)"/>
  <path d="M260 272 V212" class="flow" marker-end="url(#water-arrow)"/>

  <text x="24" y="207" class="part">강수관</text>
  <text x="24" y="236" class="medium water-text">물</text>
  <path d="M86 210 H103" class="callout"/>

  <path d="M274 209 H282" class="callout"/>
  <text x="289" y="207" class="part">승수관</text>
  <text x="289" y="239" class="medium">물·증기</text>
  <text x="289" y="263" class="medium">혼합물</text>
  <text x="289" y="303" class="heat-text">관 밖의 열</text>
</svg>
