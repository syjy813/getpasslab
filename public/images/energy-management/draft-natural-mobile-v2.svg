<svg xmlns="http://www.w3.org/2000/svg" width="390" height="290" viewBox="0 0 390 290" role="img" aria-labelledby="title desc">
<title id="title">자연통풍: 팬 없이 공기가 유입되고 연소가스가 연돌로 배출되는 개념도</title>
<desc id="desc">굴뚝 안팎의 온도·밀도차에 따른 자연통풍. 팬 없이 외부 공기가 연소실로 유입되고 배기가스가 연돌을 통해 상승 배출되며 노내는 부압 경향을 보인다. 학습용 재구성.</desc>
<style><![CDATA[
text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#25334B}
.label{font-size:17px;font-weight:700}
.fan-label{font-size:15px;font-weight:700}
.note{font-size:15px;font-weight:700}
.air-label{fill:#1769AA}
.gas-label{fill:#A94E32}
.pipe-air{fill:none;stroke:#1769AA;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.pipe-gas{fill:none;stroke:#A94E32;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
]]></style>
<defs>
 <marker id="airArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8Z" fill="#1769AA"/></marker>
 <marker id="gasArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8Z" fill="#A94E32"/></marker>
</defs>
<rect width="390" height="290" fill="#FFFFFF"/>
<!-- Title and summary are in the chapter's HTML figcaption, not duplicated in this SVG. -->
<rect x="19" y="14" width="193" height="35" rx="8" fill="#F7F9FC" stroke="#CBD5E1"/>
<text x="30" y="37" class="note">노내압: 부압(-) 경향</text>
<!-- The same furnace and chimney positions are used across all three mobile diagrams. -->
<text x="343" y="81" text-anchor="middle" class="label">연돌</text>
<rect x="329" y="92" width="28" height="106" rx="3" fill="#F7F9FC" stroke="#526176" stroke-width="2.5"/>
<path d="M327 92 H359" fill="none" stroke="#526176" stroke-width="3.5" stroke-linecap="round"/>
<text x="17" y="173" class="label air-label">외부 공기</text>
<text x="202" y="159" text-anchor="middle" class="label">연소실</text>
<rect x="142" y="168" width="121" height="76" rx="10" fill="#FFF8ED" stroke="#526176" stroke-width="3"/>
<!-- Air always enters from the left. -->
<path d="M20 205 H139" class="pipe-air" marker-end="url(#airArrow)"/>
<path d="M143 205 H179" class="pipe-air" marker-end="url(#airArrow)"/>
<!-- Furnace flame and downstream exhaust. -->
<path d="M201 228 C189 220 194 210 200 204 C201 212 208 211 207 218 C216 213 221 225 212 229Z" fill="#B45309"/>
<path d="M202 226 C199 221 203 217 204 215 C209 221 210 225 206 226Z" fill="#FFD07E"/>
<path d="M263 205 H343 V107" class="pipe-gas" marker-end="url(#gasArrow)"/>
<text x="318" y="144" text-anchor="end" class="label gas-label">배기가스</text>
</svg>