<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440">
<title>선반의 척·일감·바이트와 회전·절삭 위치</title>
<desc>전체 선반에서 가공부를 확대한 그림. 척은 일감을 잡고 함께 회전하며, 바이트 끝은 일감의 표면을 깎는다. 회전방향은 움직임을 보여주는 예시이고 실제 기종의 설정을 지정하지 않는다.</desc>
