<title>플레이너의 바이트·일감·테이블·베드</title>
<desc>테이블에 고정한 일감이 고정 베드 위에서 왕복하고, 공구대에 짧게 설치한 단인 바이트가 일감의 상면에 접촉한다. 확대부의 선분은 돌출 길이 표시이며 운동 화살표가 아니다. 방호장치·구동부·피트와 상세 이송은 생략했다.</desc>
