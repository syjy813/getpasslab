<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2000" viewBox="0 0 1200 2000">
<title>고정식 드릴의 스핀들·척·드릴날·일감·바이스</title>
<desc>전체 드릴과 가공부 확대. 주축인 스핀들에 연결된 척은 드릴날을 잡고 함께 회전하며, 일감은 테이블에 부착된 바이스에 고정된다. 척 렌치는 꽂혀 있지 않다. 방호장치는 생략했고 화살표는 회전의 한 예시다.</desc>
